name: Idea or suggestion
description: Propose content, a balance adjustment, or a usability improvement.
title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are discussed before they are planned. A good idea is not a release-date promise.
  - type: dropdown
    id: category
    attributes:
      label: Suggestion type
      options:
        - Content or technologies
        - Balance or pace
        - Interface or usability
        - Compatibility
        - Documentation or translation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Need or problem
      description: Which part of the game would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Explain the desired behaviour, not only a technical solution.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Game context
      description: Starting age, pace, version, and other mods if they affect the proposal.
