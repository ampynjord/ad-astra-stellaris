name: Bug report
description: Report one reproducible problem with Ad Astra.
title: "[bug] "
labels: ["bug", "source: github", "status: needs information"]
body:
  - type: markdown
    attributes:
      value: |
        Create one issue for one reproducible problem. Search existing issues first.
        If this report already has a linked Discord forum thread, add information there instead of creating a duplicate issue.

  - type: dropdown
    id: source
    attributes:
      label: Ad Astra build source
      options:
        - Steam Workshop stable release
        - Private beta local build
        - Local development build
        - I do not know
    validations:
      required: true

  - type: input
    id: ad_astra_version
    attributes:
      label: Ad Astra version or beta tag
      description: Shown by the Stellaris launcher or beta archive name.
      placeholder: "1.3.2 or 1.4.0-beta.1"
    validations:
      required: true

  - type: input
    id: stellaris_version
    attributes:
      label: Stellaris version and checksum
      description: Include both values from the main menu when possible.
      placeholder: "4.x.x, checksum abcdef"
    validations:
      required: true

  - type: input
    id: test_card
    attributes:
      label: Beta test card, if applicable
      description: For example, B04. Leave blank for the stable Workshop release.

  - type: dropdown
    id: starting_age
    attributes:
      label: Starting age
      options:
        - Stone Age
        - Bronze Age
        - Iron Age
        - Late Medieval Age
        - Renaissance
        - Steam Age
        - Industrial Age
        - Machine Age
        - Atomic Age
        - Early Space Age
        - Emerged empire
        - I do not remember
    validations:
      required: true

  - type: dropdown
    id: ascent_pace
    attributes:
      label: Ascent pace
      options:
        - Normal
        - Fast
        - Slow
        - Very slow
        - I do not remember
    validations:
      required: true

  - type: input
    id: in_game_date
    attributes:
      label: In-game date
      description: The date shown when the problem first appeared.
      placeholder: "2247.03.18"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: DLC, other mods, and load order
      description: List enabled DLC and every active mod in playset order. Write "Ad Astra only" for a clean test.
      placeholder: |
        DLC: ...
        Mods and load order: Ad Astra, ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: What happened instead? Include the first action or date where it appeared.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Exact steps to reproduce
      placeholder: |
        1. Start a new game with...
        2. Select...
        3. Advance until...
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction frequency
      options:
        - Every time
        - Sometimes
        - Happened once
        - I could not retry
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround tried
      description: Say "none" when no workaround was attempted.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and attachments
      description: Attach the save, `Documents/Paradox Interactive/Stellaris/logs/error.log`, and screenshots or video whenever possible. Do not include passwords, tokens, or private information.
      placeholder: |
        Save attached: yes / no
        error.log attached: yes / no
        Screenshot or video attached: yes / no
        Relevant error.log lines, if any:
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not create a duplicate report.
          required: true
        - label: I started a new game after installing this Ad Astra version, or explained why I could not.
          required: true
