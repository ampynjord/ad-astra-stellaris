name: Bug report
description: Report a reproducible problem with Ad Astra.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping test Ad Astra. Please search existing issues first and include the requested context; it is required to reproduce progression and compatibility problems.

  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Describe the actual result and the result you expected.
      placeholder: "At the end of the Bronze Age, no research options appeared..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new game with...
        2. Select...
        3. Advance until...
    validations:
      required: true

  - type: dropdown
    id: age
    attributes:
      label: Starting age
      options:
        - Stone Age
        - Bronze Age
        - Iron Age
        - Late Medieval Age
        - Renaissance
        - Steam Age
        - Industrial Age
        - Machine Age
        - Atomic Age
        - Early Space Age
        - I do not remember
    validations:
      required: true

  - type: dropdown
    id: pace
    attributes:
      label: Ascension pace
      options:
        - Normal
        - Fast
        - Slow
        - Very slow
        - I do not remember
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: In-game date
      description: The date shown in the top-right corner when the problem occurred.
      placeholder: "2247.03.18"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Ad Astra version
      description: Shown by the Stellaris launcher.
      placeholder: "1.3.1"
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: error.log
      description: Paste the complete `Documents/Paradox Interactive/Stellaris/logs/error.log` after reproducing the problem. The mod's normal "already exists" override messages can stay in the log.
      render: text
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Active mods and load order
      description: List every active mod in playset order. Write "Ad Astra only" for a clean test.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I started a new game after installing this version.
          required: true
        - label: I searched existing issues for this problem.
          required: true
