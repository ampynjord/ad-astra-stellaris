name: Idea / Idée
description: Une suggestion de contenu, d'équilibrage ou d'ergonomie. / A content, balance or usability suggestion.
title: "[idée] "
labels: ["idée"]
body:
  - type: markdown
    attributes:
      value: |
        Les idées comptent autant que les bugs : la 1.2 entière est née de commentaires de joueurs. Dites surtout **ce que vous avez ressenti en jouant** — c'est plus utile qu'une solution technique.

        *Ideas matter as much as bugs: the whole of 1.2 came from player comments. Above all, say **what the run felt like** — that is more useful than a technical solution.*

  - type: textarea
    id: idee
    attributes:
      label: L'idée / The idea
    validations:
      required: true

  - type: textarea
    id: pourquoi
    attributes:
      label: Ce qui vous a amené là / What led you to it
      description: Le moment de jeu qui a déclenché l'idée. Un âge qui traîne, une décision qu'on ne prend jamais, un choix qui n'en est pas un. / The moment in play that prompted it. An age that drags, a decision nobody takes, a choice that is not one.
    validations:
      required: true

  - type: dropdown
    id: quand
    attributes:
      label: À quel moment de la partie / When in the run
      options:
        - Le premier jour / Day one
        - Les âges pré-industriels / The pre-industrial ages
        - Les âges industriels et suivants / The industrial ages onward
        - Le programme spatial / The space program
        - L'émergence et après / Emergence and after
        - Toute la partie / The whole run
