name: Bug report
description: Report a reproducible problem in Ad Astra.
title: "[Bug] "
labels: ["bug", "status: needs information"]
body:
  - type: markdown
    attributes:
      value: |
        Please check existing reports first. Do not paste tokens, private saves, or personal data.
  - type: input
    id: version
    attributes:
      label: Ad Astra and Stellaris version
      placeholder: "Ad Astra 1.4.0-dev, Stellaris 4.4.6"
    validations:
      required: true
  - type: dropdown
    id: start_age
    attributes:
      label: Starting age
      options:
        - Stone
        - Bronze
        - Iron
        - Medieval
        - Renaissance
        - Steam
        - Industrial
        - Machine
        - Atomic
        - Space
        - Other or not applicable
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: Describe what actually happens, including the in-game date if useful.
      placeholder: "In year ..., after ..., the game ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start a new game...\n2. Choose...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other active mods and DLC
      description: Write "clean game" if Ad Astra is the only active mod.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Log, save, or screenshot
      description: Attach relevant error.log lines or a link to the save/screenshot if possible.
