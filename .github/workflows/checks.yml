# Shared checks for every line of the mod (1.3 hotfixes and 1.4 development).
# Development and tagged releases invoke this same workflow.
name: checks

on:
  workflow_call:
    inputs:
      expected_version:
        description: "Version expected from descriptor, changelog, and tag. Empty skips tag parity."
        required: false
        type: string
        default: ""
      require_main:
        description: "Require the checked commit to be reachable from main."
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: validate mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: confirm release tag is on main
        if: inputs.require_main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::The release tag commit is not reachable from main."
            exit 1
          }

      # Route validation by the version the mod declares. The 1.3 hotfix line
      # keeps its historical invariants; 1.4 and later use the generic
      # validators (generated files in sync, then content rules).
      - name: validate mod content
        run: |
          version="$(tr -d '\357\273\277' < ad_astra/descriptor.mod | sed -n 's/^version="\([^"]*\)".*/\1/p' | head -n 1)"
          echo "descriptor version: ${version}"
          case "${version}" in
            1.3.*)
              python tools/verify_1_3_1.py "${{ inputs.expected_version }}" ;;
            *)
              python tools/verify_generated.py
              python tools/verify_1_2.py ;;
          esac

      - name: validate version, changelog, and Workshop content
        run: python tools/verify_release.py "${{ inputs.expected_version }}"

      - name: generate changelog entry
        run: |
          python tools/changenote.py > /tmp/changenote.txt
          echo "$(wc -c < /tmp/changenote.txt) characters"
