# Shared checks. Both development and releases call this workflow unchanged,
# so main is tested exactly as development is. Add any new check here.
name: checks

on:
  workflow_call:
    inputs:
      expected_version:
        description: "Version the repository must declare, without the v. Empty disables this check."
        type: string
        required: false
        default: ""
      require_main:
        description: "Require the checked commit to belong to main."
        type: boolean
        required: false
        default: false

jobs:
  validate:
    name: validate mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      # Tags made from a feature branch must never be able to publish a mod.
      - name: confirm release tag is on main
        if: inputs.require_main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::The release tag commit is not reachable from main."
            exit 1
          }

      # A modified data table without regeneration produces a valid mod, but
      # not the one the repository claims to contain. Reject that mismatch.
      - name: generated files up to date
        run: python tools/verify_generated.py

      # Core content checks: history, waves, icons, gates, vanilla technology
      # leaks, invalid modifiers, and the Workshop identifier.
      - name: mod content
        run: python tools/verify_1_2.py

      # Validate consistency between the repository and the planned release.
      - name: version, changelog, and descriptions
        run: python tools/verify_release.py "${{ inputs.expected_version }}"

      # Build the changelog here too: a release note that fails on release day
      # is a failed release.
      - name: changelog entry
        run: |
          python tools/changenote.py > /tmp/changenote.txt
          echo "$(wc -c < /tmp/changenote.txt) characters"
          head -c 600 /tmp/changenote.txt
