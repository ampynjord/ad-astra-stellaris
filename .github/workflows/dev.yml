# Development workflow.
#
#   push to dev/main        -> checks
#   pull request to dev/main -> the same checks; main is protected by this job
name: development

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  test_archive:
    name: test archive
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A trusted push to main primes the cache that tagged releases can read.
      # It contains SteamCMD binaries only, never the Steam session directory.
      - name: restore SteamCMD cache
        id: steamcmd_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/steamcmd
          key: steamcmd-linux-v1

      - name: bootstrap SteamCMD cache
        if: github.ref == 'refs/heads/main' && steps.steamcmd_cache.outputs.cache-hit != 'true'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y lib32gcc-s1 ca-certificates > /dev/null
          mkdir -p "$HOME/steamcmd"
          curl -sSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C "$HOME/steamcmd"
          "$HOME/steamcmd/steamcmd.sh" +quit

      - name: save SteamCMD cache
        if: github.ref == 'refs/heads/main' && steps.steamcmd_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/steamcmd
          key: ${{ steps.steamcmd_cache.outputs.cache-primary-key }}

      # Build the same archive as a release without ever calling Steam.
      - name: build archive
        run: python tools/ci_release.py --sortie build

      - name: upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ad-astra-dev-${{ github.sha }}
          path: build/ad_astra_v*.zip
          if-no-files-found: error
          retention-days: 14
