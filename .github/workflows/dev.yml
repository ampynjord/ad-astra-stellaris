# Development validation for the maintained 1.3 hotfix line.
name: development

on:
  push:
    branches: [main, "hotfix/**"]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  test_archive:
    name: test archive
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: build test archive
        run: python tools/ci_release.py --sortie build

      - name: upload test archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ad-astra-1.3-${{ github.sha }}
          path: build/ad_astra_v*.zip
          if-no-files-found: error
          retention-days: 14
