# Development workflow.
#
#   push to dev             -> checks
#   pull request to dev/main -> the same checks; main is protected by this job
name: development

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  test_archive:
    name: test archive
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build the same archive as a release without ever calling Steam.
      - name: build archive
        run: python tools/ci_release.py --sortie build

      - name: upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ad-astra-dev-${{ github.sha }}
          path: build/ad_astra_v*.zip
          if-no-files-found: error
          retention-days: 14
