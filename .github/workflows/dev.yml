# Development validation: hotfix line and 1.4 development branch.
name: development

on:
  push:
    branches: [main, dev, "hotfix/**"]
  pull_request:
    branches: [main, dev]

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  test_archive:
    name: test archive
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: build test archive
        run: python tools/ci_release.py --sortie build

      - name: prepare artifact name
        id: artifact_name
        env:
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          safe_ref="$(printf '%s' "$SOURCE_REF" | tr -cs 'A-Za-z0-9._-' '-')"
          safe_ref="${safe_ref#-}"
          safe_ref="${safe_ref%-}"
          echo "value=ad-astra-${safe_ref}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: upload test archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: build/ad_astra_v*.zip
          if-no-files-found: error
          retention-days: 14
