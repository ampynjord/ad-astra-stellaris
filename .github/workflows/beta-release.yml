# Manual validation for privately distributed beta builds.
# It deliberately has no Steam environment, credentials, Workshop upload,
# GitHub release, or public artifact. The validated archive is shared only
# through the Discord channel restricted to selected Beta Tester members.
name: private beta validation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer beta version, for example v1.4.0-beta.1"
        required: true
        type: string

concurrency:
  group: beta-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  package:
    name: validate private beta package
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: validate beta tag
        env:
          BETA_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$BETA_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]; then
            echo "::error::Use SemVer beta format, for example v1.4.0-beta.1."
            exit 1
          fi
          expected_version="${BETA_TAG#v}"
          descriptor_version="$(tr -d '\357\273\277' < ad_astra/descriptor.mod | sed -n 's/^version="\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ "$descriptor_version" != "$expected_version" ]]; then
            echo "::error::Tag $BETA_TAG does not match descriptor version $descriptor_version."
            exit 1
          fi

      - name: build private beta archive
        run: python tools/build_beta.py --sortie beta
