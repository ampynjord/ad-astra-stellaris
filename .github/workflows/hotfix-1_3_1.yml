name: controles

on:
  push:
    branches: [hotfix/1.3.1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    name: verifier le mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: invariants 1.3.1
        run: python tools/verify_1_3_1.py

      - name: contenu publiable
        run: python tools/verify_release.py v1.3.1

  archive:
    name: archive de test
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: construire l archive
        run: python tools/ci_release.py --sortie build

      - name: conserver l archive
        uses: actions/upload-artifact@v4
        with:
          name: ad-astra-1.3.1-${{ github.sha }}
          path: build/ad_astra_v1.3.1.zip
          if-no-files-found: error
          retention-days: 14
