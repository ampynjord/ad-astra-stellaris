name: sortie 1.3.1

on:
  push:
    tags: ["v1.3.1"]

permissions:
  contents: write

jobs:
  verifier:
    name: verifier le hotfix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: invariants 1.3.1
        run: python tools/verify_1_3_1.py

      - name: contenu publiable
        run: python tools/verify_release.py v1.3.1

  publier:
    name: publier le hotfix
    needs: verifier
    runs-on: ubuntu-latest
    environment: steam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: construire l archive
        run: python tools/ci_release.py --sortie build

      - name: verifier les secrets Steam
        env:
          CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          test -n "$CONFIG_VDF" || { echo "::error::STEAM_CONFIG_VDF manquant"; exit 1; }
          test -n "$STEAM_USERNAME" || { echo "::error::STEAM_USERNAME manquant"; exit 1; }

      - name: installer SteamCMD
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y lib32gcc-s1 ca-certificates > /dev/null
          mkdir -p "$HOME/steamcmd"
          curl -sSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C "$HOME/steamcmd"

      - name: authentifier SteamCMD
        env:
          CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          mkdir -p "$HOME/Steam/config"
          echo "$CONFIG_VDF" | base64 -d > "$HOME/Steam/config/config.vdf"
          chmod 600 "$HOME/Steam/config/config.vdf"

      - name: publier sur le Workshop
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          set -o pipefail
          "$HOME/steamcmd/steamcmd.sh" +login "$STEAM_USERNAME" \
            +workshop_build_item "$PWD/build/origins/item.vdf" +quit | tee /tmp/steam.log
          grep -q "Success" /tmp/steam.log || {
            echo "::error::SteamCMD n a pas confirme la publication"; exit 1; }
          grep -q "3781408257" /tmp/steam.log || {
            echo "::error::SteamCMD n a pas confirme l identifiant Workshop attendu"; exit 1; }

      - name: preparer les notes GitHub
        run: python tools/changenote.py --markdown > /tmp/notes.md

      - name: creer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/notes.md
          files: build/ad_astra_v1.3.1.zip
