# La sortie. Se déclenche sur un tag v*, jamais sur un simple merge :
# corriger une faute dans le README ne doit pas envoyer une mise à jour
# à 954 abonnés.
#
#   git tag -a v1.3.1 -m "..." && git push origin v1.3.1
#
# Secrets nécessaires (Settings > Secrets and variables > Actions) :
#   STEAM_USERNAME    ton identifiant Steam
#   STEAM_CONFIG_VDF  le config.vdf d'un SteamCMD déjà authentifié, en base64
#                     (voir docs/PUBLICATION.md — ne colle jamais ton mot de
#                     passe ici, ni nulle part ailleurs)
name: sortie

on:
  push:
    tags: ["v*"]

concurrency:
  group: sortie
  cancel-in-progress: false

jobs:
  # Exactement les mêmes contrôles que sur dev, plus la vérification que le
  # tag, le descripteur et le changelog annoncent tous la même version.
  controles:
    name: contrôles
    uses: ./.github/workflows/checks.yml
    with:
      version_attendue: ${{ github.ref_name }}

  publier:
    name: publier sur le Workshop
    needs: controles
    runs-on: ubuntu-latest
    environment: steam
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: préparer le contenu et les manifestes
        run: |
          python tools/ci_release.py --sortie "$PWD/build"
          echo "mods publiés : $(tr '\n' ' ' < build/publies.txt)"

      # SteamCMD refuse un dépôt de moins de 32 bits ; l'image Ubuntu des
      # runners est 64 bits et il lui faut les bibliothèques i386.
      - name: installer SteamCMD
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y lib32gcc-s1 ca-certificates > /dev/null
          mkdir -p "$HOME/steamcmd"
          curl -sSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C "$HOME/steamcmd"

      # On ne transmet pas de mot de passe. Le config.vdf porte un jeton de
      # session déjà validé par Steam Guard : SteamCMD s'en sert et ne demande
      # rien. S'il expire, la sortie échoue proprement ici plutôt que de
      # publier à moitié — regénère-le et rejoue le tag.
      - name: authentifier SteamCMD
        env:
          CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          if [ -z "$CONFIG_VDF" ]; then
            echo "::error::secret STEAM_CONFIG_VDF absent — voir docs/PUBLICATION.md"
            exit 1
          fi
          mkdir -p "$HOME/Steam/config"
          echo "$CONFIG_VDF" | base64 -d > "$HOME/Steam/config/config.vdf"
          chmod 600 "$HOME/Steam/config/config.vdf"

      - name: envoyer sur le Workshop
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          set -o pipefail
          while read -r cle; do
            echo "::group::$cle"
            attendu=$(python -c "import json,sys;print(next(m['publishedfileid'] for m in json.load(open('workshop/mods.json'))['mods'] if m['cle']=='$cle'))")
            "$HOME/steamcmd/steamcmd.sh" +login "$STEAM_USERNAME" \
              +workshop_build_item "$PWD/build/$cle/item.vdf" +quit | tee "/tmp/steam_$cle.log"
            # SteamCMD sort en 0 même quand il refuse le dépôt. On lit la sortie.
            grep -q "Success" "/tmp/steam_$cle.log" || {
              echo "::error::$cle : SteamCMD n'a pas confirmé la publication"; exit 1; }
            grep -q "$attendu" "/tmp/steam_$cle.log" || {
              echo "::error::$cle : l'identifiant publié n'est pas $attendu — un doublon a pu être créé"; exit 1; }
            echo "::endgroup::"
          done < build/publies.txt

      # La description française ne peut pas partir d'ici : le manifeste de
      # SteamCMD n'a pas de champ de langue, il n'écrit que la description par
      # défaut (anglaise). La page du Workshop, elle, garde bien une
      # description par langue — c'est un geste manuel, et rare.
      - name: rappeler les descriptions françaises qui ont bougé
        run: |
          precedent=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          {
            echo "## Publié sur le Workshop"
            echo ""
            while read -r cle; do
              id=$(python -c "import json;print(next(m['publishedfileid'] for m in json.load(open('workshop/mods.json'))['mods'] if m['cle']=='$cle'))")
              echo "- **$cle** — <https://steamcommunity.com/sharedfiles/filedetails/?id=$id>"
            done < build/publies.txt
            echo ""
            echo "### À faire à la main"
            echo ""
            reste=0
            while read -r cle; do
              fr="workshop/$cle/description_FR.txt"
              if [ -z "$precedent" ] || ! git diff --quiet "$precedent" -- "$fr" 2>/dev/null; then
                echo "- **$cle** : la description française a changé. Page du mod → menu \`≡\` → *Modifier le nom et la description* → **français** → coller \`$fr\`."
                reste=1
              fi
            done < build/publies.txt
            [ "$reste" = 0 ] && echo "Rien : aucune description française n'a bougé."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: note de changement pour la release GitHub
        run: python tools/changenote.py --markdown > /tmp/notes.md

      - name: créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/notes.md
          files: build/*.zip
