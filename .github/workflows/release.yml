# Generic production workflow for every v* tag created from main. It handles
# both a normal 1.3 release and any later 1.3 hotfix without a renamed copy.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to recover."
        required: true
        type: string
      skip_workshop:
        description: "Skip Workshop upload when it already succeeded."
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml
    with:
      expected_version: ${{ inputs.release_tag || github.ref_name }}
      require_main: true
      target_ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

  publish:
    name: publish to Workshop
    needs: checks
    runs-on: ubuntu-latest
    environment: steam
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: prepare content and manifests
        run: |
          python tools/ci_release.py --sortie "$PWD/build"
          echo "published mods: $(tr '\n' ' ' < build/publies.txt)"

      # Binary cache only: credentials remain out of the cache.
      - name: restore SteamCMD cache
        if: ${{ !inputs.skip_workshop }}
        id: steamcmd_cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/steamcmd
          key: steamcmd-linux-v2

      - name: install SteamCMD dependencies
        if: ${{ !inputs.skip_workshop }}
        run: |
          sudo dpkg --add-architecture i386
          timeout 120 sudo apt-get update -qq
          timeout 180 sudo apt-get install -y lib32gcc-s1 ca-certificates > /dev/null

      - name: install SteamCMD
        if: ${{ !inputs.skip_workshop && steps.steamcmd_cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p "$HOME/steamcmd"
          timeout 200 curl --fail --silent --show-error --location \
            --connect-timeout 20 --max-time 180 \
            https://media.steampowered.com/client/installer/steamcmd_linux.tar.gz \
            -o /tmp/steamcmd_linux.tar.gz
          tar -xzf /tmp/steamcmd_linux.tar.gz -C "$HOME/steamcmd"
          timeout 300 "$HOME/steamcmd/steamcmd.sh" +quit

      - name: save SteamCMD cache
        if: ${{ !inputs.skip_workshop && steps.steamcmd_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/steamcmd
          key: ${{ steps.steamcmd_cache.outputs.cache-primary-key }}

      - name: authenticate SteamCMD
        if: ${{ !inputs.skip_workshop }}
        env:
          CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          if [ -z "$CONFIG_VDF" ] || [ -z "$STEAM_USERNAME" ]; then
            echo "::error::STEAM_CONFIG_VDF and STEAM_USERNAME are required."
            exit 1
          fi
          mkdir -p "$HOME/Steam/config"
          echo "$CONFIG_VDF" | base64 -d > /tmp/config.vdf.payload || {
            echo "::error::STEAM_CONFIG_VDF is not valid base64"
            exit 1
          }
          if gzip -t /tmp/config.vdf.payload 2>/dev/null; then
            gzip -dc /tmp/config.vdf.payload > "$HOME/Steam/config/config.vdf"
          else
            cp /tmp/config.vdf.payload "$HOME/Steam/config/config.vdf"
          fi
          test -s "$HOME/Steam/config/config.vdf" || {
            echo "::error::STEAM_CONFIG_VDF produced an empty config.vdf"
            exit 1
          }
          chmod 600 "$HOME/Steam/config/config.vdf"

      - name: publish to Workshop
        if: ${{ !inputs.skip_workshop }}
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          set -o pipefail
          while read -r key; do
            echo "::group::$key"
            expected=$(python -c "import json; print(next(m['publishedfileid'] for m in json.load(open('workshop/mods.json'))['mods'] if m['cle']=='$key'))")
            grep -Eq "\"publishedfileid\"[[:space:]]+\"$expected\"" "$PWD/build/$key/item.vdf" || {
              echo "::error::$key: generated Workshop manifest does not target $expected"; exit 1; }
            timeout 300 "$HOME/steamcmd/steamcmd.sh" \
              +@NoPromptForPassword 1 +@ShutdownOnFailedCommand 1 \
              +login "$STEAM_USERNAME" \
              +workshop_build_item "$PWD/build/$key/item.vdf" +quit \
              | tee "/tmp/steam_$key.log"
            grep -q "Success" "/tmp/steam_$key.log" || {
              echo "::error::$key: SteamCMD did not confirm publication"; exit 1; }
            echo "::endgroup::"
          done < build/publies.txt

      - name: generate GitHub release notes
        run: python tools/changenote.py --markdown > /tmp/notes.md

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/notes.md
          files: build/*.zip
          tag_name: ${{ inputs.release_tag || github.ref_name }}
