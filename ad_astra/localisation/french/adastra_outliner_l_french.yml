 adastra.177.name:0 "Notre monde quitte les cartes"
 adastra.177.desc:0 "Les lumieres installees dans notre ciel revendiquent desormais tout notre systeme. Sur leurs cartes, notre monde n'est plus qu'un detail de leur territoire, et nos propres registres ne savent plus le ranger parmi les terres que nous gouvernons."
 adastra.177.a:0 "Nous savons ou nous vivons."
 adastra.177.recap:0 "£ship_size_science£ Tant qu'un autre empire tient la §Ybase stellaire§! de notre systeme natal, notre monde natal n'apparait plus dans le §Ypanneau lateral§! : le jeu la range dans le secteur de cet empire.\n£ship_size_science£ La planete reste la notre. On l'atteint par le bouton §Yaller a§! de cet evenement, ou depuis la carte galactique.\n£ship_size_science£ Elle revient dans le panneau des que la base est de nouveau a nous (§YReclamer notre ciel§!)."
