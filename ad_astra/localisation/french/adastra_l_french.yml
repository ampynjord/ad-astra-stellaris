 adastra.1.f.tooltip:0 "§RPénalités lourdes§! (£research£ recherche -60%, £pops£ production -45%, £unity£ unité -45%) et population réduite de 50%.\nDébloque : industrie de base."
 adastra.1.g:0 "$industrial_age$"
 adastra.1.g.tooltip:0 "§RPénalités fortes§! (£research£ recherche -50%, £pops£ production -40%, £unity£ unité -40%) et population réduite de 40%.\nDébloque : extraction mécanisée, agriculture industrielle, armées de masse."
 adastra.1.h:0 "$machine_age$"
 adastra.1.h.tooltip:0 "§RPénalités modérées§! (£research£ recherche -40%, £pops£ production -30%, £unity£ unité -30%) et population réduite de 25%.\nDébloque : centrales électriques, gouvernement planétaire, médecine moderne."
 adastra.1.i:0 "$atomic_age$"
 adastra.1.i.tooltip:0 "§RPénalités limitées§! (£research£ recherche -25%, £pops£ production -20%, £unity£ unité -20%) et population réduite de 15%.\nDébloque : fission nucléaire, missiles, radar, lasers, médias de masse, défenses planétaires."
 adastra.1.j:0 "$early_space_age$"
 adastra.1.j.tooltip:0 "§RPénalités légères§! (£research£ recherche -10%, £pops£ production -10%, £unity£ unité -10%) et population réduite de 5%.\nDébloque : toutes les technologies de départ sauf l'§HHyperpropulsion§!."

 # adastra.4 : bienvenue
 adastra.4.name:0 "Au-delà des étoiles"
 adastra.4.desc:0 "Le ciel de [Root.Capital.GetName] n'a encore jamais été traversé que par les oiseaux et les nuages. Là-haut, le vide s'étend, immense et silencieux - notre orbite elle-même nous est étrangère.\n\nLa situation §YAu-delà des étoiles§! suit désormais notre progression dans le journal de bord. Chaque âge franchi allégera nos fardeaux et apportera les savoirs de son temps, jusqu'au jour où les équations du voyage supraluminique seront à notre portée.\n\nNote : le didacticiel a été désactivé, ses conseils supposant un empire spatial déjà constitué."
 adastra.93.name:0 "Une nouvelle étoile sur les cartes"
 adastra.93.desc:0 "Après des mois d'observations patientes, un point faible a trouvé sa place sur nos cartes. Ce n'est ni un errant ni une erreur d'instrument : §Y[event_target:adastra_astronomy_target.GetName]§!, un système stellaire dans la portée optique, vient d'entrer dans notre ciel.\n\nNous ne connaissons encore que son étoile. Ses mondes et ses ressources restent cachés dans le noir."
 adastra.93.a:0 "Marquons-la sur toutes les cartes."
 adastra.93.a.tooltip:0 "Révèle l'étoile de §Y[event_target:adastra_astronomy_target.GetName]§!, mais ni ses planètes ni ses ressources."
 adastra.94.name:0 "Un signal trouve sa place"
 adastra.94.desc:0 "Apres une longue campagne d'ecoute, nos reseaux radio ont isole une source lointaine et l'ont fixee dans le ciel : §Y[event_target:adastra_astronomy_target.GetName]§!. Sa signature radio nous renseigne mieux sur son environnement stellaire que ne le ferait un instrument optique, mais les mondes qui l'entourent restent indistincts et ses ressources inconnues."
 adastra.94.a:0 "Consignons le signal."
 adastra.94.a.tooltip:0 "Revele seulement l'etoile de §Y[event_target:adastra_astronomy_target.GetName]§!, a portee de l'observatoire radio."
 adastra.95.name:0 "Un systeme resolu depuis l'orbite"
 adastra.95.desc:0 "Au-dessus de notre atmosphere, notre observatoire a separe une lumiere lointaine des tenebres qui l'entourent. §Y[event_target:adastra_astronomy_target.GetName]§! trouve maintenant sa place sur nos cartes. Son profil spectral et la structure generale de ses orbites sont plus nets que jamais, mais ses planetes, lunes et ressources attendent encore une exploration directe."
 adastra.95.a:0 "Ajoutons-le au releve du ciel."
 adastra.95.a.tooltip:0 "Revele seulement l'etoile de §Y[event_target:adastra_astronomy_target.GetName]§!, a portee de l'observatoire orbital."
 adastra.4.a:0 "Le chemin sera long. Marchons."
 adastra.4.a.tooltip:0 "Suivez votre progression dans le §Yjournal de bord§! (situation §YAu-delà des étoiles§!). Choisissez-y votre §Yapproche§! : continuité, marche forcée ou regard vers le ciel."

 # adastra.6 : situation terminée

 # Émergence
 adastra.20.name:0 "Les étoiles nous appartiennent"
 adastra.20.desc:0 "Le prototype a disparu de nos écrans radar - puis il est réapparu, intact, au-delà de l'orbite de notre lune. Le voyage supraluminique n'est plus un rêve : c'est une donnée d'ingénierie.\n\nNotre chantier orbital réarme déjà nos vaisseaux avec les nouvelles hyperpropulsions. Au-delà de l'héliopause, la galaxie attend. La longue enfance de notre espèce s'achève aujourd'hui."
 adastra.20.a:0 "Le berceau s'ouvre enfin."
 adastra.20.a.tooltip:0 "Vos vaisseaux scientifique et de construction sont §Yréarmés avec l'Hyperpropulsion§! (une base stellaire est fournie si vous n'en avez pas).\nBonus temporaire : §YL'aube stellaire§!. Vous êtes désormais un §Yempire spatial classique§!."
 adastra.22.name:0 "Une civilisation atteint les étoiles"
 adastra.22.desc:0 "Les senseurs confirment une signature hyperspatiale inédite : la civilisation pré-PRL de [From.GetName], jusqu'ici confinée à son monde natal, vient de réussir sa première translation supraluminique.\n\nUne nouvelle voix s'élève dans la galaxie."
 adastra.22.a:0 "Intéressant."
 adastra.25.name:0 "Ils ont atteint les étoiles"
 adastra.25.desc:0 "Rapport prioritaire de nos senseurs : la civilisation pré-PRL de [adastra_country.GetName], dont le monde natal se trouve §Ydans l'espace que nous contrôlons§!, vient de réaliser sa première translation hyperspatiale.\n\nIls réclament l'orbite de leur propre planète - et la base stellaire que nous y maintenons. Notre réponse définira leur place dans la galaxie... et l'image qu'ils garderont de nous pour les siècles à venir."
 adastra.25.a:0 "Leur système leur revient de droit. Cédons-le."
 adastra.25.a.tooltip:0 "La base stellaire du système natal est §Ytransférée§! à [adastra_country.GetName], qui devient un empire §Yindépendant§!."
 adastra.25.b:0 "Ils émergeront sous notre tutelle - pour leur propre bien."
 adastra.25.b.tooltip:0 "La base stellaire du système natal est §Ytransférée§! à [adastra_country.GetName], qui devient votre §Yprotectorat§!."
 adastra.26.name:0 "Libres parmi les étoiles"
 adastra.26.desc:0 "Nous ne sommes pas les premiers. Depuis des années, peut-être des décennies, un empire venu d'ailleurs contrôlait le vide au-dessus de nos têtes.\n\nEt pourtant, au moment où nos vaisseaux ont franchi le seuil de l'hyperespace, leurs émissaires nous ont transmis un message : l'orbite de notre monde nous appartient. Leurs stations se retirent. Nous entrons dans la galaxie libres - et prévenus : nous n'y serons jamais seuls."
 adastra.26.a:0 "Nous n'oublierons pas ce geste."
 adastra.26.a.tooltip:0 "Vous récupérez la §Ybase stellaire§! de votre système natal et vos vaisseaux civils sont §Yréarmés avec l'Hyperpropulsion§!. Bonus temporaire : §YL'aube stellaire§!."
 adastra.29.name:0 "Une charte pour les étoiles"
 adastra.29.desc:0 "Nos institutions ont été forgées pour un seul monde. Maintenant que le ciel est ouvert, elles méritent d'être regardées à cette lumière.\n\nVous pouvez réformer votre gouvernement §Yune fois, gratuitement§!, quand vous le souhaitez. Choisissez les civismes qui correspondent à la civilisation que vous êtes devenue."
 adastra.29.a:0 "L'avenir est à écrire."
 adastra.29.a.tooltip:0 "Vous avez reçu une §Yréforme gouvernementale gratuite§!. Ouvrez l'écran Gouvernement lorsque vous souhaiterez l'utiliser."
 adastra.30.name:0 "L'héritage de l'Ascension"
 adastra.30.desc:0 "Notre histoire ne nous donne pas tous les outils à la fois : elle nous apprend à les employer. Plus notre Ascension a été longue, plus son legs est puissant. Choisissez maintenant la spécialité qui accompagnera notre premier pas parmi les étoiles."
 adastra.30.a:0 "Héritage scientifique (§G+5 %§! vitesse de recherche, §G+5 %§! recherche physique)"
 adastra.30.b:0 "Héritage industriel (§G+10 %§! production des stations minières, §G-10 %§! coût d'influence des bases stellaires)"
 adastra.30.c:0 "Héritage civique (§G+5 %§! unité, §G+3§! stabilité)"
 adastra.30.d:0 "Héritage pionnier (§G+25 %§! développement des colonies, §G-10 %§! taille d'empire des colonies)"
 adastra.30.e:0 "Héritage orbital (§G+1§! portée des capteurs, §G+10 %§! recherche des stations)"
 adastra_heritage_scientific:0 "Héritage scientifique"
 adastra_heritage_scientific_desc:0 "Les laboratoires de notre monde natal restent la fondation de notre avenir."
 adastra_heritage_industrial:0 "Héritage industriel"
 adastra_heritage_industrial_desc:0 "Nos ateliers et nos premières infrastructures orbitales accélèrent l'expansion."
 adastra_heritage_civic:0 "Héritage civique"
 adastra_heritage_civic_desc:0 "Des institutions mûries avant les étoiles donnent de la cohésion à l'empire."
 adastra_heritage_pioneer:0 "Héritage pionnier"
 adastra_heritage_pioneer_desc:0 "Les pionniers de notre monde natal rendent les premières colonies plus faciles à établir."
 adastra_heritage_orbital:0 "Héritage orbital"
 adastra_heritage_orbital_desc:0 "La maîtrise précoce du ciel ouvre la voie aux observatoires et aux stations de recherche."
 adastra_heritage_trial:0 "Épreuve de l'Ascension"
 adastra_heritage_trial_desc:0 "La galaxie n'a pas attendu notre percée. Cette épreuve a soudé notre civilisation."
 adastra_heritage_depth_stone:0 "Longue Ascension : âge de pierre"
 adastra_heritage_depth_stone_desc:0 "Du silex à l'hyperespace, notre civilisation a appris à bâtir chaque étape par elle-même."
 adastra_heritage_depth_bronze:0 "Longue Ascension : âge du bronze"
 adastra_heritage_depth_bronze_desc:0 "Notre civilisation a forgé sa route vers les étoiles depuis les premiers métaux."
 adastra_heritage_depth_iron:0 "Longue Ascension : âge du fer"
 adastra_heritage_depth_iron_desc:0 "De la forge aux étoiles, notre civilisation a traversé les âges par ses propres moyens."
 adastra_heritage_depth_medieval:0 "Longue Ascension : Moyen Âge"
 adastra_heritage_depth_medieval_desc:0 "Une longue marche de savoirs, de cités et de découvertes porte notre percée."
 adastra_heritage_depth_renaissance:0 "Longue Ascension : Renaissance"
 adastra_heritage_depth_renaissance_desc:0 "Notre regard sur le monde a grandi jusqu'à se porter vers les étoiles."
 adastra_heritage_depth_steam:0 "Longue Ascension : âge de la vapeur"
 adastra_heritage_depth_steam_desc:0 "Les machines de notre premier essor ont préparé notre conquête du ciel."
 adastra_heritage_depth_industrial:0 "Ascension préparée : âge industriel"
 adastra_heritage_depth_industrial_desc:0 "Notre civilisation entre dans les étoiles avec l'élan de son industrialisation."
 adastra_heritage_depth_machine:0 "Ascension préparée : âge des machines"
 adastra_heritage_depth_machine_desc:0 "Nos réseaux et nos machines ont réduit la distance entre le monde et le ciel."
 adastra_heritage_depth_atomic:0 "Ascension préparée : âge atomique"
 adastra_heritage_depth_atomic_desc:0 "La maîtrise de l'atome a fait des étoiles un horizon accessible."
 adastra_heritage_depth_space:0 "Ascension préparée : début de l'âge spatial"
 adastra_heritage_depth_space_desc:0 "Notre monde était déjà tourné vers le ciel avant sa percée supraluminique."
 adastra.27.name:0 "Sous l'aile d'un géant"
 adastra.27.desc:0 "Le ciel n'était pas vide. Il ne l'a jamais été. Au moment même où notre premier vaisseau hyperspatial revenait triomphant, leurs ambassadeurs se tenaient déjà en orbite.\n\nLeur message était courtois, mais sans appel : notre émergence se fera sous leur protection. Leur pavillon flotte à côté du nôtre sur la base stellaire qu'ils nous remettent. Nous voici dans la galaxie - vassaux avant même d'être voyageurs. Cela aussi, un jour, pourra changer."
 adastra.27.a:0 "Un jour, nous volerons de nos propres ailes."
 adastra.27.a.tooltip:0 "Vous devenez le §Yprotectorat§! de l'empire occupant, mais récupérez la §Ybase stellaire§! de votre système natal et vos vaisseaux réarmés en §YHyperpropulsion§!. Bonus temporaire : §YL'aube stellaire§!."

 # Noms de flottes
 adastra_fleet_science:0 "Expédition Scientifique Inaugurale"
 adastra_fleet_constructor:0 "Corps des Bâtisseurs"
 adastra_fleet_navy:0 "Première Flottille"

 # Passages d'âge (les titres réutilisent les noms d'âges vanilla)
 adastra.age.ok:0 "Une nouvelle page de notre histoire."
 adastra.50.desc:0 "Autour des feux, sous les pointes de silex et les peaux tannées, quelque chose d'unique s'éveille : des récits, des rites, des questions. Le premier âge de notre espèce a commencé."
 adastra.51.desc:0 "Le métal en fusion coule dans les moules d'argile. Outils, armes, parures : le bronze change les mains qui le tiennent, et les premières cités lèvent leurs murs vers le ciel."
 adastra.52.desc:0 "Le fer, plus dur et plus abondant, arme les champs comme les armées. Des royaumes naissent et s'effondrent, et l'écriture fixe désormais ce que la mémoire perdait."
 adastra.53.desc:0 "Châteaux, guildes et chartes : le pouvoir se codifie. Sur les routes commerciales, les idées voyagent plus vite que les caravanes qui les portent."
 adastra.54.desc:0 "Les arts renaissent, les navires s'aventurent au-delà des cartes et des esprits audacieux osent mesurer le ciel. Notre monde, soudain, semble plus petit - et l'univers plus grand."
 adastra.55.desc:0 "La vapeur siffle dans les chaudières. Les distances fondent devant le rail, et les manufactures redessinent les villes. La nature n'impose plus son rythme : nous imposons le nôtre."
 adastra.56.desc:0 "Les chaînes de production tournent jour et nuit et l'agriculture nourrit des métropoles entières. Une civilisation industrielle regarde désormais le ciel avec d'autres yeux."
 adastra.57.desc:0 "L'électricité illumine les nuits et les premiers calculateurs bourdonnent dans les caves ministérielles. La science devient une institution - et une promesse."
 adastra.58.desc:0 "Un éclair plus brillant que le soleil a déchiré l'aube au-dessus d'un désert d'essais. Nous avons libéré le feu du cœur de la matière - et découvert que nous pouvions tout détruire. Nos radiotélescopes, eux, commencent à écouter le ciel."
 adastra.59.desc:0 "Nos scientifiques nous ont donné les outils pour atteindre la lisière de l'espace. Le compte à rebours n'a pas encore commencé : la première fusée attend toujours sur son pas de tir.\n\nSélectionnez [Root.Capital.GetName] et réalisez le §YPremier lancement suborbital§!, le §YPremier satellite§!, le §YVol habité§!, le §YPremier atterrissage lunaire§!, puis la §YSonde profonde§!. Le dernier jalon ouvrira le §YProgramme d'exploration spatiale§!."

 # Observation inversée
 adastra.60.name:0 "Lumières dans la nuit"
 adastra.60.desc:0 "Les rapports s'accumulent sur les bureaux de l'état-major : des lumières qui virent à angle droit au-dessus des zones habitées, des échos radar sans transpondeur, un pilote qui jure avoir vu « une structure métallique de la taille d'une ville » entre les nuages.\n\nQuelque chose nous observe. La question n'est plus de savoir si c'est vrai - mais ce que nous disons à la population."
 adastra.60.a:0 "Classifier. Démentir. Surveiller."
 adastra.60.a.tooltip:0 "L'affaire est étouffée. Le pouvoir de l'État s'en trouve renforcé (£influence£ +25 influence)."
 adastra.60.b:0 "La vérité : nous ne sommes pas seuls."
 adastra.60.b.tooltip:0 "La population saura. Ferveur (£unity£ §Yunité +10%§! pendant 5 ans) mais aussi panique (§Rbonheur -10%§! pendant 3 ans)."
 adastra.61.name:0 "Disparitions inexpliquées"
 adastra.61.desc:0 "Des bergers isolés, une équipe de nuit entière, un navire retrouvé vide, toutes voiles dehors. Ceux qui reviennent parlent de lumière blanche, de silhouettes trop grandes et de souvenirs qui s'effritent.\n\nDans les hautes sphères, un mot revient avec insistance : « prélèvements »."
 adastra.61.a:0 "Ouvrir une commission d'enquête."
 adastra.61.b:0 "Il ne s'est rien passé. Rien du tout."
 adastra.61.b.tooltip:0 "Le déni officiel entretient la peur (§Rbonheur -10%§! pendant 3 ans) mais renforce l'appareil d'État (£influence£ +40 influence)."
 adastra.62.name:0 "Un signal venu du vide"
 adastra.62.desc:0 "Au milieu du souffle radio des étoiles, nos instruments ont isolé une structure : des impulsions ordonnées, répétées, mathématiques. Ce n'est pas un phénomène naturel. Quelqu'un, quelque part au-dessus de nos têtes, parle.\n\nNous ne comprenons pas encore ce qu'ils disent. Mais nous savons désormais une chose : le ciel a des habitants."
 adastra.62.a:0 "Toutes nos antennes sur ce signal."
 adastra.62.b:0 "Coupez les enregistrements. Le silence est plus sûr."
 adastra.63.name:0 "Débris tombés du ciel"
 adastra.63.desc:0 "L'objet a traversé l'atmosphère dans une gerbe de plasma avant de s'écraser dans une région reculée. Ce que les équipes de récupération ont trouvé dans le cratère ne ressemble à rien de connu : des alliages qui se ressoudent d'eux-mêmes, des matériaux que nos savants ne savent même pas nommer.\n\nCeux qui nous observent ne sont pas infaillibles. Et leurs miettes valent des décennies de recherche."
 adastra.63.a:0 "Rétro-ingénierie. Moyens illimités, secret absolu."
 adastra.63.a.tooltip:0 "£research£ §YRecherche +10%§! pendant 5 ans."
 adastra.63.b:0 "Détruire ces choses impies."
 # 1.2 : Héritage audacieux (galaxie vivante)
 adastra_heritage_1_bold:0 "Héritage de l'Ascension — l'Épreuve"
 adastra_heritage_1_bold_desc:0 "Notre civilisation a gravi seule les dernières marches vers les étoiles, sans jamais demander à la galaxie de patienter. Ce souvenir vaut double."
 mod_adastra_heritage_1_bold:0 "Héritage de l'Ascension — l'Épreuve"
 mod_adastra_heritage_1_bold_desc:0 "Notre civilisation a gravi seule les dernières marches vers les étoiles, sans jamais demander à la galaxie de patienter. Ce souvenir vaut double."
 adastra_heritage_2_bold:0 "Héritage de l'Ascension — l'Épreuve"
 adastra_heritage_2_bold_desc:0 "Des fumées de l'industrie aux feux de l'orbite, sous le regard d'empires déjà armés. Personne ne nous a laissé le temps : nous l'avons pris."
 mod_adastra_heritage_2_bold:0 "Héritage de l'Ascension — l'Épreuve"
 mod_adastra_heritage_2_bold_desc:0 "Des fumées de l'industrie aux feux de l'orbite, sous le regard d'empires déjà armés. Personne ne nous a laissé le temps : nous l'avons pris."
 adastra_heritage_3_bold:0 "Héritage de l'Ascension — l'Épreuve"
 adastra_heritage_3_bold_desc:0 "Des parchemins aux fusées, dans une galaxie qui ne dormait pas. Chaque siècle gagné l'a été contre quelqu'un."
 mod_adastra_heritage_3_bold:0 "Héritage de l'Ascension — l'Épreuve"
 mod_adastra_heritage_3_bold_desc:0 "Des parchemins aux fusées, dans une galaxie qui ne dormait pas. Chaque siècle gagné l'a été contre quelqu'un."
 adastra_heritage_4_bold:0 "Héritage de l'Ascension — l'Épreuve"
 adastra_heritage_4_bold_desc:0 "Du silex à l'hyperespace, pendant que d'autres colonisaient déjà les étoiles. Nous aurions dû être rayés de la carte cent fois. Nous sommes là."
 mod_adastra_heritage_4_bold:0 "Héritage de l'Ascension — l'Épreuve"
 mod_adastra_heritage_4_bold_desc:0 "Du silex à l'hyperespace, pendant que d'autres colonisaient déjà les étoiles. Nous aurions dû être rayés de la carte cent fois. Nous sommes là."

 # --- 1.2 : personnalites d'IA des empires confines -------------------------
 personality_adastra_grounded_open:0 "Civilisation tournée vers le ciel"
 personality_adastra_grounded_open_desc:0 "Cette civilisation n'a pas encore quitté son monde, mais elle sait qu'elle n'est pas seule. Elle tend la main à ce qui passe au-dessus d'elle, et négocie ce qu'elle ne peut pas encore prendre."
 personality_adastra_grounded_closed:0 "Civilisation repliée"
 personality_adastra_grounded_closed_desc:0 "Enfermée sur son monde natal et consciente de sa faiblesse, cette civilisation a choisi les murs plutôt que les traités. Elle arme ce qu'elle peut et attend son heure."
 personality_adastra_grounded_default:0 "Civilisation confinée"
 personality_adastra_grounded_default_desc:0 "Une civilisation encore attachée à son monde d'origine, occupée à survivre à elle-même avant de songer aux étoiles."
 personality_adastra_dormant_sleeper:0 "Empire assoupi"
 personality_adastra_dormant_sleeper_desc:0 "Cet empire existe, mais il ne bouge pas. La galaxie attend que quelqu'un d'autre écrive la première page."

 # --- 1.2 : modificateurs de ressources non inventees ---
 adastra_pre_electric:0 "Un monde sans courant"
 adastra_pre_electric_desc:0 "Nos moulins tournent au vent, nos forges au charbon de bois, et le veilleur de nuit allume une lampe à huile. Rien de tout cela ne se paie en électricité : nous ne savons pas encore ce que c'est. L'entretien de nos ouvrages se règle en matériau et en travail."
 mod_adastra_pre_electric:0 "Un monde sans courant"
 adastra_pre_manufacture:0 "Chacun fabrique le sien"
 adastra_pre_manufacture_desc:0 "On ne s'achète pas ses outils, ses vêtements ni sa vaisselle : on les fait soi-même, ou le voisin les fait. Aucun atelier n'est encore capable d'en produire pour tout le monde, alors personne n'en réclame."
 mod_adastra_pre_manufacture:0 "Chacun fabrique le sien"
 adastra_council_of_elders:0 "Le conseil des anciens"
 adastra_council_of_elders_desc:0 "Nos chefs ne sont pas entretenus : ils vivent parmi nous, cultivent leur part et rendent leurs arbitrages autour du feu. Gouverner ne coûte ici que le temps qu'on y passe."
 mod_adastra_council_of_elders:0 "Le conseil des anciens"
 adastra_court_and_retinue:0 "La cour et ses obligés"
 adastra_court_and_retinue_desc:0 "Le pouvoir s'est donné un toit, et le toit s'est rempli. Officiers, scribes, gens de maison : il faut désormais les loger et les nourrir. Gouverner commence à se payer."
 mod_adastra_court_and_retinue:0 "La cour et ses obligés"
 adastra_young_administration:0 "Une administration naissante"
 adastra_young_administration_desc:0 "Des bureaux, des registres, des traitements versés à date fixe. L'État sait enfin ce qu'il contient — et ce savoir a un coût, réglé tous les mois."
 mod_adastra_young_administration:0 "Une administration naissante"
 # 1.4 - Premiers pas : les decisions ont toujours ete jouables, mais leurs
 # retours narratifs etaient absents. Chaque cle est aussi presente en anglais.
 decision_core_suborbital_tooltip:0 "Lance une fusee-sonde au-dela de l'atmosphere. §RLa tentative peut echouer.§!\n\n§HCe que ce jalon apporte :§!\n£ship_size_science£ ouvre le jalon §YPremier satellite§!\n£ship_size_science£ chaque tentative, reussie ou non, ameliore la suivante\n\nLe risque baisse avec le §YBouclier ablatif§!, la §YTheorie de l'information§! et l'§YElectronique§!."
 decision_core_satellite_tooltip:0 "Place le premier satellite de notre civilisation en orbite.\n\n§HCe que ce jalon apporte :§!\n£ship_size_science£ ouvre le jalon §YPremier vol habite§!\n£ship_size_science£ notre civilisation cesse d'etre entierement aveugle a son propre ciel\n\nUn objet a nous reste la-haut, pour la premiere fois."
 decision_core_vol_habite_tooltip:0 "Envoie un equipage au-dela de l'atmosphere, et le ramene.\n\n§HCe que ce jalon apporte :§!\n£ship_size_science£ ouvre le jalon §YPremier atterrissage lunaire§!\n£ship_size_science£ a defaut de lune dans notre systeme, ouvre directement la §YSonde profonde§!\n\nAucune machine ne remplace un temoin."
 decision_core_premier_corps_tooltip:0 "Tente le premier atterrissage sur une lune de notre systeme natal.\n\n§HCe que ce jalon apporte :§!\n£ship_size_science£ cette lune devient §Yreconnue§!, sans prospection de ses gisements\n£ship_size_science£ ouvre le jalon §YSonde profonde§!\n\n§RIndisponible si notre systeme natal ne possede aucune lune.§!"
 decision_core_sonde_tooltip:0 "Envoie une sonde reconnaitre §Yun astre encore inconnu§! de notre systeme natal, tire au sort.\n\n§HCe que la mission rapporte :§!\n£ship_size_science£ l'astre devient §Yconnu§! et ses §Ygisements sont releves§!\n£ship_size_science£ elle ouvre le §YProgramme d'exploration spatiale§!\n\n§RChaque sonde deja lancee rencherit la suivante de 35 %.§! La decision reste disponible tant qu'il reste un astre a reconnaitre."
 adastra.101.name:0 "Le silence apres le feu"
 adastra.101.desc:0 "La fusee a quitte le sol, puis son signal s'est eteint. Nous avons perdu des machines, des ressources et un peu de confiance — pas la volonte de recommencer."
 adastra.101.a:0 "Nous recommencerons."
 adastra.102.name:0 "Une etoile artificielle"
 adastra.102.desc:0 "Notre satellite revient a chaque passage. Il porte des voix, des mesures et la preuve que le ciel peut devenir une infrastructure."
 adastra.102.a:0 "Le ciel nous repond."
 adastra.103.name:0 "Au-dessus de l'atmosphere"
 adastra.103.desc:0 "La fusee est revenue. Nous savons maintenant atteindre le ciel et en rapporter de la connaissance."
 adastra.103.a:0 "Ce n'est qu'un debut."
 adastra.104.name:0 "Quelqu'un est la-haut"
 adastra.104.desc:0 "Un etre vivant a vu notre monde depuis le noir, puis est revenu raconter ce que nos instruments ne pouvaient pas dire."
 adastra.104.a:0 "Le monde est plus petit vu d'en haut."
 adastra.107.name:0 "Tourner sans se poser"
 adastra.107.desc:0 "Notre systeme ne nous offre aucun autre sol. Nous avons tout de meme appris a demeurer dans le ciel, et ce premier poste deviendra notre point d'appui."
 adastra.107.a:0 "Nous ferons de l'orbite un lieu."
 adastra.108.name:0 "Un premier autre monde"
 adastra.108.desc:0 "Notre appareil s'est pose sur [event_target:core_cible.GetName], la premiere lune que notre civilisation a touchee. Cette trace minuscule change l'horizon de toute la civilisation."
 adastra.108.a:0 "Le ciel a un rivage."
 adastra.111.name:0 "Un monde dans le noir"
 adastra.111.desc:0 "Apres des annees de silence, notre sonde a atteint [event_target:core_sonde_cible.GetName]. Les instruments ont tenu : nous connaissons desormais sa surface, sa masse, et §Yce qu'il recele§!.\n\nLe systeme natal compte un astre de moins dans le noir."
 adastra.111.a:0 "Le systeme natal n'est plus entierement obscur."
 adastra.112.name:0 "Aucun astre inconnu"
 adastra.112.desc:0 "Tous les astres accessibles de notre systeme natal etaient deja connus. La mission prouve tout de meme que nous pouvons envoyer nos instruments plus loin que nous-memes."
 adastra.112.a:0 "La prochaine sonde ira plus loin."

 # --- 1.2 : colonisateur sous-luminique (retour Sithiya) ---
 NAME_Adastra_Corvette:0 "Corvette « Sentinelle »"
 NAME_Adastra_Corvette_FTL:0 "Corvette"
 NAME_Adastra_Colonizer:0 "Vaisseau de colonisation « Arche »"
 NAME_Adastra_Colonizer_FTL:0 "Vaisseau de colonisation"
 adastra_fleet_colony:0 "Expedition de l'Arche"
 adastra_tech_marque_fondatrice:0 "§HTechnologie fondatrice§!"
 adastra_tech_marque_fondatrice_desc:0 "Le programme spatial en dépend. L'Hyperpropulsion attend que les seize soient trouvées."
 adastra_zone_city_01_prereq:0 "Nécessite : §HPremière cité§!"
 adastra_zone_city_02_prereq:0 "Nécessite : §HCode de lois§!"
 # 1.4 - Premiers pas : noms et descriptions (les infobulles existaient deja)
 decision_core_suborbital:0 "Premier lancement suborbital"
 decision_core_suborbital_desc:0 "Une fusée-sonde monte, frôle le vide, et retombe. Quelques minutes au-dessus de l'atmosphère — assez pour mesurer, photographier, et donner envie de rester."
 decision_core_satellite:0 "Premier satellite"
 decision_core_satellite_desc:0 "Un point lumineux traverse le ciel du soir, et il est à nous. Ce qui monte peut désormais rester."
 decision_core_vol_habite:0 "Premier vol habite"
 decision_core_vol_habite_desc:0 "Quelqu'un est là-haut. Toute la planète retient son souffle avec lui."
 decision_core_premier_corps:0 "Premier atterrissage lunaire"
 decision_core_premier_corps_desc:0 "Se poser sur une lune, marcher ailleurs, revenir. Le premier pas sur un autre monde appartient à tout le monde."
 decision_core_sonde_profonde:0 "Sonde profonde"
 decision_core_sonde_profonde_desc:0 "Elle ne reviendra pas. Elle portera nos questions vers un astre encore inconnu de notre systeme natal, et peut-etre un jour une reponse fera le chemin inverse."
 adastra_home_system_protected:0 "§RCe systeme est le berceau d'une civilisation qui n'a pas encore quitte son monde. On ne s'y installe pas.§!"
 adastra.162.name:0 "La commission"
 adastra.162.desc:0 "Trois cents temoignages en dix ans, et plus aucun moyen de tous les attribuer a des ballons-sondes. Un depute a lu a voix haute, en seance, la liste des cas non expliques. Le silence qui a suivi valait un aveu.\n\nIl faut decider quoi faire de ce dossier."
 adastra.162.a:0 "Ouvrir une commission d'enquete. La verite d'abord."
 adastra.162.b:0 "Classer le dossier. La population n'est pas prete."
 adastra.163.name:0 "Le schisme du ciel"
 adastra.163.desc:0 "Le doute est devenu une question de societe. Les uns y voient une presence qui nous depasse et se prosternent ; les autres exigent des instruments, des chiffres, des protocoles.\n\nLes deux camps ont raison sur un point : quelque chose nous regarde."
 adastra.163.a:0 "Le ciel est un signe. Laissons la ferveur nous porter."
 adastra.163.b:0 "Le ciel est un phenomene. Mesurons-le."
 adastra.164.name:0 "Faut-il repondre ?"
 adastra.164.desc:0 "Nos antennes peuvent desormais emettre plus loin que nous ne saurons jamais voyager. La question n'est plus technique.\n\nUne civilisation qui crie dans le noir apprend vite si quelqu-un ecoute - et ce que ce quelqu-un vaut."
 adastra.164.a:0 "Emettre. Qu-ils sachent que nous sommes la."
 adastra.164.b:0 "Se taire et ecouter. On n-appelle pas ce qu-on ne connait pas."
 adastra.165.name:0 "Nous savons"
 adastra.165.desc:0 "Il n'y a plus de debat, plus de commission, plus de sceptiques credibles. Notre espece sait, dans sa quasi-totalite, qu'elle partage l'univers.\n\nCe qui change n'est pas le ciel : c'est nous. Chaque debris etudie, chaque trajectoire recalculee nous apprend quelque chose que nous n'aurions pas invente seuls."
 adastra.165.a:0 "Alors apprenons d'eux."
 adastra.101.recap:0 "£ship_size_science£ §R-3 stabilite§! et §R-5 % d'unite§! pendant dix ans : le pays porte le deuil du lancement.\n£ship_size_science£ La prochaine tentative sera §Yplus sure§! : l'experience compte."
 adastra.102.recap:0 "£ship_size_science£ §G+4 % d'unite§!, §G+3 % de vitesse de recherche§! et §G+1 de portee de capteurs§! pendant dix ans.\n£ship_size_science£ Ouvre le jalon §YPremier vol habite§!."
 adastra.103.recap:0 "£ship_size_science£ §G+3 % de vitesse de recherche§! et §G+3 % de vitesse des vaisseaux§! pendant dix ans.\n£ship_size_science£ Ouvre le jalon §YPremier satellite§!."
 adastra.104.recap:0 "£ship_size_science£ §G+6 % d'unite§! et §G+2 stabilite§! pendant dix ans.\n£ship_size_science£ Ouvre le §YPremier atterrissage lunaire§! (ou la §YSonde profonde§! sans lune)."
 adastra.106.recap:0 "£ship_size_science£ La lune atteinte devient §Yreconnue§!.\n£ship_size_science£ §G+8 % d'unite§!, §G+3 stabilite§!, §G+3 % de vitesse de recherche§! pendant dix ans.\n£ship_size_science£ Ouvre le jalon §YSonde profonde§!."
 adastra.111.recap:0 "£ship_size_science£ [event_target:core_sonde_cible.GetName] devient §Yreconnu§!, gisements compris.\n£ship_size_science£ La sonde peut etre relancee tant qu'un astre reste inconnu, §Rchaque lancement rencherissant le suivant§!."
 adastra.112.recap:0 "£ship_size_science£ Aucun astre inconnu ne restait a portee : la mission confirme nos releves.\n£ship_size_science£ Le programme spatial retient surtout que §Ynous savons envoyer loin§!."
 adastra_ciel_lointain:0 "Un ciel lointain"
 desc_adastra_ciel_lointain:0 "Un monde sans flotte ni relais reste un mystere pour les telescopes des autres : tant que nous n'avons pas pris notre envol, les chaines de premier contact avancent au quart de leur vitesse - et celles que nous menons se concluent sans communications : ce que nous percevons la-haut reste sans nom."
 adastra.166.name:0 "L'age de l'astronomie"
 adastra.166.desc:0 "Notre science est entree dans l'age spatial, et elle changera desormais d'echelle avec nos instruments.\n\n§HLe rythme de cet age :§!\n§Yles premieres decouvertes§! sont a portee de nos laboratoires actuels ;\n§Yun radiotelescope§! ouvrira la vague suivante ;\n§Yle telescope spatial§! ouvrira les dernieres.\n\nRegarder plus loin, c'est comprendre davantage. Nos observatoires ne sont plus un ornement : ils sont le moteur."
 adastra.166.a:0 "Le ciel est notre laboratoire."
 adastra.167.name:0 "La science plafonne"
 adastra.167.desc:0 "Nos chercheurs tournent en rond : les questions ouvertes exigent des donnees que nos instruments au sol ne captent pas.\n\nIl nous faut un §Yradiotelescope§!. Tant qu'il n'existera pas, une partie de la science de cet age restera hors de portee."
 adastra.167.a:0 "Construisez-le."
 adastra.168.name:0 "Au-dela de l'atmosphere"
 adastra.168.desc:0 "Le radiotelescope a tenu ses promesses, et il montre ses limites : l'atmosphere brouille ce que nous cherchons desormais.\n\nLa §YTeledetection§! est acquise : ameliorer notre radiotelescope en §Ytelescope spatial§! ouvrira les dernieres decouvertes de cet age."
 adastra.168.a:0 "Envoyez-le la-haut."
 adastra.169.name:0 "On ne s'espionne pas soi-meme"
 adastra.169.desc:0 "Le chantier orbital a bien produit... un poste d'observation braque sur notre propre monde. Les ingenieurs, un peu genes, l'ont demonte et ont recycle les materiaux.\n\nUn poste d'observation sert a etudier une civilisation qui s'ignore observee. Nous, nous savons."
 adastra.169.a:0 "Rendez les alliages au chantier."
 adastra.170.name:0 "Quelque chose traverse le ciel"
 adastra.170.desc.ancien:0 "Une forme immense a glisse entre les etoiles, trop lente pour une etoile filante, trop reguliere pour un nuage. Les anciens se souviennent des recits : quand le ciel bouge, les dieux marchent.\n\nLes feux ont brule toute la nuit dans les villages."
 adastra.170.desc.medieval:0 "Des temoins dignes de foi - moines, pilotes de barge, une abbesse - decrivent la meme chose : une forme vivante, immense, entre les nuages et les etoiles. L'Eglise y voit un signe. Les ecoles y voient un phenomene.\n\nLe royaume entier en debat."
 adastra.170.desc.victorien:0 "Les observatoires ont enregistre le passage : masse estimee colossale, trajectoire irreguliere, aucune parallaxe d'etoile. Les journaux s'arrachent les gravures. Les academies, elles, s'arrachent les donnees.\n\nQuoi que ce soit, cela VIT la-haut."
 adastra.170.desc.machine:0 "Le radar l'a suivi pendant quatre heures : une masse organique de la taille d'une flotte, en orbite haute, puis plus rien. L'etat-major exige des reponses que la science n'a pas.\n\nLes credits de defense viennent d'etre votes sans debat."
 adastra.170.a:0 "Les dieux marchent. Honorons-les."
 adastra.170.b:0 "Les dieux marchent. Cachons-nous."
 adastra.170.c:0 "C'est un signe : que la foi nous rassemble."
 adastra.170.d:0 "C'est un phenomene : que les ecoles l'etudient."
 adastra.170.e:0 "Financez les observatoires. Nous voulons comprendre."
 adastra.170.f:0 "Etudiez sa structure. Tout ce qui vole s'imite."
 adastra.170.g:0 "Classez le dossier. La population n'est pas prete."
 adastra.181.name:0 "Ils cedent le ciel"
 adastra.181.desc:0 "Contre toute attente, la reponse est venue sans condition : la station est a nous. Peut-etre par respect. Peut-etre parce qu'un monde qui gronde sous une base coute plus cher qu'il ne rapporte.\n\nNos equipages montent a bord d'une structure qu'ils n'ont pas construite."
 adastra.181.a:0 "Ce ciel est a nous."
 adastra.181.recap:0 "£ship_size_science£ La §Ybase stellaire du systeme natal§! passe sous notre pavillon ; l'occupant §Ydemonte ses stations minieres et de recherche§! et §Yefface ses releves§! - notre ciel est de nouveau a prospecter."
 adastra.182.name:0 "Tout a un prix"
 adastra.182.desc:0 "La reponse est une facture. Ils partiront - equipements compris - contre paiement. C'est humiliant, c'est du racket orbital, et c'est probablement la meilleure offre que nous aurons."
 adastra.182.a:0 "Payer 1500 energie et 500 alliages. Le ciel vaut ce prix."
 adastra.182.recap:0 "£ship_size_science£ Contre §R1500 energie + 500 alliages§!, la §Ybase stellaire§! passe sous notre pavillon, les §Ystations de l'occupant sont demontees§! et ses §Yreleves effaces§! - notre ciel est de nouveau a prospecter."
 adastra.184.name:0 "Un Batisseur sans chantier"
 adastra.184.desc:0 "Le vaisseau de construction est sorti des cales - et son equipage contemple un ciel deja pris. On ne bat pas une base stellaire dans une orbite qu'un autre pavillon revendique.\n\nNos options tiennent en un mot : negocier."
 adastra.184.a:0 "Le chantier attendra. Pas nous."
 adastra.184.recap:0 "£ship_size_science£ Le Batisseur reste disponible. La decision §YReclamer notre ciel§!, sur notre capitale, ouvre la negociation avec l'occupant."
 adastra.171.name:0 "Vivre sous leur etoile"
 adastra.171.desc.ancien:0 "L'astre fixe ne bouge pas avec les saisons. Les pretres ont fini par trancher : c'est une demeure, et quelqu'un y vit. Un temple s'eleve, oriente vers ce point du ciel qui ne cille jamais."
 adastra.171.desc.medieval:0 "Les astronomes du roi le confirment sous serment : l'etoile fixe est une CHOSE, pas un feu celeste. La chaire y voit une heresie a etouffer, l'universite une verite a instruire. Le royaume choisit son camp."
 adastra.171.desc.victorien:0 "Les journaux posent enfin la question interdite : qui possede notre ciel ? La structure en orbite n'est pas a nous, ne repond pas, ne part pas. La souverainete ne s'arrete-t-elle donc qu'aux nuages ?"
 adastra.171.desc.machine:0 "Chaque nuit, il passe. Chaque nuit, des millions de regards le suivent. L'occupation silencieuse de notre orbite est devenue le fait politique central de notre epoque - et le meilleur argument de recrutement de nos ingenieurs."
 adastra.171.a:0 "Un temple pour la demeure celeste."
 adastra.171.b:0 "L'instruire : que chacun sache ce qui nous surplombe."
 adastra.171.c:0 "L'etouffer : le trouble ne passera pas par nous."
 adastra.171.d:0 "Notre ciel, notre cause. La presse s'en chargera."
 adastra.171.e:0 "Qu'ils nous surplombent : nous apprendrons d'eux."
 adastra.171.f:0 "L'occupation nous soude. Qu'elle nous serve."
 adastra_illumination:0 "Illumines"
 desc_adastra_illumination:0 "Un empire stellaire nous enseigne. Sa science coule dans nos ecoles - et sa maniere de penser avec."
 adastra.172.name:0 "Les maitres du ciel"
 adastra.172.desc:0 "Ils ne se cachent plus : ils enseignent. Des equations tombent du ciel comme la pluie - propulsion, medecine, materiaux - chacune avec dix ans d'avance sur nos meilleurs laboratoires.\n\nNos savants devorent. Nos anciens s'inquietent : qui apprend d'un maitre apprend aussi a obeir."
 adastra.172.a:0 "Apprenons. Nous verrons bien qui nous devenons."
 adastra.172.recap:0 "£ship_size_science£ Tant que le pacte dure : §G+25 % de vitesse de recherche§!, §R-10 % d'unite§!."
 adastra_elan_societe:0 "Elan des sciences sociales"
 adastra_elan_physique:0 "Elan de la physique"
 adastra_elan_ingenierie:0 "Elan de l'ingenierie"
 adastra_elan_unite:0 "Elan d'unite"
 decision_adastra_national_programme_tooltip:0 "Choisit l'orientation civile des §Ycinq prochaines annees§!.\n\n§HCe que ce choix implique :§!\n£ship_size_science£ un seul programme actif a la fois\n£ship_size_science£ les orientations proposees suivent l'age atteint\n£ship_size_science£ le cout suit l'age : §Y25§! unite avant le Medieval, §Y60§!, puis §Y140§! a l'Industriel et §Y280§! a l'Age spatial\n\n§RRelancable a l'echeance : une orientation peut etre reconduite ou changee.§!"
 adastra_action_negociation_recente:0 "Les pourparlers viennent d'avoir lieu : revenir a la table dans §Ydeux ans§!."
 adastra.173.name:0 "Quelque chose habite le ciel"
 adastra.173.desc.ancien:0 "Les lumieres ne se comportent pas comme des etoiles. Elles s'arretent, repartent, reviennent aux memes heures. Les pretres disent que les dieux patrouillent ; personne n'ose dire a voix haute que les dieux ont l'air occupes."
 adastra.173.desc.savant:0 "Les observations concordent d'une ville a l'autre : des points brillants aux trajectoires reglees, trop lentes pour des meteores, trop sures pour des astres. Les academies se disputent l'explication - aucune ne tient."
 adastra.173.desc.moderne:0 "Les releves radar sont formels : des objets manoeuvrent au-dessus de nous. Vitesses impossibles, silence radio, aucune immatriculation. Les etats-majors classent le dossier ; les operateurs, eux, n'oublient pas ce qu'ils ont vu."
 adastra.173.desc.spatial:0 "Cette fois nos instruments ont tout capte : structures artificielles, propulsion dirigee, activite coordonnee. Une civilisation etrangere opere dans notre voisinage. Nous ne savons ni son nom, ni son visage, ni ses frontieres - seulement qu'elle existe, et qu'elle ne se presente pas."
 adastra.173.a:0 "Continuer d'observer."
 adastra.173.recap:0 "£ship_size_science£ Une presence etrangere est percue, mais §Yaucune communication§! n'est etablie : son nom, sa capitale et ses frontieres restent inconnus. Ces informations viendront de §Yquelqu'un§! - ou de notre emergence."
 adastra.174.name:0 "Ils se declarent"
 adastra.174.desc:0 "Le signal traverse toutes nos frequences a la fois, dans une langue qui apprend la notre en quelques phrases. Ceux qui tiennent notre ciel ont enfin juge utile de se presenter. Ils ont un nom, des frontieres, des intentions - et le message se termine par une formule qui ressemble a une politesse, ou a un avertissement."
 adastra.174.a:0 "Nous avons beaucoup a leur dire."
 adastra.174.recap:0 "£ship_size_science£ Les §Ycommunications§! sont etablies avec l'empire qui tient notre ciel - et la decision §YReclamer notre ciel§! s'ouvre sur notre capitale."
 adastra.186.name:0 "Le prix de leur protection"
 adastra.186.desc:0 "Ils acceptent - a leur maniere. Le ciel nous sera rendu, les stations demontees, les releves effaces. En echange, notre monde versera le tribut et reconnaitra leur autorite. Ils appellent cela une protection. Nos historiens connaissent d'autres noms."
 adastra.186.a:0 "Accepter. Le ciel d'abord, la liberte ensuite."
 adastra.186.b:0 "Refuser. Nous ne servirons personne."
 adastra.186.recap:0 "£ship_size_science£ La §Ybase stellaire§! passe sous notre pavillon, leurs stations sont demontees, leurs releves effaces - et notre empire devient leur §Rtributaire§!."
 adastra.187.name:0 "Fin de non-recevoir"
 adastra.187.desc:0 "La reponse tient en une ligne : cette installation est essentielle a leurs operations, et la question est close. Nos juristes, eux, viennent d'ouvrir un autre dossier : celui qui etablit, piece par piece, que ce systeme est le notre. Si les mots ne suffisent pas, il restera les actes."
 adastra.187.a:0 "Ce ciel est a nous. Nous irons le prendre."
 adastra.187.recap:0 "£ship_size_science£ Nous obtenons une §Yrevendication§! sur notre systeme natal : §Rdeclarer la guerre§! a l'occupant devient la voie pour reprendre notre ciel par la force."
 adastra.182.b:0 "Refuser de payer. Nous reviendrons plus forts."
 decision_adastra_reclamer_ciel:0 "Reclamer notre ciel"
 decision_adastra_reclamer_ciel_desc:0 "Un pavillon etranger flotte au-dessus de notre monde - et cette fois, nous savons a qui parler. Nos diplomates porteront une demande simple : cette orbite est la notre."
 decision_adastra_reclamer_ciel_tooltip:0 "Porte notre reclamation a l'empire qui tient la base stellaire du systeme natal.\n\n§HSon ethique decide, sans tirage :§!\n£ship_size_science£ §Gpacifiste ou xenophile§! : cession gratuite\n£ship_size_science£ §Yautoritaire§! : cession contre la §Ytributarite§!\n£ship_size_science£ §Ymegacorporation, materialiste ou egalitaire§! : cession contre §R1500 energie + 500 alliages§!\n£ship_size_science£ §Rxenophobe ou militariste§! : refus - et une §Yrevendication§! sur notre systeme, ouvrant la voie de la §Rguerre§!\n\nToute cession transfere la base, demonte leurs stations et efface leurs releves.\n\n§RDisponible des l'etape du Programme de chantier orbital. Deux ans entre deux tentatives.§!"
 adastra_decision_reclamer_comms:0 "L'occupant ne s'est pas encore declare : aucune communication n'est etablie avec lui."
 fcsum_adastra_veille_summary:0 "Nos instruments gardent l'objet a l'etude. Tant que nous restons au sol, il ne repondra pas - et nous ne saurons pas qui il est."
