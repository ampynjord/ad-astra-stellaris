 # Situation : La Longue Ascension
 situation_adastra_ascension:0 "Au-delà des étoiles"
 situation_adastra_ascension_type:0 "Au-delà des étoiles"
 situation_adastra_ascension_desc:0 "Notre civilisation gravit une à une les marches qui séparent son berceau des étoiles. Chaque âge apporte ses savoirs, ses outils - et ses épreuves. Au sommet de cette ascension : les équations du voyage supraluminique.\n\n§YPour passer d'un âge au suivant, deux conditions§! : la progression ci-dessus doit atteindre la fin de l'étape, §Yet les vingt-cinq technologies de l'âge doivent toutes être découvertes§!. La barre s'arrête d'elle-même tant qu'il reste quelque chose à inventer.\n\n§HL'ascension a trois actes.§!\n§YLe sol§! (Pierre à Fer) : survivre, s'établir, bâtir.\n§YLe monde§! (Médiéval à Industriel) : un monde qui grandit, et une production qui coûte.\n§YLe ciel§! (Machine à Spatial) : regarder, lancer, atteindre."
 situation_adastra_ascension_monthly_change_tooltip:0 "La progression augmente chaque mois. Une approche volontariste, une production d'£unity£ unité soutenue et une recherche £physics£ active l'accélèrent.\n\nElle se §Rfige§! à la fin de chaque étape tant que les §Yvingt-cinq technologies de l'âge§! ne sont pas toutes découvertes."
