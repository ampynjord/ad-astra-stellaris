l_french:
 decision_adastra_navy:0 "Programme de flotte militaire"
 decision_adastra_navy_desc:0 "Le vide au-dessus de nos têtes n'est peut-être pas aussi vide qu'il en a l'air. Une flottille de corvettes, même confinées au système, garantirait que personne ne nous prenne notre orbite sans le payer."
 decision_adastra_navy_tooltip:0 "Livre §Ytrois corvettes§! sous-luminiques (améliorables après la percée).\n§HFacultatif et répétable§! - disponible jusqu'à la découverte de l'§YHyperpropulsion§! : après, il faudra les construire vous-même."
 adastra_focus_145.name:0 "Le bouclier du berceau"
 adastra_focus_145.desc:0 "Lever notre première flottille militaire avant la percée."
 adastra_focus_145.hint:0 "Promulguez la décision facultative §YProgramme de flotte militaire§! (après la base stellaire, avant l'Hyperpropulsion)."
 adastra_focus_145.lore:0 "Personne ne nous prendra notre orbite sans le payer."
 adastra_focus_145.fail:0 "Lever une flottille militaire"
 adastra_focus_145.success:0 "Le berceau a son bouclier"
 adastra_finisher_title:0 "À l'issue : l'émergence"
 adastra_finisher_desc:0 "La découverte de l'§YHyperpropulsion§! achève l'Ascension : votre civilisation émerge dans la galaxie en empire spatial classique - vaisseaux réarmés en Hyperpropulsion et §YHéritage de l'Ascension§! en récompense permanente."
 NAME_Adastra_Science_FTL:0 "Vaisseau scientifique"
 NAME_Adastra_Constructor_FTL:0 "Vaisseau de construction"
 NAME_Adastra_Science:0 "Vaisseau scientifique 'Pionnier'"
 NAME_Adastra_Constructor:0 "Vaisseau de construction 'Bâtisseur'"
 adastra_progress_program:0 "Programme spatial en cours (progression par jalons)"
 adastra_stage_program_explore:0 "Programme d'exploration spatiale"
 adastra_stage_program_explore_desc:0 "Promulguez la décision §YProgramme d'exploration spatiale§! sur votre capitale, puis prospectez chaque astre du système : en §Yvue système§!, clic droit sur un astre → §YProspecter§!. L'étoile est déjà connue."
 adastra_stage_program_orbital:0 "Programme de base stellaire"
 adastra_stage_program_orbital_desc:0 "Promulguez la décision §YProgramme de base stellaire§!, puis exploitez le système : au moins §Y1 station§! minière ou de recherche. Facultatif : le §YProgramme de flotte militaire§! (disponible jusqu'à la percée)."
 adastra_stage_program_hyperdrive:0 "Programme hyperspatial"
 adastra_stage_program_hyperdrive_desc:0 "Promulguez la décision §YProgramme hyperspatial§!, puis recherchez l'£physics£ §YHyperpropulsion§! pour achever l'Ascension."
 decision_adastra_explore:0 "Programme d'exploration spatiale"
 decision_adastra_explore_desc:0 "Assembler notre premier véritable vaisseau spatial : un bâtiment scientifique sous-luminique, incapable de quitter le système, mais capable d'en percer tous les secrets."
 decision_adastra_explore_tooltip:0 "Livre un §Yvaisseau scientifique§! (sous-luminique - il ne peut pas quitter le système).\n§HÉtape suivante :§! prospectez §Ychaque astre du système§! : en §Yvue système§!, clic droit sur une planète, lune ou astéroïde → §YProspecter§!. (L'ordre de prospection depuis la carte galactique ne fonctionne pas pour un vaisseau sous-luminique ; l'étoile est déjà connue de vos astronomes.)"
 decision_adastra_starbase:0 "Programme de base stellaire"
 decision_adastra_starbase_desc:0 "Assembler en orbite le premier chantier spatial de notre histoire, et le vaisseau de construction qui bâtira nos avant-postes dans le système."
 decision_adastra_starbase_fail:0 "Un autre empire contrôle l'orbite de votre monde natal."
 decision_adastra_starbase_tooltip:0 "Construit une §Ybase stellaire§! (chantier spatial, panneaux solaires, quartiers de l'équipage) et livre un §Yvaisseau de construction§!.\n§HÉtape suivante :§! bâtissez au moins §Y1 station§! minière ou de recherche dans le système.\n§HFacultatif :§! le §YProgramme de flotte militaire§! devient disponible."
 decision_adastra_hyperdrive:0 "Programme hyperspatial"
 decision_adastra_hyperdrive_desc:0 "Mobiliser toutes nos ressources scientifiques et industrielles vers un seul but : percer le secret du voyage plus rapide que la lumière."
 decision_adastra_hyperdrive_tooltip:0 "Rend la technologie £physics£ §YHyperpropulsion§! disponible à la recherche.\n§HÉtape finale :§! sa découverte achèvera l'Ascension - vous serez alors un empire spatial de plein droit."
 adastra.80.name:0 "Le programme d'exploration spatiale"
 adastra.80.desc:0 "Les âges de notre monde sont derrière nous. Devant nous : le vide, et tout ce qu'il cache.\n\nNos ingénieurs sont prêts à assembler notre premier véritable vaisseau spatial - sans hyperpropulsion, prisonnier du système, mais libre d'en percer tous les secrets. Le gouvernement n'attend plus que l'ordre de lancement."
 adastra.80.a:0 "Que l'exploration commence."
 adastra.80.a.tooltip:0 "La décision §YProgramme d'exploration spatiale§! est disponible sur votre capitale (£energy£ 500 énergie, £minerals£ 300 minerais, £alloys£ 150 alliages - 6 mois).\nPuis prospectez le système avec le vaisseau livré : en §Yvue système§!, §Yclic droit§! sur chaque astre → §YProspecter§! (l'ordre global de la carte galactique ne fonctionne pas en sous-luminique)."
 adastra.81.name:0 "Le programme de base stellaire"
 adastra.81.desc:0 "Chaque planète, chaque lune, chaque astéroïde de notre système porte désormais un nom et un dossier d'étude. Notre vaisseau scientifique a achevé la grande cartographie.\n\nL'étape suivante attend en orbite : un chantier spatial permanent, et les vaisseaux de construction qui transformeront ces cailloux en richesses."
 adastra.81.a:0 "Bâtissons notre premier port vers les étoiles."
 adastra.81.a.tooltip:0 "La décision §YProgramme de base stellaire§! est disponible sur votre capitale (£energy£ 1000 énergie, £minerals£ 800 minerais, £alloys£ 500 alliages - 1 an).\nPuis bâtissez au moins §Y1 station§! minière ou de recherche dans le système."
 adastra.82.name:0 "Le programme hyperspatial"
 adastra.82.desc:0 "Des stations bourdonnent autour de nos mondes, du minerai et des données affluent vers la surface. Notre système travaille pour nous.\n\nIl ne reste qu'un seuil à franchir - le dernier, le plus grand. Nos théoriciens jurent que l'hyperespace n'est pas une fable. Il est temps de leur donner les moyens de le prouver."
 adastra.82.a:0 "Vers l'infini."
 adastra.82.a.tooltip:0 "La décision §YProgramme hyperspatial§! est disponible sur votre capitale (£energy£ 1500 énergie, £alloys£ 300 alliages, £unity£ 500 unité - 1 an).\nPuis recherchez l'§YHyperpropulsion§! : sa découverte achèvera l'Ascension."
 adastra_focus_130.name:0 "Premier envol"
 adastra_focus_130.desc:0 "Lancer notre premier vaisseau scientifique."
 adastra_focus_130.hint:0 "Promulguez la décision §YProgramme d'exploration spatiale§! sur votre capitale."
 adastra_focus_130.lore:0 "Il ne quittera jamais le système. Il n'en a pas besoin : c'est un début."
 adastra_focus_130.fail:0 "Lancer le vaisseau scientifique"
 adastra_focus_130.success:0 "Notre premier vaisseau vole"
 adastra_focus_135.name:0 "La grande cartographie"
 adastra_focus_135.desc:0 "Prospecter l'intégralité du système natal."
 adastra_focus_135.hint:0 "En vue système, clic droit sur chaque astre → §YProspecter§! avec votre vaisseau scientifique (l'étoile est déjà connue)."
 adastra_focus_135.lore:0 "Chaque caillou du ciel a désormais un nom."
 adastra_focus_135.fail:0 "Prospecter tout le système natal"
 adastra_focus_135.success:0 "Le système natal est cartographié"
 adastra_focus_140.name:0 "L'orbite industrieuse"
 adastra_focus_140.desc:0 "Bâtir la base stellaire et exploiter le système."
 adastra_focus_140.hint:0 "Promulguez la décision §YProgramme de base stellaire§! puis bâtissez au moins 1 station minière ou de recherche."
 adastra_focus_140.lore:0 "Le vide n'est pas vide : il est plein de richesses qui attendent."
 adastra_focus_140.fail:0 "Bâtir la base et exploiter le système"
 adastra_focus_140.success:0 "Notre système travaille pour nous"
 adastra_focus_100.name:0 "Le siècle des machines à vapeur"
 adastra_focus_100.desc:0 "Faire entrer notre civilisation dans l'$steam_age$."
 adastra_focus_100.hint:0 "Progressez dans la situation §YAu-delà des étoiles§! jusqu'à l'$steam_age$."
 adastra_focus_100.lore:0 "La nature n'imposera plus son rythme : nous imposerons le nôtre."
 adastra_focus_100.fail:0 "Atteindre l'$steam_age$"
 adastra_focus_100.success:0 "L'$steam_age$ est atteint"
 adastra_focus_105.name:0 "L'électricité et l'acier"
 adastra_focus_105.desc:0 "Faire entrer notre civilisation dans l'$machine_age$."
 adastra_focus_105.hint:0 "Progressez dans la situation §YAu-delà des étoiles§! jusqu'à l'$machine_age$."
 adastra_focus_105.lore:0 "Dans les caves ministérielles, les premiers calculateurs bourdonnent déjà."
 adastra_focus_105.fail:0 "Atteindre l'$machine_age$"
 adastra_focus_105.success:0 "L'$machine_age$ est atteint"
 adastra_focus_110.name:0 "Le feu du cœur de la matière"
 adastra_focus_110.desc:0 "Faire entrer notre civilisation dans l'$atomic_age$."
 adastra_focus_110.hint:0 "Progressez dans la situation §YAu-delà des étoiles§! jusqu'à l'$atomic_age$."
 adastra_focus_110.lore:0 "Un éclair plus brillant que le soleil, et le monde ne sera plus jamais le même."
 adastra_focus_110.fail:0 "Atteindre l'$atomic_age$"
 adastra_focus_110.success:0 "L'$atomic_age$ est atteint"
 adastra_focus_115.name:0 "Sortir du berceau"
 adastra_focus_115.desc:0 "Faire entrer notre civilisation dans les $early_space_age$."
 adastra_focus_115.hint:0 "Progressez dans la situation §YAu-delà des étoiles§! jusqu'aux $early_space_age$."
 adastra_focus_115.lore:0 "Une capsule minuscule, quatre-vingt-dix minutes, et le monde entier dans un hublot."
 adastra_focus_115.fail:0 "Atteindre les $early_space_age$"
 adastra_focus_115.success:0 "Les $early_space_age$ sont atteints"
 adastra_focus_120.name:0 "Les équations de l'hyperespace"
 adastra_focus_120.desc:0 "Rechercher la technologie §YHyperpropulsion§!."
 adastra_focus_120.hint:0 "Achevez la situation §YAu-delà des étoiles§! puis recherchez l'§YHyperpropulsion§! en physique."
 adastra_focus_120.lore:0 "Sur un tableau noir couvert de craie, une poignée de symboles fait basculer l'histoire."
 adastra_focus_120.fail:0 "Rechercher l'§YHyperpropulsion§!"
 adastra_focus_120.success:0 "L'§YHyperpropulsion§! est maîtrisée"
 adastra_focus_125.name:0 "Ad astra"
 adastra_focus_125.desc:0 "Lancer le programme spatial et émerger dans la galaxie."
 adastra_focus_125.hint:0 "Promulguez la décision §YLancement du programme spatial§! sur votre capitale."
 adastra_focus_125.lore:0 "Per aspera ad astra. La longue enfance de notre espèce s'achève."
 adastra_focus_125.fail:0 "Émerger dans la galaxie"
 adastra_focus_125.success:0 "Notre civilisation a rejoint les étoiles"
 adastra.16.name:0 "Les équations sont à nous"
 adastra.16.desc:0 "Des années de calcul, des fortunes englouties, des carrières entières consumées - et ce matin, sur un tableau couvert de craie, la dernière inconnue est tombée.\n\nL'hyperespace n'est plus une conjecture. Nos laboratoires peuvent désormais transformer la théorie en machine."
 adastra.16.a:0 "La dernière marche."
 adastra.16.a.tooltip:0 "La technologie £physics£ §YHyperpropulsion§! est disponible dans la recherche de physique. Sa découverte §Yachève l'Ascension§! : vous deviendrez un empire spatial classique, avec vos vaisseaux, votre base et votre système."
 adastra_approach_tradition_extra:0 "§RProgression mensuelle : -0.05§!\n"
 adastra_approach_forced_march_extra:0 "§GProgression mensuelle : +0.15§!\n"
 adastra_approach_skywatchers_extra:0 "§GProgression mensuelle : +0.05§!\n"
 adastra_progress_tradition:0 "Continuité prudente"
 adastra_heritage_1:0 "Héritage de l'Ascension"
 adastra_heritage_1_desc:0 "Notre civilisation a gravi seule les dernières marches vers les étoiles. Ce souvenir l'accompagnera toujours."
 mod_adastra_heritage_1:0 "Héritage de l'Ascension"
 mod_adastra_heritage_1_desc:0 "Notre civilisation a gravi seule les dernières marches vers les étoiles."
 adastra_heritage_2:0 "Héritage de l'Ascension"
 adastra_heritage_2_desc:0 "Des fumées de l'industrie aux feux de l'orbite : notre peuple a forgé sa route. Cette mémoire le rend inébranlable."
 mod_adastra_heritage_2:0 "Héritage de l'Ascension"
 mod_adastra_heritage_2_desc:0 "Des fumées de l'industrie aux feux de l'orbite : notre peuple a forgé sa route."
 adastra_heritage_3:0 "Héritage de l'Ascension"
 adastra_heritage_3_desc:0 "Des parchemins aux fusées, notre peuple a traversé un demi-millénaire d'épreuves. Sa patience est devenue une force."
 mod_adastra_heritage_3:0 "Héritage de l'Ascension"
 mod_adastra_heritage_3_desc:0 "Des parchemins aux fusées, notre peuple a traversé un demi-millénaire d'épreuves."
 adastra_heritage_4:0 "Héritage de l'Ascension"
 adastra_heritage_4_desc:0 "Du silex à l'hyperespace : aucune civilisation de la galaxie n'a parcouru un si long chemin par ses propres forces. Rien ne pourra plus jamais nous arrêter."
 mod_adastra_heritage_4:0 "Héritage de l'Ascension"
 mod_adastra_heritage_4_desc:0 "Du silex à l'hyperespace : aucune civilisation n'a parcouru un si long chemin seule."
 adastra_dormant_galaxy:0 "Galaxie assoupie"
 adastra_dormant_galaxy_desc:0 "Le temps galactique semble suspendu : les grandes puissances stellaires n'avancent qu'à peine, comme si l'histoire attendait quelqu'un."
 mod_adastra_dormant_galaxy:0 "Galaxie assoupie"
 mod_adastra_dormant_galaxy_desc:0 "Le temps galactique semble suspendu, comme si l'histoire attendait quelqu'un."
 adastra.7.name:0 "Le rythme de la galaxie"
 adastra.7.desc:0 "Une dernière question se pose avant que notre chronique ne commence : pendant que notre civilisation gravit ses âges, que fait le reste de la galaxie ?\n\nLes autres empires stellaires peuvent vivre leur histoire à leur rythme normal - explorer, s'étendre, guerroyer - ou bien la galaxie peut retenir son souffle jusqu'à notre émergence, pour que la course commence à armes égales."
 adastra.7.a:0 "La galaxie vit sa vie. Nous arriverons en retard - et alors ?"
 adastra.7.a.tooltip:0 "Aucun changement : les empires IA jouent normalement pendant votre ascension. §RIls auront une avance considérable.§!"
 adastra.7.b:0 "Que la galaxie retienne son souffle jusqu'à notre émergence."
 adastra.7.b.tooltip:0 "Tous les empires IA sont §Ydésactivés§! : plus d'expansion, de recherche, de diplomatie ni de guerres. Ils se réveilleront à votre §Ypercée supraluminique§!."
 # Origine
 origin_adastra:0 "Ad Astra"
 origin_adastra_desc:0 "Per aspera ad astra - par des sentiers ardus jusqu'aux étoiles. Cette civilisation pré-PRL n'a encore jamais quitté son monde natal. Chaque âge de son histoire reste à écrire, sous un ciel qui n'est peut-être pas aussi vide qu'il en a l'air."
 origin_adastra_effects:0 "- Lance la partie §Rsans vaisseaux ni base stellaire§! : votre civilisation est confinée à son monde natal.\n- Choix de l'§Hâge de départ§! au premier jour, de l'§H$stone_age$§! aux §H$early_space_age$§!.\n- La situation §HAu-delà des étoiles§! suit votre progression d'âge en âge dans le journal de bord.\n- Les §Htechnologies de départ§! sont verrouillées et se débloquent à l'âge qui les a vues naître ; un §Hprogramme spatial en trois phases§! (exploration, base stellaire, programme hyperspatial) mène à la véritable recherche £physics£ §HHyperpropulsion§!.\n- Vivez l'observation du point de vue des observés : ovnis, disparitions, signaux venus du vide...\n\n§RPénalités :§!\n- £research£ Recherche, £pops£ production des emplois et £unity£ unité réduites selon l'âge courant.\n- Population de départ réduite selon l'âge choisi.\n- Si un empire s'installe dans votre système natal avant votre percée, votre émergence se négociera avec lui..."

 # Modificateurs
 adastra_reverse_engineering:0 "Rétro-ingénierie d'artefacts"
 adastra_reverse_engineering_desc:0 "Dans des hangars gardés jour et nuit, nos meilleurs esprits démontent des fragments d'une technologie qui ne devrait pas exister."
 mod_adastra_reverse_engineering:0 "Rétro-ingénierie d'artefacts"
 mod_adastra_reverse_engineering_desc:0 "Nos meilleurs esprits démontent des fragments d'une technologie qui ne devrait pas exister."
 adastra_ufo_panic:0 "Panique céleste"
 adastra_ufo_panic_desc:0 "Ils sont là-haut. Tout le monde le sait, personne ne sait ce qu'ils veulent."
 mod_adastra_ufo_panic:0 "Panique céleste"
 mod_adastra_ufo_panic_desc:0 "Ils sont là-haut. Tout le monde le sait, personne ne sait ce qu'ils veulent."
 adastra_sky_fervor:0 "Ferveur du ciel"
 adastra_sky_fervor_desc:0 "La révélation que nous ne sommes pas seuls a soudé la population autour d'un rêve commun : les rejoindre."
 mod_adastra_sky_fervor:0 "Ferveur du ciel"
 mod_adastra_sky_fervor_desc:0 "La révélation que nous ne sommes pas seuls a soudé la population."
 adastra_stellar_dawn:0 "L'aube stellaire"
 adastra_stellar_dawn_desc:0 "Une génération entière a levé les yeux au même instant. Rien ne semble plus impossible."
 mod_adastra_stellar_dawn:0 "L'aube stellaire"
 mod_adastra_stellar_dawn_desc:0 "Une génération entière a levé les yeux au même instant."

 # Situation : La Longue Ascension
 situation_adastra_ascension:0 "Au-delà des étoiles"
 situation_adastra_ascension_type:0 "Au-delà des étoiles"
 situation_adastra_ascension_desc:0 "Notre civilisation gravit une à une les marches qui séparent son berceau des étoiles. Chaque âge apporte ses savoirs, ses outils - et ses épreuves. Au sommet de cette ascension : les équations du voyage supraluminique."
 situation_adastra_ascension_monthly_change_tooltip:0 "La progression augmente chaque mois. Une approche volontariste, une production d'£unity£ unité soutenue et une recherche £physics£ active l'accélèrent."
 adastra_stage_stone_age:0 "$stone_age$"
 adastra_stage_stone_age_desc:0 "$stone_age_desc$"
 adastra_stage_bronze_age:0 "$bronze_age$"
 adastra_stage_iron_age:0 "$iron_age$"
 adastra_stage_late_medieval_age:0 "$late_medieval_age$"
 adastra_stage_renaissance_age:0 "$renaissance_age$"
 adastra_stage_steam_age:0 "$steam_age$"
 adastra_stage_industrial_age:0 "$industrial_age$"
 adastra_stage_machine_age:0 "$machine_age$"
 adastra_stage_atomic_age:0 "$atomic_age$"
 adastra_stage_early_space_age:0 "$early_space_age$"

 # Approches
 approach_adastra_tradition:0 "Continuité prudente"
 approach_adastra_tradition_desc:0 "Laisser la société évoluer à son rythme, en préservant l'ordre établi. La progression est plus lente, mais le peuple est heureux et stable."
 approach_adastra_forced_march:0 "Marche forcée"
 approach_adastra_forced_march_desc:0 "Pousser la civilisation en avant, quel qu'en soit le coût pour le peuple. La progression est nettement plus rapide, au prix du bonheur et de la stabilité."
 approach_adastra_skywatchers:0 "Les yeux vers le ciel"
 approach_adastra_skywatchers_desc:0 "Consacrer nos meilleurs esprits à percer les mystères du monde - et du ciel. La recherche s'accélère et la progression aussi, mais les élites délaissent la cohésion nationale."
 adastra_progress_forced_march:0 "Marche forcée"
 adastra_progress_skywatchers:0 "Les yeux vers le ciel"
 adastra_progress_unity:0 "Société unie"
 adastra_progress_research:0 "Recherche florissante"

 # adastra.1 : choix de l'âge
 adastra.1.name:0 "Ad astra"
 adastra.1.desc:0 "Notre histoire commence ici, sur [Root.Capital.GetName], seul monde que notre espèce ait jamais connu. Les étoiles brillent au-dessus de nos têtes, indifférentes, et nul d'entre nous ne les a jamais touchées.\n\nÀ quel âge de notre longue marche vers le ciel cette chronique s'ouvre-t-elle ?"
 adastra.1.a:0 "$stone_age$"
 adastra.1.a.tooltip:0 "Le défi ultime. §RPénalités maximales§! (£research£ recherche -90%, £pops£ production -70%, £unity£ unité -80%) et population réduite de 75%.\nToute l'histoire de la civilisation reste à écrire."
 adastra.1.b:0 "$bronze_age$"
 adastra.1.b.tooltip:0 "§RPénalités extrêmes§! (£research£ recherche -85%, £pops£ production -65%, £unity£ unité -75%) et population réduite de 75%."
 adastra.1.c:0 "$iron_age$"
 adastra.1.c.tooltip:0 "§RPénalités extrêmes§! (£research£ recherche -80%, £pops£ production -60%, £unity£ unité -70%) et population réduite de 75%."
 adastra.1.d:0 "$late_medieval_age$"
 adastra.1.d.tooltip:0 "§RPénalités très lourdes§! (£research£ recherche -75%, £pops£ production -55%, £unity£ unité -65%) et population réduite de 65%."
 adastra.1.e:0 "$renaissance_age$"
 adastra.1.e.tooltip:0 "§RPénalités très lourdes§! (£research£ recherche -70%, £pops£ production -50%, £unity£ unité -55%) et population réduite de 65%.\nDébloque : la science organisée (laboratoires)."
 adastra.1.f:0 "$steam_age$"
 adastra.1.f.tooltip:0 "§RPénalités lourdes§! (£research£ recherche -60%, £pops£ production -45%, £unity£ unité -45%) et population réduite de 50%.\nDébloque : industrie de base."
 adastra.1.g:0 "$industrial_age$"
 adastra.1.g.tooltip:0 "§RPénalités fortes§! (£research£ recherche -50%, £pops£ production -40%, £unity£ unité -40%) et population réduite de 40%.\nDébloque : extraction mécanisée, agriculture industrielle, armées de masse."
 adastra.1.h:0 "$machine_age$"
 adastra.1.h.tooltip:0 "§RPénalités modérées§! (£research£ recherche -40%, £pops£ production -30%, £unity£ unité -30%) et population réduite de 25%.\nDébloque : centrales électriques, gouvernement planétaire, médecine moderne."
 adastra.1.i:0 "$atomic_age$"
 adastra.1.i.tooltip:0 "§RPénalités limitées§! (£research£ recherche -25%, £pops£ production -20%, £unity£ unité -20%) et population réduite de 15%.\nDébloque : fission nucléaire, missiles, radar, lasers, médias de masse, défenses planétaires."
 adastra.1.j:0 "$early_space_age$"
 adastra.1.j.tooltip:0 "§RPénalités légères§! (£research£ recherche -10%, £pops£ production -10%, £unity£ unité -10%) et population réduite de 5%.\nDébloque : toutes les technologies de départ sauf l'§HHyperpropulsion§!."

 # adastra.4 : bienvenue
 adastra.4.name:0 "Au-delà des étoiles"
 adastra.4.desc:0 "Le ciel de [Root.Capital.GetName] n'a encore jamais été traversé que par les oiseaux et les nuages. Là-haut, le vide s'étend, immense et silencieux - notre orbite elle-même nous est étrangère.\n\nLa situation §YAu-delà des étoiles§! suit désormais notre progression dans le journal de bord. Chaque âge franchi allégera nos fardeaux et apportera les savoirs de son temps, jusqu'au jour où les équations du voyage supraluminique seront à notre portée.\n\nNote : le didacticiel a été désactivé, ses conseils supposant un empire spatial déjà constitué."
 adastra.4.a:0 "Le chemin sera long. Marchons."
 adastra.4.a.tooltip:0 "Suivez votre progression dans le §Yjournal de bord§! (situation §YAu-delà des étoiles§!). Choisissez-y votre §Yapproche§! : continuité, marche forcée ou regard vers le ciel."

 # adastra.6 : situation terminée

 # Émergence
 adastra.20.name:0 "Les étoiles nous appartiennent"
 adastra.20.desc:0 "Le prototype a disparu de nos écrans radar - puis il est réapparu, intact, au-delà de l'orbite de notre lune. Le voyage supraluminique n'est plus un rêve : c'est une donnée d'ingénierie.\n\nNotre chantier orbital réarme déjà nos vaisseaux avec les nouvelles hyperpropulsions. Au-delà de l'héliopause, la galaxie attend. La longue enfance de notre espèce s'achève aujourd'hui."
 adastra.20.a:0 "Le berceau s'ouvre enfin."
 adastra.20.a.tooltip:0 "Vos vaisseaux scientifique et de construction sont §Yréarmés avec l'Hyperpropulsion§! (une base stellaire est fournie si vous n'en avez pas).\nBonus temporaire : §YL'aube stellaire§!. Vous êtes désormais un §Yempire spatial classique§!."
 adastra.22.name:0 "Une civilisation atteint les étoiles"
 adastra.22.desc:0 "Les senseurs confirment une signature hyperspatiale inédite : la civilisation pré-PRL de [From.GetName], jusqu'ici confinée à son monde natal, vient de réussir sa première translation supraluminique.\n\nUne nouvelle voix s'élève dans la galaxie."
 adastra.22.a:0 "Intéressant."
 adastra.25.name:0 "Ils ont atteint les étoiles"
 adastra.25.desc:0 "Rapport prioritaire de nos senseurs : la civilisation pré-PRL de [adastra_country.GetName], dont le monde natal se trouve §Ydans l'espace que nous contrôlons§!, vient de réaliser sa première translation hyperspatiale.\n\nIls réclament l'orbite de leur propre planète - et la base stellaire que nous y maintenons. Notre réponse définira leur place dans la galaxie... et l'image qu'ils garderont de nous pour les siècles à venir."
 adastra.25.a:0 "Leur système leur revient de droit. Cédons-le."
 adastra.25.a.tooltip:0 "La base stellaire du système natal est §Ytransférée§! à [adastra_country.GetName], qui devient un empire §Yindépendant§!."
 adastra.25.b:0 "Ils émergeront sous notre tutelle - pour leur propre bien."
 adastra.25.b.tooltip:0 "La base stellaire du système natal est §Ytransférée§! à [adastra_country.GetName], qui devient votre §Yprotectorat§!."
 adastra.26.name:0 "Libres parmi les étoiles"
 adastra.26.desc:0 "Nous ne sommes pas les premiers. Depuis des années, peut-être des décennies, un empire venu d'ailleurs contrôlait le vide au-dessus de nos têtes.\n\nEt pourtant, au moment où nos vaisseaux ont franchi le seuil de l'hyperespace, leurs émissaires nous ont transmis un message : l'orbite de notre monde nous appartient. Leurs stations se retirent. Nous entrons dans la galaxie libres - et prévenus : nous n'y serons jamais seuls."
 adastra.26.a:0 "Nous n'oublierons pas ce geste."
 adastra.26.a.tooltip:0 "Vous récupérez la §Ybase stellaire§! de votre système natal et vos vaisseaux civils sont §Yréarmés avec l'Hyperpropulsion§!. Bonus temporaire : §YL'aube stellaire§!."
 adastra.27.name:0 "Sous l'aile d'un géant"
 adastra.27.desc:0 "Le ciel n'était pas vide. Il ne l'a jamais été. Au moment même où notre premier vaisseau hyperspatial revenait triomphant, leurs ambassadeurs se tenaient déjà en orbite.\n\nLeur message était courtois, mais sans appel : notre émergence se fera sous leur protection. Leur pavillon flotte à côté du nôtre sur la base stellaire qu'ils nous remettent. Nous voici dans la galaxie - vassaux avant même d'être voyageurs. Cela aussi, un jour, pourra changer."
 adastra.27.a:0 "Un jour, nous volerons de nos propres ailes."
 adastra.27.a.tooltip:0 "Vous devenez le §Yprotectorat§! de l'empire occupant, mais récupérez la §Ybase stellaire§! de votre système natal et vos vaisseaux réarmés en §YHyperpropulsion§!. Bonus temporaire : §YL'aube stellaire§!."

 # Noms de flottes
 adastra_fleet_science:0 "Expédition Scientifique Inaugurale"
 adastra_fleet_constructor:0 "Corps des Bâtisseurs"
 adastra_fleet_navy:0 "Première Flottille"

 # Passages d'âge (les titres réutilisent les noms d'âges vanilla)
 adastra.age.ok:0 "Une nouvelle page de notre histoire."
 adastra.50.desc:0 "Autour des feux, sous les pointes de silex et les peaux tannées, quelque chose d'unique s'éveille : des récits, des rites, des questions. Le premier âge de notre espèce a commencé."
 adastra.51.desc:0 "Le métal en fusion coule dans les moules d'argile. Outils, armes, parures : le bronze change les mains qui le tiennent, et les premières cités lèvent leurs murs vers le ciel."
 adastra.52.desc:0 "Le fer, plus dur et plus abondant, arme les champs comme les armées. Des royaumes naissent et s'effondrent, et l'écriture fixe désormais ce que la mémoire perdait."
 adastra.53.desc:0 "Châteaux, guildes et chartes : le pouvoir se codifie. Sur les routes commerciales, les idées voyagent plus vite que les caravanes qui les portent."
 adastra.54.desc:0 "Les arts renaissent, les navires s'aventurent au-delà des cartes et des esprits audacieux osent mesurer le ciel. Notre monde, soudain, semble plus petit - et l'univers plus grand."
 adastra.55.desc:0 "La vapeur siffle dans les chaudières. Les distances fondent devant le rail, et les manufactures redessinent les villes. La nature n'impose plus son rythme : nous imposons le nôtre."
 adastra.56.desc:0 "Les chaînes de production tournent jour et nuit et l'agriculture nourrit des métropoles entières. Une civilisation industrielle regarde désormais le ciel avec d'autres yeux."
 adastra.57.desc:0 "L'électricité illumine les nuits et les premiers calculateurs bourdonnent dans les caves ministérielles. La science devient une institution - et une promesse."
 adastra.58.desc:0 "Un éclair plus brillant que le soleil a déchiré l'aube au-dessus d'un désert d'essais. Nous avons libéré le feu du cœur de la matière - et découvert que nous pouvions tout détruire. Nos radiotélescopes, eux, commencent à écouter le ciel."
 adastra.59.desc:0 "Le compte à rebours s'est achevé dans un rugissement de tonnerre. Là-haut, une capsule minuscule fait le tour de [Root.Capital.GetName] en quatre-vingt-dix minutes. Plus rien ne nous semble hors de portée - pas même les étoiles."

 # Observation inversée
 adastra.60.name:0 "Lumières dans la nuit"
 adastra.60.desc:0 "Les rapports s'accumulent sur les bureaux de l'état-major : des lumières qui virent à angle droit au-dessus des zones habitées, des échos radar sans transpondeur, un pilote qui jure avoir vu « une structure métallique de la taille d'une ville » entre les nuages.\n\nQuelque chose nous observe. La question n'est plus de savoir si c'est vrai - mais ce que nous disons à la population."
 adastra.60.a:0 "Classifier. Démentir. Surveiller."
 adastra.60.a.tooltip:0 "L'affaire est étouffée. Le pouvoir de l'État s'en trouve renforcé (£influence£ +25 influence)."
 adastra.60.b:0 "La vérité : nous ne sommes pas seuls."
 adastra.60.b.tooltip:0 "La population saura. Ferveur (£unity£ §Yunité +10%§! pendant 5 ans) mais aussi panique (§Rbonheur -10%§! pendant 3 ans)."
 adastra.61.name:0 "Disparitions inexpliquées"
 adastra.61.desc:0 "Des bergers isolés, une équipe de nuit entière, un navire retrouvé vide, toutes voiles dehors. Ceux qui reviennent parlent de lumière blanche, de silhouettes trop grandes et de souvenirs qui s'effritent.\n\nDans les hautes sphères, un mot revient avec insistance : « prélèvements »."
 adastra.61.a:0 "Ouvrir une commission d'enquête."
 adastra.61.b:0 "Il ne s'est rien passé. Rien du tout."
 adastra.61.b.tooltip:0 "Le déni officiel entretient la peur (§Rbonheur -10%§! pendant 3 ans) mais renforce l'appareil d'État (£influence£ +40 influence)."
 adastra.62.name:0 "Un signal venu du vide"
 adastra.62.desc:0 "Au milieu du souffle radio des étoiles, nos instruments ont isolé une structure : des impulsions ordonnées, répétées, mathématiques. Ce n'est pas un phénomène naturel. Quelqu'un, quelque part au-dessus de nos têtes, parle.\n\nNous ne comprenons pas encore ce qu'ils disent. Mais nous savons désormais une chose : le ciel a des habitants."
 adastra.62.a:0 "Toutes nos antennes sur ce signal."
 adastra.62.b:0 "Coupez les enregistrements. Le silence est plus sûr."
 adastra.63.name:0 "Débris tombés du ciel"
 adastra.63.desc:0 "L'objet a traversé l'atmosphère dans une gerbe de plasma avant de s'écraser dans une région reculée. Ce que les équipes de récupération ont trouvé dans le cratère ne ressemble à rien de connu : des alliages qui se ressoudent d'eux-mêmes, des matériaux que nos savants ne savent même pas nommer.\n\nCeux qui nous observent ne sont pas infaillibles. Et leurs miettes valent des décennies de recherche."
 adastra.63.a:0 "Rétro-ingénierie. Moyens illimités, secret absolu."
 adastra.63.a.tooltip:0 "£research£ §YRecherche +10%§! pendant 5 ans."
 adastra.63.b:0 "Détruire ces choses impies."
