 # adastra.1 : choix de l'âge
 adastra.1.name:0 "Ad astra"
 adastra.1.desc:0 "Notre histoire commence ici, sur [Root.Capital.GetName], seul monde que notre espèce ait jamais connu. Les étoiles brillent au-dessus de nos têtes, indifférentes, et nul d'entre nous ne les a jamais touchées.\n\nÀ quel âge de notre longue marche vers le ciel cette chronique s'ouvre-t-elle ?"
 adastra.1.a:0 "$stone_age$"
 adastra.1.a.tooltip:0 "Le défi ultime. §RPénalités maximales§! (£research£ recherche -90%, £pops£ production -70%, £unity£ unité -80%) et population réduite de 75%.\nToute l'histoire de la civilisation reste à écrire."
