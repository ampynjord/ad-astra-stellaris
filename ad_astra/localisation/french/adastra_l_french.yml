 # Origine
 origin_adastra:0 "Ad Astra"
 origin_adastra_desc:0 "Per aspera ad astra - par des sentiers ardus jusqu'aux étoiles. Cette civilisation pré-PRL n'a encore jamais quitté son monde natal. Chaque âge de son histoire reste à écrire, sous un ciel qui n'est peut-être pas aussi vide qu'il en a l'air."
 origin_adastra_effects:0 "- Lance la partie §Rsans vaisseaux ni base stellaire§! : votre civilisation est confinée à son monde natal.\n- Choix de l'§Hâge de départ§! au premier jour, de l'§H$stone_age$§! aux §H$early_space_age$§! ; plus tôt est plus rude. À l'émergence, choisissez un §HHéritage de l'Ascension§! spécialisé.\n- §H250 technologies d'époque§!, vingt-cinq par âge, de la maîtrise du feu au microprocesseur. La recherche suit des prérequis historiques : chaque technologie d'époque achevée fait avancer la situation §HAu-delà des étoiles§!.\n- §ROn ne quitte pas un âge tant qu'il reste quelque chose à y inventer.§!\n- §HUne ressource n'existe pas avant l'invention qui la produit§! : ni énergie avant l'électricité, ni alliages avant le bronze. Et ce qu'on ne produit pas, on ne le paie pas.\n- À l'§H$early_space_age$§!, les technologies du jeu de base deviennent des §Htechnologies fondatrices à chercher§! : corvettes, bases stellaires, propulseurs. Quatre §Hprogrammes spatiaux§! payés en £influence£ influence et £minerals£ minéraux mènent à la recherche £physics£ §HHyperpropulsion§!.\n- §HLes technologies du jeu de base attendent l'émergence.§! Seules celles qu'un empire normal possède §Hdès la première seconde§! peuvent être cherchées pendant le confinement — plus douze exceptions qui débloquent une ressource ou un bâtiment dont un âge a besoin. Tout le reste de l'arbre s'ouvre à la percée.\n- Les §Héthiques, civismes et traits d'espèce§! ordinaires restent disponibles. Une infrastructure anachronique est reportée à son âge ; à l'émergence, une §Hréforme gouvernementale gratuite§! vous permet de redéfinir votre projet civique.\n- Vivez l'observation du point de vue des observés : ovnis, disparitions, signaux venus du vide...\n\n§RPénalités :§!\n- £research£ Recherche, £pops£ production des emplois et £unity£ unité réduites selon l'âge courant.\n- Population de départ réduite selon l'âge choisi.\n- §HTraditions verrouillées§! jusqu'à l'émergence.\n- Si un empire s'installe dans votre système natal avant votre percée, votre émergence se négociera avec lui..."

