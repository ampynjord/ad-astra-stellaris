 adastra_stage_first_launch:0 "Premier lancement"
 adastra_stage_first_launch_desc:0 "Les recherches de l'Âge spatial sont achevées. Depuis la capitale, accomplissez le §YPremier lancement suborbital§!, le §YPremier satellite§!, le §YVol habité§!, puis la §YSonde profonde§! pour ouvrir le Programme d'exploration spatiale. Chaque réussite débloque le jalon suivant."
 adastra.79.name:0 "Le compte a rebours commence"
 adastra.79.desc:0 "Les instruments sont prêts, la fusée est ravitaillée et les préparatifs sont achevés. Les prochaines étapes ne se recherchent pas : elles se réalisent.\n\nSélectionnez [Root.Capital.GetName] et accomplissez le §YPremier lancement suborbital§!, le §YPremier satellite§!, le §YVol habité§!, puis la §YSonde profonde§!. Chaque réussite débloque la décision suivante."
