 adastra_stage_program_explore:0 "Programme d'exploration spatiale"
 adastra_stage_program_explore_desc:0 "Promulguez la décision §YProgramme d'exploration spatiale§! sur votre capitale — elle exige la technologie §YExploration spatiale§!. Le vaisseau livré §Yprospecte tout seul§! : posez-le dans un système et il en révèle un astre par mois, §Ymême si un empire l'a revendiqué§!. L'étoile est déjà connue."
 adastra_stage_program_orbital:0 "Programme de base stellaire"
 adastra_stage_program_orbital_desc:0 "Promulguez la décision §YProgramme de base stellaire§!, puis exploitez le système : au moins §Y1 station§! minière ou de recherche. Le chantier orbital ouvre la recherche des technologies de §Ybases stellaires§!. Facultatif : le §YProgramme de flotte orbitale§!, qui livre des corvettes sans chantier et ouvre les technologies de §Yvaisseaux§!."
 adastra_stage_program_hyperdrive:0 "Programme hyperspatial"
 adastra_stage_program_hyperdrive_desc:0 "Promulguez la décision §YProgramme hyperspatial§! — elle exige que les §Yseize technologies fondatrices§! du jeu de base soient toutes recherchées. Recherchez ensuite l'£physics£ §YHyperpropulsion§! pour achever l'Ascension."
 decision_adastra_explore:0 "Programme d'exploration spatiale"
 decision_adastra_explore_desc:0 "Assembler notre premier véritable vaisseau spatial : un bâtiment scientifique sous-luminique, incapable de quitter le système, mais capable d'en percer tous les secrets."
 decision_adastra_explore_tooltip:0 "Livre un §Yvaisseau scientifique§! (sous-luminique - il ne peut pas quitter le système).\n§HÉtape suivante :§! prospectez §Ychaque astre du système§! : en §Yvue système§!, clic droit sur une planète, lune ou astéroïde → §YProspecter§!. (L'ordre de prospection depuis la carte galactique ne fonctionne pas pour un vaisseau sous-luminique ; l'étoile est déjà connue de vos astronomes.)\n\n§YRelançable§! : si vous perdez votre vaisseau scientifique, reprenez cette décision pour en armer un autre."
 adastra.89.name:0 "Le ciel est déjà pris"
 adastra.89.desc:0 "Nos ingénieurs sont montés avec leurs plans, leurs poutrelles et leurs bonbonnes d'air. Ils sont redescendus sans avoir rien posé.\n\nUne station qui n'est pas la nôtre occupe déjà notre orbite. Elle était là avant que notre première section quitte le sol, et personne, en bas, ne se souvient de l'avoir vue arriver.\n\nNous ne la démonterons pas. Nous n'en avons ni les moyens ni le droit — et à supposer que nous les ayons, ce serait le premier geste d'une guerre que nous ne pouvons pas mener.\n\n§YLes plans du chantier restent acquis§!, et le §YProgramme de base stellaire§! demeure disponible. Le jour où cette orbite se libérera, nos poutrelles seront prêtes."
 adastra.89.a:0 "Alors nous attendrons qu'ils partent."
 adastra.89.a.tooltip:0 "Le §YProgramme de base stellaire§! reste proposable tant que l'orbite est occupée."
 decision_adastra_starbase:0 "Programme de base stellaire"
 decision_adastra_colony:0 "Programme de colonisation"
 decision_adastra_colony_desc:0 "Il y a, quelque part au-dessus de nos têtes, un endroit où l'on pourrait vivre. Une lune, une seconde planète, ou seulement une coque que nous aurons bâtie nous-mêmes. Reste à y envoyer des gens qui n'en reviendront pas."
 decision_adastra_colony_tooltip:0 "Livre un §Yvaisseau de colonisation « Arche »§! peuplé de notre espèce principale, et son plan si vous ne l'aviez pas.\n§HÉtape suivante :§! sélectionnez l'Arche, puis §YColoniser§! sur une cible §Ydu système§! — une seconde planète habitable, ou un §Ycomplexe d'habitat§! que vous aurez bâti en orbite.\n\n§YRelançable§! : autant de cibles, autant d'Arches."
 decision_adastra_starbase_desc:0 "Assembler en orbite le premier chantier spatial de notre histoire, et le vaisseau de construction qui bâtira nos avant-postes dans le système."
 decision_adastra_starbase_fail:0 "Un autre empire contrôle l'orbite de votre monde natal."
 decision_adastra_starbase_tooltip:0 "Construit une §Ybase stellaire§! (chantier spatial, panneaux solaires, quartiers de l'équipage) et livre un §Yvaisseau de construction§!.\n§HÉtape suivante :§! bâtissez au moins §Y1 station§! minière ou de recherche dans le système.\n\nLivre aussi les §Yplans§! de toute la flotte sous-luminique — scientifique, constructeur, colonisateur, corvettes. À partir d'ici, un vaisseau perdu se remplace.\n§HDébloque :§! le §YProgramme de flotte orbitale§! et le §YProgramme de colonisation§!, tous deux relançables."
 decision_adastra_hyperdrive:0 "Programme hyperspatial"
 decision_adastra_hyperdrive_desc:0 "Mobiliser toutes nos ressources scientifiques et industrielles vers un seul but : percer le secret du voyage plus rapide que la lumière."
 decision_adastra_hyperdrive_tooltip:0 "Rend la technologie £physics£ §YHyperpropulsion§! disponible à la recherche.\n§HÉtape finale :§! sa découverte achèvera l'Ascension - vous serez alors un empire spatial de plein droit."
 adastra.80.name:0 "Le programme d'exploration spatiale"
 adastra.80.desc:0 "Les âges de notre monde sont derrière nous. Devant nous : le vide, et tout ce qu'il cache.\n\nNos ingénieurs sont prêts à assembler notre premier véritable vaisseau spatial - sans hyperpropulsion, prisonnier du système, mais libre d'en percer tous les secrets. Le gouvernement n'attend plus que l'ordre de lancement."
 adastra.80.a:0 "Que l'exploration commence."
 adastra.80.a.tooltip:0 "La décision §YProgramme d'exploration spatiale§! est disponible sur votre capitale (£energy£ 500 énergie, £minerals£ 300 minerais, £alloys£ 150 alliages - 6 mois).\nPuis prospectez le système avec le vaisseau livré : en §Yvue système§!, §Yclic droit§! sur chaque astre → §YProspecter§! (l'ordre global de la carte galactique ne fonctionne pas en sous-luminique)."
 adastra.81.name:0 "Le programme de base stellaire"
 adastra.81.desc:0 "Chaque planète, chaque lune, chaque astéroïde de notre système porte désormais un nom et un dossier d'étude. Notre vaisseau scientifique a achevé la grande cartographie.\n\nL'étape suivante attend en orbite : un chantier spatial permanent, et les vaisseaux de construction qui transformeront ces cailloux en richesses."
 adastra.81.a:0 "Bâtissons notre premier port vers les étoiles."
 adastra.81.a.tooltip:0 "La décision §YProgramme de base stellaire§! est disponible sur votre capitale (£energy£ 1000 énergie, £minerals£ 800 minerais, £alloys£ 500 alliages - 1 an).\nPuis bâtissez au moins §Y1 station§! minière ou de recherche dans le système."
 adastra.82.name:0 "Le programme hyperspatial"
 adastra.82.desc:0 "Des stations bourdonnent autour de nos mondes, du minerai et des données affluent vers la surface. Notre système travaille pour nous.\n\nIl ne reste qu'un seuil à franchir - le dernier, le plus grand. Nos théoriciens jurent que l'hyperespace n'est pas une fable. Il est temps de leur donner les moyens de le prouver."
 adastra.82.a:0 "Vers l'infini."
 adastra.82.a.tooltip:0 "La décision §YProgramme hyperspatial§! est disponible sur votre capitale (£energy£ 1500 énergie, £alloys£ 300 alliages, £unity£ 500 unité - 1 an).\nPuis recherchez l'§YHyperpropulsion§! : sa découverte achèvera l'Ascension."
 adastra_focus_130.name:0 "Premier envol"
 adastra_focus_130.desc:0 "Lancer notre premier vaisseau scientifique."
 adastra_focus_130.hint:0 "Promulguez la décision §YProgramme d'exploration spatiale§! sur votre capitale."
 adastra_focus_130.lore:0 "Il ne quittera jamais le système. Il n'en a pas besoin : c'est un début."
 adastra_focus_130.fail:0 "Lancer le vaisseau scientifique"
 adastra_focus_130.success:0 "Notre premier vaisseau vole"
 adastra_focus_135.name:0 "La grande cartographie"
 adastra_focus_135.desc:0 "Prospecter l'intégralité du système natal."
 adastra_focus_135.hint:0 "En vue système, clic droit sur chaque astre → §YProspecter§! avec votre vaisseau scientifique (l'étoile est déjà connue)."
 adastra_focus_135.lore:0 "Chaque caillou du ciel a désormais un nom."
 adastra_focus_135.fail:0 "Prospecter tout le système natal"
 adastra_focus_135.success:0 "Le système natal est cartographié"
 adastra_focus_140.name:0 "L'orbite industrieuse"
 adastra_focus_140.desc:0 "Bâtir la base stellaire et exploiter le système."
 adastra_focus_140.hint:0 "Promulguez la décision §YProgramme de base stellaire§! puis bâtissez au moins 1 station minière ou de recherche."
 adastra_focus_140.lore:0 "Le vide n'est pas vide : il est plein de richesses qui attendent."
 adastra_focus_140.fail:0 "Bâtir la base et exploiter le système"
 adastra_focus_140.success:0 "Notre système travaille pour nous"
 adastra_focus_100.name:0 "Le siècle des machines à vapeur"
 adastra_focus_100.desc:0 "Faire entrer notre civilisation dans l'$steam_age$."
 adastra_focus_100.hint:0 "Progressez dans la situation §YAu-delà des étoiles§! jusqu'à l'$steam_age$."
 adastra_focus_100.lore:0 "La nature n'imposera plus son rythme : nous imposerons le nôtre."
 adastra_focus_100.fail:0 "Atteindre l'$steam_age$"
 adastra_focus_100.success:0 "L'$steam_age$ est atteint"
 adastra_focus_105.name:0 "L'électricité et l'acier"
 adastra_focus_105.desc:0 "Faire entrer notre civilisation dans l'$machine_age$."
 adastra_focus_105.hint:0 "Progressez dans la situation §YAu-delà des étoiles§! jusqu'à l'$machine_age$."
 adastra_focus_105.lore:0 "Dans les caves ministérielles, les premiers calculateurs bourdonnent déjà."
 adastra_focus_105.fail:0 "Atteindre l'$machine_age$"
 adastra_focus_105.success:0 "L'$machine_age$ est atteint"
 adastra_focus_110.name:0 "Le feu du cœur de la matière"
 adastra_focus_110.desc:0 "Faire entrer notre civilisation dans l'$atomic_age$."
 adastra_focus_110.hint:0 "Progressez dans la situation §YAu-delà des étoiles§! jusqu'à l'$atomic_age$."
 adastra_focus_110.lore:0 "Un éclair plus brillant que le soleil, et le monde ne sera plus jamais le même."
 adastra_focus_110.fail:0 "Atteindre l'$atomic_age$"
 adastra_focus_110.success:0 "L'$atomic_age$ est atteint"
 adastra_focus_115.name:0 "Sortir du berceau"
 adastra_focus_115.desc:0 "Faire entrer notre civilisation dans les $early_space_age$."
 adastra_focus_115.hint:0 "Progressez dans la situation §YAu-delà des étoiles§! jusqu'aux $early_space_age$."
 adastra_focus_115.lore:0 "Une capsule minuscule, quatre-vingt-dix minutes, et le monde entier dans un hublot."
 adastra_focus_115.fail:0 "Atteindre les $early_space_age$"
 adastra_focus_115.success:0 "Les $early_space_age$ sont atteints"
 adastra_focus_120.name:0 "Les équations de l'hyperespace"
 adastra_focus_120.desc:0 "Rechercher la technologie §YHyperpropulsion§!."
 adastra_focus_120.hint:0 "Achevez la situation §YAu-delà des étoiles§! puis recherchez l'§YHyperpropulsion§! en physique."
 adastra_focus_120.lore:0 "Sur un tableau noir couvert de craie, une poignée de symboles fait basculer l'histoire."
 adastra_focus_120.fail:0 "Rechercher l'§YHyperpropulsion§!"
 adastra_focus_120.success:0 "L'§YHyperpropulsion§! est maîtrisée"
 adastra_focus_125.name:0 "Ad astra"
 adastra_focus_125.desc:0 "Lancer le programme spatial et émerger dans la galaxie."
 adastra_focus_125.hint:0 "Promulguez la décision §YLancement du programme spatial§! sur votre capitale."
 adastra_focus_125.lore:0 "Per aspera ad astra. La longue enfance de notre espèce s'achève."
 adastra_focus_125.fail:0 "Émerger dans la galaxie"
 adastra_focus_125.success:0 "Notre civilisation a rejoint les étoiles"
 adastra.16.name:0 "Les équations sont à nous"
 adastra.16.desc:0 "Des années de calcul, des fortunes englouties, des carrières entières consumées - et ce matin, sur un tableau couvert de craie, la dernière inconnue est tombée.\n\nL'hyperespace n'est plus une conjecture. Nos laboratoires peuvent désormais transformer la théorie en machine."
 adastra.16.a:0 "La dernière marche."
 adastra.16.a.tooltip:0 "La technologie £physics£ §YHyperpropulsion§! est disponible dans la recherche de physique. Sa découverte §Yachève l'Ascension§! : vous deviendrez un empire spatial classique, avec vos vaisseaux, votre base et votre système."
 adastra_approach_tradition_extra:0 "§RProgression mensuelle : -0.01§!\n"
 adastra_approach_forced_march_extra:0 "§GProgression mensuelle : +0.025§!\n"
 adastra_approach_skywatchers_extra:0 "§GProgression mensuelle : +0.01§!\n"
 adastra_progress_tradition:0 "Continuité prudente"
 adastra_heritage_1:0 "Héritage de l'Ascension"
 adastra_heritage_1_desc:0 "Notre civilisation a gravi seule les dernières marches vers les étoiles. Ce souvenir l'accompagnera toujours."
 mod_adastra_heritage_1:0 "Héritage de l'Ascension"
 mod_adastra_heritage_1_desc:0 "Notre civilisation a gravi seule les dernières marches vers les étoiles."
 adastra_heritage_2:0 "Héritage de l'Ascension"
 adastra_heritage_2_desc:0 "Des fumées de l'industrie aux feux de l'orbite : notre peuple a forgé sa route. Cette mémoire le rend inébranlable."
 mod_adastra_heritage_2:0 "Héritage de l'Ascension"
 mod_adastra_heritage_2_desc:0 "Des fumées de l'industrie aux feux de l'orbite : notre peuple a forgé sa route."
 adastra_heritage_3:0 "Héritage de l'Ascension"
 adastra_heritage_3_desc:0 "Des parchemins aux fusées, notre peuple a traversé un demi-millénaire d'épreuves. Sa patience est devenue une force."
 mod_adastra_heritage_3:0 "Héritage de l'Ascension"
 mod_adastra_heritage_3_desc:0 "Des parchemins aux fusées, notre peuple a traversé un demi-millénaire d'épreuves."
 adastra_heritage_4:0 "Héritage de l'Ascension"
 adastra_heritage_4_desc:0 "Du silex à l'hyperespace : aucune civilisation de la galaxie n'a parcouru un si long chemin par ses propres forces. Rien ne pourra plus jamais nous arrêter."
 mod_adastra_heritage_4:0 "Héritage de l'Ascension"
 mod_adastra_heritage_4_desc:0 "Du silex à l'hyperespace : aucune civilisation n'a parcouru un si long chemin seule."
 adastra_dormant_galaxy:0 "Galaxie assoupie"
 adastra_dormant_galaxy_desc:0 "Le temps galactique semble suspendu : les grandes puissances stellaires n'avancent qu'à peine, comme si l'histoire attendait quelqu'un."
 mod_adastra_dormant_galaxy:0 "Galaxie assoupie"
 mod_adastra_dormant_galaxy_desc:0 "Le temps galactique semble suspendu, comme si l'histoire attendait quelqu'un."
 adastra.7.name:0 "Le rythme de la galaxie"
 adastra.7.desc:0 "Une dernière question se pose avant que notre chronique ne commence : pendant que notre civilisation gravit ses âges, que fait le reste de la galaxie ?\n\nLes autres empires stellaires peuvent vivre leur histoire à leur rythme normal - explorer, s'étendre, guerroyer - ou bien la galaxie peut retenir son souffle jusqu'à notre émergence, pour que la course commence à armes égales."
 adastra.7.a:0 "La galaxie vit sa vie. Nous arriverons en retard - et alors ?"
 adastra.7.a.tooltip:0 "Aucun changement : les empires IA jouent normalement pendant votre ascension. §RIls auront une avance considérable.§!"
 adastra.7.b:0 "Que la galaxie retienne son souffle jusqu'à notre émergence."
 adastra.7.b.tooltip:0 "Tous les empires IA sont §Ydésactivés§! : plus d'expansion, de recherche, de diplomatie ni de guerres. Ils se réveilleront à votre §Ypercée supraluminique§!."
 # 1.1 - Vitesse d'ascension (adastra.5)
 adastra.5.name:0 "Le rythme de l'ascension"
 adastra.5.desc:0 "Les âges de notre monde se succéderont-ils comme un torrent ou comme un fleuve tranquille ?\n\nCe choix règle la vitesse à laquelle notre civilisation franchira ses âges. Il ne change rien d'autre : pénalités, récompenses et programme spatial restent identiques."
 adastra.5.a:0 "Un rythme équilibré. (recommandé)"
 adastra.5.a.tooltip:0 "Vitesse d'ascension §Ynormale§! - le rythme d'origine du mod."
 adastra.5.b:0 "L'histoire s'accélère."
 adastra.5.b.tooltip:0 "Ascension §Yrapide§! : environ §G+50 %§! de progression mensuelle."
 adastra.5.c:0 "Prenons le temps de vivre chaque âge."
 adastra.5.c.tooltip:0 "Ascension §Ylente§! : environ §R-50 %§! de progression mensuelle."
 adastra.5.d:0 "Que chaque âge soit une époque entière."
 adastra.5.d.tooltip:0 "Ascension §Ytrès lente§! : environ §R-80 %§! de progression mensuelle. Pour les parties au très long cours."
 adastra_progress_speed_fast:0 "Rythme : histoire accélérée"
 adastra_progress_speed_slow:0 "Rythme : ascension lente"
 adastra_progress_speed_veryslow:0 "Rythme : ascension très lente"
 # 1.1 - Campagnes d'exploitation
 decision_adastra_campaign_harvest:0 "Grandes récoltes"
 decision_adastra_campaign_harvest_desc:0 "Mobiliser les campagnes pour tirer de la terre tout ce qu'elle peut donner. Les greniers se rempliront - mais on ne peut pas être aux champs et à la mine le même jour. §YUne seule campagne à la fois.§!"
 decision_adastra_campaign_mining_desc:0 "Ouvrir galeries et carrières à marche forcée. La pierre et le métal afflueront - et les champs resteront à moitié travaillés. §YUne seule campagne à la fois.§!"
 decision_adastra_campaign_mining:0 "Grande corvée minière"
 decision_adastra_campaign_fuel:0 "Bois, charbon et tourbe"
 decision_adastra_campaign_fuel_desc:0 "Brûler ce que la terre offre pour nourrir machines et foyers. L'£energy£ énergie coulera - au prix des forêts, des poumons, et des bras retirés au reste. §YUne seule campagne à la fois.§!"
 decision_adastra_campaign_industry:0 "Cadences forcées"
 decision_adastra_campaign_industry_desc:0 "Allonger les journées, accélérer les chaînes. Les £consumer_goods£ biens sortiront des manufactures - pendant que le grain manque et que la colère monte. §YUne seule campagne à la fois.§!"
 adastra_campaign_harvest:0 "Grandes récoltes"
 adastra_campaign_harvest_desc:0 "£food£ Nourriture +40 % ; £minerals£ minerais -25 %, £consumer_goods£ biens -25 %, croissance -10 %. Des bras aux champs, ce sont des bras qui manquent ailleurs."
 adastra_campaign_mining:0 "Grande corvée minière"
 adastra_campaign_mining_desc:0 "£minerals£ Minerais +40 % ; £food£ nourriture -25 %, £energy£ énergie -15 %, bonheur -10 %, stabilité -5."
 adastra_campaign_fuel:0 "Bois, charbon et tourbe"
 adastra_campaign_fuel_desc:0 "£energy£ Énergie +40 % ; £minerals£ minerais -25 %, £food£ nourriture -15 %, bonheur -10 %."
 adastra_campaign_industry:0 "Cadences forcées"
 adastra_campaign_industry_desc:0 "£consumer_goods£ Biens de consommation +40 % ; £food£ nourriture -25 %, £energy£ énergie -15 %, bonheur -10 %, stabilité -5."
 # 1.1 - Badges de rythme
 adastra_pace_fast:0 "Rythme : histoire accélérée"
 adastra_pace_fast_desc:0 "L'ascension progresse environ §G50 %§! plus vite. Choisi au premier jour (sans autre effet)."
 adastra_pace_slow:0 "Rythme : ascension lente"
 adastra_pace_slow_desc:0 "L'ascension progresse environ §R50 %§! plus lentement. Choisi au premier jour (sans autre effet)."
 adastra_pace_veryslow:0 "Rythme : ascension très lente"
 adastra_pace_veryslow_desc:0 "L'ascension progresse environ §R80 %§! plus lentement. Choisi au premier jour (sans autre effet)."
 # Origine
 origin_adastra:0 "Ad Astra"
 origin_adastra_desc:0 "Per aspera ad astra - par des sentiers ardus jusqu'aux étoiles. Cette civilisation pré-PRL n'a encore jamais quitté son monde natal. Chaque âge de son histoire reste à écrire, sous un ciel qui n'est peut-être pas aussi vide qu'il en a l'air."
 origin_adastra_effects:0 "- Lance la partie §Rsans vaisseaux ni base stellaire§! : votre civilisation est confinée à son monde natal.\n- Choix de l'§Hâge de départ§! au premier jour, de l'§H$stone_age$§! aux §H$early_space_age$§! ; plus tôt, plus dur, et plus fort sera l'§HHéritage de l'Ascension§! final.\n- §H250 technologies d'époque§!, vingt-cinq par âge, de la maîtrise du feu au microprocesseur. Elles s'ouvrent §Hpar vagues§! au fil de l'âge, dans l'ordre où l'histoire les a vues naître.\n- §ROn ne quitte pas un âge tant qu'il reste quelque chose à y inventer.§! La situation §HAu-delà des étoiles§! nomme, une par une, les technologies qui vous manquent.\n- §HUne ressource n'existe pas avant l'invention qui la produit§! : ni énergie avant l'électricité, ni alliages avant le bronze. Et ce qu'on ne produit pas, on ne le paie pas.\n- À l'§H$early_space_age$§!, les technologies du jeu de base deviennent des §Htechnologies fondatrices à chercher§! : corvettes, bases stellaires, propulseurs. Quatre §Hprogrammes spatiaux§! payés en £influence£ influence et £minerals£ minéraux mènent à la recherche £physics£ §HHyperpropulsion§!.\n- §HLes technologies du jeu de base attendent l'émergence.§! Seules celles qu'un empire normal possède §Hdès la première seconde§! peuvent être cherchées pendant le confinement — plus douze exceptions qui débloquent une ressource ou un bâtiment dont un âge a besoin. Tout le reste de l'arbre s'ouvre à la percée.\n- Vivez l'observation du point de vue des observés : ovnis, disparitions, signaux venus du vide...\n\n§RPénalités :§!\n- £research£ Recherche, £pops£ production des emplois et £unity£ unité réduites selon l'âge courant.\n- Population de départ réduite selon l'âge choisi.\n- §HTraditions verrouillées§! jusqu'à l'émergence.\n- Si un empire s'installe dans votre système natal avant votre percée, votre émergence se négociera avec lui..."

 # Modificateurs
 adastra_reverse_engineering:0 "Rétro-ingénierie d'artefacts"
