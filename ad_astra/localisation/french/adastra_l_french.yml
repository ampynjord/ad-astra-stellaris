 # 1.1 - Campagnes d'exploitation
 decision_adastra_campaign_harvest:0 "Grandes récoltes"
 decision_adastra_campaign_harvest_desc:0 "Mobiliser les campagnes pour tirer de la terre tout ce qu'elle peut donner. Les greniers se rempliront - mais on ne peut pas être aux champs et à la mine le même jour. §YUne seule campagne à la fois.§!"
 decision_adastra_campaign_mining_desc:0 "Ouvrir galeries et carrières à marche forcée. La pierre et le métal afflueront - et les champs resteront à moitié travaillés. §YUne seule campagne à la fois.§!"
 decision_adastra_campaign_mining:0 "Grande corvée minière"
 decision_adastra_campaign_fuel:0 "Bois, charbon et tourbe"
 decision_adastra_campaign_fuel_desc:0 "Brûler ce que la terre offre pour nourrir machines et foyers. L'£energy£ énergie coulera - au prix des forêts, des poumons, et des bras retirés au reste. §YUne seule campagne à la fois.§!"
 decision_adastra_campaign_industry:0 "Cadences forcées"
 decision_adastra_campaign_industry_desc:0 "Allonger les journées, accélérer les chaînes. Les £consumer_goods£ biens sortiront des manufactures - pendant que le grain manque et que la colère monte. §YUne seule campagne à la fois.§!"
