 # Approches
 approach_adastra_tradition:0 "Continuité prudente"
 approach_adastra_tradition_desc:0 "Laisser la société évoluer à son rythme, en préservant l'ordre établi. La progression est plus lente, mais le peuple est heureux et stable."
 approach_adastra_forced_march:0 "Marche forcée"
 approach_adastra_forced_march_desc:0 "Pousser la civilisation en avant, quel qu'en soit le coût pour le peuple. La progression est nettement plus rapide, au prix du bonheur et de la stabilité."
 approach_adastra_skywatchers:0 "Les yeux vers le ciel"
 approach_adastra_skywatchers_desc:0 "Consacrer nos meilleurs esprits à percer les mystères du monde - et du ciel. La recherche s'accélère et la progression aussi, mais les élites délaissent la cohésion nationale."
