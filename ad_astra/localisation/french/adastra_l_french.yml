 # Situation : La Longue Ascension
 situation_adastra_ascension:0 "Au-delà des étoiles"
 situation_adastra_ascension_type:0 "Au-delà des étoiles"
 situation_adastra_ascension_desc:0 "Notre civilisation gravit une à une les marches qui séparent son berceau des étoiles. Chaque âge apporte ses savoirs, ses outils - et ses épreuves. Au sommet de cette ascension : les équations du voyage supraluminique.\n\n§YLes âges historiques§! avancent par la recherche : chacune de leurs vingt-cinq technologies d'époque remplit un point. §YLe programme spatial§! avance par ses fondations techniques et une action concrète.\n\n§HParcours spatial§!\n§Y225-250§! : l'âge spatial avance avec ses §Yinstruments§! : les premières découvertes viennent des laboratoires, la vague suivante exige un §Yradiotélescope§!, les dernières un §Ytélescope spatial§!.\n§Y250§! : accomplir le Premier lancement suborbital, le Premier satellite, le Vol habité, le Premier atterrissage lunaire §Y(seulement si notre système possède une lune)§!, puis la Sonde profonde.\n§Y275§! : rechercher Construction et Colonisation, lancer l'Exploration, puis prospecter le système natal.\n§Y300§! : rechercher les fondations de construction et commander un Bâtisseur.\n§Y325§! : rechercher la Construction de base stellaire et bâtir l'avant-poste natal.\n§Y350§! : rechercher les fondations orbitales, bâtir une station minière ou de recherche, améliorer la base en §Yport stellaire§! (deux modules, un bâtiment) et dresser une première §Yplateforme de défense§!.\n§Y375§! : lancer le Programme hyperspatial et rechercher l'Hyperpropulsion.\n\n§HL'ascension a trois actes.§!\n§YLe sol§! (Pierre à Fer) : survivre, s'établir, bâtir.\n§YLe monde§! (Médiéval à Industriel) : un monde qui grandit, et une production qui coûte.\n§YLe ciel§! (Machine à l'émergence) : regarder, lancer, atteindre."
 situation_adastra_ascension_monthly_change_tooltip:0 "La progression n'a aucun gain mensuel. Les technologies historiques ajoutent un point chacune. Dans le programme spatial, fondations et action indiquée se partagent chaque étape de vingt-cinq points ; l'action finale reste obligatoire."
