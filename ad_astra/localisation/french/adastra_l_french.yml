l_french:
 decision_adastra_navy:0 "Programme de flotte orbitale"
 decision_adastra_navy_desc:0 "Le vide au-dessus de nos têtes n'est peut-être pas aussi vide qu'il en a l'air. Une flottille de corvettes, même confinées au système, garantirait que personne ne nous prenne notre orbite sans le payer."
 decision_adastra_navy_tooltip:0 "Livre §Ytrois corvettes§! sous-luminiques (améliorables après la percée).\n§HFacultatif et répétable§! - disponible jusqu'à la découverte de l'§YHyperpropulsion§! : après, il faudra les construire vous-même.\n§HLes empires à bio-vaisseaux§! paient en §Ynourriture§! au lieu de §Yminerais§! : on ne taille pas un vaisseau vivant dans la roche."
 adastra_focus_145.name:0 "Le bouclier du berceau"
 adastra_focus_145.desc:0 "Lever notre première flottille militaire avant la percée."
 adastra_focus_145.hint:0 "Promulguez la décision facultative §YProgramme de flotte orbitale§! (après la base stellaire, avant l'Hyperpropulsion)."
 adastra_focus_145.lore:0 "Personne ne nous prendra notre orbite sans le payer."
 adastra_focus_145.fail:0 "Lever une flottille militaire"
 adastra_focus_145.success:0 "Le berceau a son bouclier"
 adastra_finisher_title:0 "À l'issue : l'émergence"
 adastra_finisher_desc:0 "La découverte de l'§YHyperpropulsion§! achève l'Ascension : votre civilisation émerge dans la galaxie en empire spatial classique - vaisseaux réarmés en Hyperpropulsion et §YHéritage de l'Ascension§! en récompense permanente."
