 adastra_progress_verrou_steam:0 "§RVerrou d'âge§! : il reste des technologies de l'Âge de la vapeur à découvrir"
 adastra_progress_verrou_industrial:0 "§RVerrou d'âge§! : il reste des technologies de l'Âge industriel à découvrir"
 adastra_progress_verrou_machine:0 "§RVerrou d'âge§! : il reste des technologies de l'Âge de la machine à découvrir"
