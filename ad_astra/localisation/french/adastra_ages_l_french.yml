l_french:
 # Ad Astra 1.2 - Les Ages. GENERE par tools/gen_age_techs.py.
 # --- stone ---
 tech_adastra_fire:0 "Maîtrise du feu"
 tech_adastra_fire_desc:0 "Nous ne l'avons pas inventé : nous avons appris à ne pas le laisser mourir. Le foyer devient le premier lieu où la nuit ne gagne plus."
 tech_adastra_stone_tools:0 "Outils de pierre taillée"
 tech_adastra_stone_tools_desc:0 "Frapper une pierre contre une autre selon le bon angle. Tout le reste - la roue, la fonderie, la fusée - descend de ce geste."
 tech_adastra_hunting:0 "Chasse coordonnée"
 tech_adastra_hunting_desc:0 "Une bête plus grande que nous ne tombe pas devant un individu. Elle tombe devant un plan."
 tech_adastra_cave_art:0 "Peintures rupestres"
 tech_adastra_cave_art_desc:0 "Les premières mains posées sur la paroi disent une chose simple et vertigineuse : nous étions là, et nous voulions qu'on le sache.\n\n§YDébloque le bâtiment : Monument des ancêtres.§!"
 tech_adastra_language:0 "Langage articulé"
 tech_adastra_language_desc:0 "Le savoir cesse de mourir avec celui qui le porte. C'est la seule invention qui rend toutes les autres possibles.\n\n§YPermet d'améliorer le siège du pouvoir en Maison commune.§!"
 tech_adastra_seasons:0 "Lecture des saisons"
 tech_adastra_seasons_desc:0 "Le ciel revient toujours au même endroit. Celui qui remarque cela sait quand les troupeaux passent, et devient indispensable."
 tech_adastra_pigments:0 "Terres et pigments"
 tech_adastra_pigments_desc:0 "Broyer l'ocre, la mélanger à la graisse, obtenir une couleur qui tient. C'est de la chimie, même si personne n'a encore de mot pour ça."
 tech_adastra_cordage:0 "Corde et vannerie"
 tech_adastra_cordage_desc:0 "Tordre des fibres jusqu'à ce qu'elles tiennent mieux ensemble que séparées. Le nœud est la première machine."
 tech_adastra_shelter:0 "Abri construit"
 tech_adastra_shelter_desc:0 "On cesse de chercher une grotte : on en fabrique une. La différence paraît mince, elle ne l'est pas."
 tech_adastra_burial:0 "Sépulture"
 tech_adastra_burial_desc:0 "Déposer un mort avec des fleurs et des outils, c'est affirmer que quelque chose continue. Aucun animal ne fait ce pari."
 # --- bronze ---
 tech_adastra_agriculture:0 "Agriculture"
 tech_adastra_agriculture_desc:0 "Cesser de suivre la nourriture, et la faire venir à soi. Le prix à payer : on ne partira plus.\n\n§YDébloque le bâtiment : Grenier.§!"
 tech_adastra_pottery:0 "Poterie"
 tech_adastra_pottery_desc:0 "Un récipient, c'est du temps mis en réserve. La récolte de cette année peut désormais nourrir l'année suivante."
 tech_adastra_bronze:0 "Métallurgie du bronze"
 tech_adastra_bronze_desc:0 "Deux minerais médiocres, fondus ensemble, donnent un métal que ni l'un ni l'autre ne savait être. La métallurgie commence par cette surprise.\n\n§YDébloque le bâtiment : Fonderie. Débloque la ressource Alliages : sans métallurgie, un empire n'en produit aucun.§!"
 tech_adastra_writing:0 "Écriture"
 tech_adastra_writing_desc:0 "Née pour compter des sacs de grain, elle finira par porter nos lois, nos poèmes et nos équations. Aucun outil n'a autant dépassé son usage.\n\n§YDébloque le bâtiment : Maison des tablettes.§!"
 tech_adastra_first_city:0 "Première cité"
 tech_adastra_first_city_desc:0 "Assez de gens au même endroit pour que certains cessent de produire leur propre nourriture. C'est là que naissent l'artisan, le prêtre et le percepteur.\n\n§YPermet d'améliorer le siège du pouvoir en Palais.§!"
 tech_adastra_calendar:0 "Calendrier lunaire"
 tech_adastra_calendar_desc:0 "Compter les lunes jusqu'à ce que le compte tombe juste. L'année cesse d'être une surprise annuelle."
 tech_adastra_measures:0 "Poids et mesures"
 tech_adastra_measures_desc:0 "Deux personnes qui échangent doivent d'abord tomber d'accord sur ce que veut dire « autant ». Tout le commerce tient dans cette phrase."
 tech_adastra_irrigation:0 "Irrigation"
 tech_adastra_irrigation_desc:0 "Creuser un canal, c'est décider où l'eau va. Le premier pouvoir qu'une société exerce sur un paysage."
 tech_adastra_priesthood:0 "Sacerdoce"
 tech_adastra_priesthood_desc:0 "Une poignée de gens cessent de cultiver. Les autres les nourrissent, en échange d'une explication du monde."
 tech_adastra_domestication:0 "Domestication animale"
 tech_adastra_domestication_desc:0 "L'animal cesse d'être une proie pour devenir un associé. Il porte, il tire, il donne du lait, et il mange nos restes."
 # --- iron ---
 tech_adastra_iron:0 "Forge du fer"
 tech_adastra_iron_desc:0 "Le minerai est partout, et non plus réservé aux routes commerciales des rois. Le fer démocratise autant l'outil que l'arme."
 tech_adastra_wheel:0 "La roue et la route"
 tech_adastra_wheel_desc:0 "La roue seule ne sert à rien : il lui fallait une surface digne d'elle. L'une sans l'autre, on reste chez soi."
 tech_adastra_law:0 "Code de lois"
 tech_adastra_law_desc:0 "Graver la règle dans la pierre, c'est la soustraire à l'humeur de celui qui gouverne. Le progrès n'est pas la sévérité : c'est la prévisibilité.\n\n§YDébloque le bâtiment : Tribunal. Permet d'améliorer le siège du pouvoir en Cour et chancellerie.§!"
 tech_adastra_coinage:0 "Monnaie frappée"
 tech_adastra_coinage_desc:0 "Un disque de métal garanti par une autorité. Il ne vaut rien, et c'est exactement pour cela qu'il vaut tout."
 tech_adastra_astronomy:0 "Astronomie à l'œil nu"
 tech_adastra_astronomy_desc:0 "Sans instrument, seulement des générations de patience, nous cartographions le ciel. Il faudra très longtemps pour comprendre que ce sont des lieux."
 tech_adastra_geometry:0 "Géométrie"
 tech_adastra_geometry_desc:0 "Mesurer un champ après la crue sans se disputer. La rigueur naît d'un problème de bornage."
 tech_adastra_glass:0 "Verre"
 tech_adastra_glass_desc:0 "Du sable chauffé jusqu'à devenir transparent. On ne comprend pas encore pourquoi ; on sait déjà quoi en faire."
 tech_adastra_aqueduct:0 "Aqueduc"
 tech_adastra_aqueduct_desc:0 "Faire venir l'eau propre à la ville plutôt que la ville à l'eau. La pente est calculée au doigt près sur des dizaines de lieues."
 tech_adastra_alphabet:0 "Alphabet"
 tech_adastra_alphabet_desc:0 "Trente signes au lieu de mille. Écrire cesse d'être un métier pour devenir une compétence."
 tech_adastra_standing_army:0 "Armée permanente"
 tech_adastra_standing_army_desc:0 "Des soldats qui ne rentrent pas aux champs après la saison. C'est cher, et c'est ce qui fait la différence."
 # --- medieval ---
 tech_adastra_crop_rotation:0 "Assolement triennal"
 tech_adastra_crop_rotation_desc:0 "Laisser une part de la terre se reposer produit davantage que la forcer entièrement. Une leçon que chaque civilisation réapprend à ses dépens."
 tech_adastra_mills:0 "Moulin à eau et à vent"
 tech_adastra_mills_desc:0 "Pour la première fois, un travail est fait sans muscle - ni le nôtre, ni celui d'une bête. La rivière ne demande pas de salaire.\n\n§YDébloque le bâtiment : Moulin.§!"
 tech_adastra_stone_architecture:0 "Architecture de pierre"
 tech_adastra_stone_architecture_desc:0 "L'arc, la voûte, le contrefort : trois façons de convaincre la pierre de tenir en l'air. Nos villes cessent de brûler tous les vingt ans.\n\n§YDébloque le bâtiment : Citadelle. Permet d'améliorer le siège du pouvoir en Hôtel de ville.§!"
 tech_adastra_scholasticism:0 "Scolastique"
 tech_adastra_scholasticism_desc:0 "Une méthode pour se disputer proprement : thèse, objection, réponse. Elle paraîtra rigide plus tard, mais elle apprend à un peuple à argumenter.\n\n§YDébloque le bâtiment : Université.§!"
 tech_adastra_guilds:0 "Guildes"
 tech_adastra_guilds_desc:0 "Le métier se transmet, se protège et se facture. La qualité devient une norme collective plutôt qu'un talent isolé."
 tech_adastra_algebra:0 "Algèbre et le zéro"
 tech_adastra_algebra_desc:0 "Un signe pour ce qui n'est pas là. L'idée est si difficile qu'il a fallu des siècles pour l'accepter, et tout le calcul en dépend."
 tech_adastra_optics:0 "Optique et lentilles"
 tech_adastra_optics_desc:0 "Un verre courbe redresse une vue qui faiblit. Un savant de soixante ans peut continuer à lire : la connaissance gagne vingt ans."
 tech_adastra_heavy_plough:0 "Charrue lourde"
 tech_adastra_heavy_plough_desc:0 "Un soc qui retourne la terre lourde du nord au lieu de la gratter. Des régions entières deviennent cultivables."
 tech_adastra_hospices:0 "Hospices"
 tech_adastra_hospices_desc:0 "Un lieu où l'on garde les malades au lieu de les écarter. On ne sait pas encore guérir ; on sait déjà veiller."
 tech_adastra_cartography:0 "Cartographie"
 tech_adastra_cartography_desc:0 "Dessiner une côte qu'on a longée, et la retrouver dix ans plus tard. La carte est une mémoire qui se transmet."
 # --- renaissance ---
 tech_adastra_printing:0 "Imprimerie"
 tech_adastra_printing_desc:0 "Copier une idée coûte désormais presque rien. Ceux qui vivaient du monopole du savoir ne comprennent pas encore ce qui vient de leur arriver.\n\n§YPermet d'améliorer le siège du pouvoir en Palais du gouvernement.§!"
 tech_adastra_experimental_method:0 "Méthode expérimentale"
 tech_adastra_experimental_method_desc:0 "Ne plus demander ce qui devrait être vrai, mais ce qui résiste à l'épreuve. Notre civilisation vient d'accepter de pouvoir avoir tort."
 tech_adastra_anatomy:0 "Anatomie"
 tech_adastra_anatomy_desc:0 "Regarder à l'intérieur du corps sans détourner les yeux. La médecine cesse d'être une consolation pour devenir une discipline."
 tech_adastra_mechanics:0 "Perspective et mécanique"
 tech_adastra_mechanics_desc:0 "La même géométrie sert à peindre une nef et à calculer un engrenage. L'art et la machine partagent brièvement le même atelier."
 tech_adastra_banking:0 "Banque et crédit"
 tech_adastra_banking_desc:0 "Prêter de l'argent que l'on n'a pas encore, contre une part de ce qu'il produira. Toute entreprise trop grande pour une seule vie devient possible."
 tech_adastra_chemistry:0 "Chimie des substances"
 tech_adastra_chemistry_desc:0 "L'alchimie cherchait l'or et a trouvé la méthode. On pèse avant, on pèse après, et on écrit ce qui a changé."
 tech_adastra_metallurgy_casting:0 "Fonte et artillerie"
 tech_adastra_metallurgy_casting_desc:0 "Couler le métal en une seule pièce assez solide pour contenir une explosion. Les murailles cessent d'être une réponse."
 tech_adastra_clockwork:0 "Horlogerie"
 tech_adastra_clockwork_desc:0 "Un mécanisme qui découpe la journée en parts égales, sans se soucier du soleil. Le premier objet qui impose son rythme aux hommes."
 tech_adastra_double_entry:0 "Comptabilité en partie double"
 tech_adastra_double_entry_desc:0 "Chaque somme est écrite deux fois, à deux endroits. Si les deux colonnes ne tombent pas juste, quelqu'un a menti ou s'est trompé."
 tech_adastra_navigation:0 "Navigation hauturière"
 tech_adastra_navigation_desc:0 "Perdre la côte de vue et savoir quand même où l'on est. C'est la première fois qu'on part sans repère — la seconde sera plus haut."
 # --- steam ---
 tech_adastra_steam_engine:0 "Machine à vapeur"
 tech_adastra_steam_engine_desc:0 "Une force qui ne dort pas, ne mange pas et ne se révolte pas. La limite de ce qu'un peuple peut produire cesse d'être le nombre de ses bras.\n\n§YDébloque le bâtiment : Manufacture. Débloque la ressource Biens de consommation : la première production en série.§!"
 tech_adastra_coal:0 "Charbon et coke"
 tech_adastra_coal_desc:0 "Nous brûlons des forêts vieilles de millions d'années. Personne ne se demande encore ce qui se passera quand il n'y en aura plus."
 tech_adastra_railways:0 "Chemin de fer"
 tech_adastra_railways_desc:0 "Deux villes distantes de trois semaines se retrouvent à une journée l'une de l'autre. Le pays tout entier change de taille sans bouger d'un pouce."
 tech_adastra_telegraph:0 "Télégraphe"
 tech_adastra_telegraph_desc:0 "Pour la première fois, un message va plus vite que le messager. La distance vient de perdre sa première bataille."
 tech_adastra_sanitation:0 "Hygiène publique"
 tech_adastra_sanitation_desc:0 "Des égouts et de l'eau propre sauveront plus de vies que tous nos médecins réunis. Le progrès le plus décisif est aussi le moins glorieux."
 tech_adastra_gas_lighting:0 "Éclairage au gaz"
 tech_adastra_gas_lighting_desc:0 "La nuit recule dans les rues et dans les ateliers. La journée de travail cesse d'être limitée par le soleil — pour le meilleur et pour le pire."
 tech_adastra_electromagnetism:0 "Électromagnétisme"
 tech_adastra_electromagnetism_desc:0 "Une aiguille bouge quand un courant passe à côté. Vingt ans plus tard, le même fait explique la lumière."
 tech_adastra_machine_tools:0 "Machines-outils"
 tech_adastra_machine_tools_desc:0 "Une machine qui fabrique les pièces d'une autre machine, au centième près. C'est ici que l'industrie cesse de dépendre du tour de main."
 tech_adastra_census:0 "Recensement"
 tech_adastra_census_desc:0 "Compter ses habitants un par un, avec leur âge et leur métier. Un État qui sait combien il a de bras cesse de gouverner à l'estime."
 tech_adastra_anesthesia:0 "Anesthésie"
 tech_adastra_anesthesia_desc:0 "L'opération cesse d'être une course contre la douleur. Le chirurgien peut enfin prendre son temps, et c'est ce temps qui sauve."
 # --- industrial ---
 tech_adastra_assembly_line:0 "Chaîne de montage"
 tech_adastra_assembly_line_desc:0 "Découper le travail en gestes si simples que n'importe qui peut les faire. La production explose ; l'ouvrier, lui, ne voit plus jamais l'objet fini."
 tech_adastra_bessemer:0 "Acier Bessemer"
 tech_adastra_bessemer_desc:0 "Souffler de l'air dans la fonte en fusion pour en brûler les impuretés. L'acier passe du luxe au matériau de base, et nos bâtiments montent."
 tech_adastra_thermodynamics:0 "Thermodynamique"
 tech_adastra_thermodynamics_desc:0 "Nos machines fonctionnaient avant que nous sachions pourquoi. Comprendre la chaleur, c'est découvrir que même l'énergie a une comptabilité."
 tech_adastra_fertilizers:0 "Engrais chimiques"
 tech_adastra_fertilizers_desc:0 "Fabriquer la fertilité au lieu de l'attendre. Notre population franchit un plafond que nous croyions posé par la nature elle-même."
 tech_adastra_labour_law:0 "Droit du travail"
 tech_adastra_labour_law_desc:0 "Après un siècle de fumée, il devient évident qu'une machine qui ne se fatigue pas ne doit pas servir de modèle à ceux qui se fatiguent."
 tech_adastra_photography:0 "Photographie"
 tech_adastra_photography_desc:0 "Fixer une image sans la dessiner. Pour la première fois, un visage traverse le temps sans passer par la main d'un peintre."
 tech_adastra_periodic_table:0 "Table périodique"
 tech_adastra_periodic_table_desc:0 "Ranger les éléments dans un tableau qui laisse des cases vides — et affirmer que ce qui manque existe. On les a trouvés."
 tech_adastra_refrigeration:0 "Réfrigération"
 tech_adastra_refrigeration_desc:0 "Le froid produit à volonté. La viande voyage, et la ville mange autre chose que ce qui pousse à une journée de charrette."
 tech_adastra_germ_theory:0 "Théorie microbienne"
 tech_adastra_germ_theory_desc:0 "La maladie a une cause, elle est vivante, et elle est trop petite pour être vue. Se laver les mains devient un acte médical."
 tech_adastra_universal_suffrage:0 "Suffrage élargi"
 tech_adastra_universal_suffrage_desc:0 "Le droit de vote cesse d'être attaché à la fortune. Ceux qui font tourner les usines pèsent enfin sur ce qu'on en fait."
 # --- machine ---
 tech_adastra_electricity:0 "Réseau électrique"
 tech_adastra_electricity_desc:0 "L'énergie cesse d'être produite là où elle est consommée. L'usine peut désormais s'installer ailleurs que sur une chute d'eau.\n\n§YDébloque la ressource Crédits énergétiques et les districts générateurs. L'entretien des districts, jusque-là payé en minerais, repasse en énergie.§!"
 tech_adastra_radio:0 "Radio"
 tech_adastra_radio_desc:0 "Une voix qui entre dans toutes les maisons en même temps. Un peuple peut enfin se penser comme un seul corps - pour le meilleur et pour le pire.\n\n§YDébloque le bâtiment : Station de radiodiffusion.§!"
 tech_adastra_aviation:0 "Moteur à explosion et aviation"
 tech_adastra_aviation_desc:0 "Un moteur assez léger pour quitter le sol. Une génération sépare le premier vol du premier bombardement."
 tech_adastra_antibiotics:0 "Antibiotiques"
 tech_adastra_antibiotics_desc:0 "Une moisissure oubliée sur une paillasse met fin à des millénaires de morts par égratignure. Le hasard, mais un hasard préparé."
 tech_adastra_mass_education:0 "Éducation de masse"
 tech_adastra_mass_education_desc:0 "Instruire tout le monde, pas seulement ceux qui le peuvent. Le réservoir de gens capables de trouver quelque chose vient d'être multiplié par cent.\n\n§YDébloque le bâtiment : École publique.§!"
 tech_adastra_quantum_theory:0 "Théorie des quanta"
 tech_adastra_quantum_theory_desc:0 "L'énergie ne coule pas, elle saute. Le monde à l'échelle de l'atome refuse le bon sens, et il a raison."
 tech_adastra_haber:0 "Synthèse de l'ammoniac"
 tech_adastra_haber_desc:0 "Fabriquer de l'engrais à partir de l'air. La moitié des vivants d'aujourd'hui mangent grâce à ce procédé — et la moitié de sa production a servi à faire des explosifs."
 tech_adastra_plastics:0 "Matières plastiques"
 tech_adastra_plastics_desc:0 "Une matière qui n'imite rien de ce qui existe. On peut lui donner la forme qu'on veut, et elle ne disparaît jamais."
 tech_adastra_social_insurance:0 "Assurance sociale"
 tech_adastra_social_insurance_desc:0 "Cotiser quand on va bien pour être couvert quand on va mal. Le risque cesse d'être individuel : c'est une invention politique, pas médicale."
 tech_adastra_epidemiology:0 "Épidémiologie"
 tech_adastra_epidemiology_desc:0 "Retirer la poignée d'une pompe et voir l'épidémie s'arrêter. La statistique devient une arme de santé publique."
 # --- atomic ---
 tech_adastra_fission:0 "Fission contrôlée"
 tech_adastra_fission_desc:0 "Nous avons appris à défaire l'atome avant d'apprendre à nous faire confiance. Toute la suite de notre histoire dépend de l'ordre de ces deux leçons."
 tech_adastra_electronics:0 "Électronique"
 tech_adastra_electronics_desc:0 "Faire porter un raisonnement par un courant. La pensée devient une chose que l'on peut fabriquer en série."
 tech_adastra_petrochemistry:0 "Pétrochimie"
 tech_adastra_petrochemistry_desc:0 "Des matériaux qui n'existent nulle part dans la nature, produits à la tonne. Notre quotidien devient synthétique presque sans que nous le remarquions."
 tech_adastra_vaccination:0 "Vaccination universelle"
 tech_adastra_vaccination_desc:0 "Effacer volontairement une maladie de la surface du monde. C'est la première fois que notre espèce agit à son échelle entière et réussit."
 tech_adastra_television:0 "Télévision"
 tech_adastra_television_desc:0 "Voir un événement lointain pendant qu'il se produit. Notre planète devient, pour la première fois, un endroit que l'on peut regarder d'un seul coup."
 tech_adastra_radio_astronomy:0 "Radioastronomie"
 tech_adastra_radio_astronomy_desc:0 "Le ciel émet dans des longueurs d'onde qu'aucun œil ne voit. On découvre qu'on regardait l'univers par un trou de serrure."
 tech_adastra_jet_engine:0 "Turboréacteur"
 tech_adastra_jet_engine_desc:0 "Plus d'hélice : on avale l'air devant et on le rejette derrière, plus vite. Le principe est celui de la fusée, en respirant encore."
 tech_adastra_containers:0 "Conteneur normalisé"
 tech_adastra_containers_desc:0 "Une boîte de la même taille partout dans le monde. L'invention la plus ennuyeuse du siècle, et celle qui a le plus changé les échanges."
 tech_adastra_green_revolution:0 "Révolution verte"
 tech_adastra_green_revolution_desc:0 "Des variétés sélectionnées, de l'engrais, de l'irrigation. Les famines annoncées n'ont pas eu lieu — et le sol a payé la note."
 tech_adastra_human_rights:0 "Déclaration des droits"
 tech_adastra_human_rights_desc:0 "Écrire ce qui est dû à quelqu'un du seul fait qu'il existe. Le texte n'oblige personne, et pourtant tout le monde s'en réclame."
 # --- space ---
 tech_adastra_computing:0 "Informatique"
 tech_adastra_computing_desc:0 "Déléguer le calcul à une machine, et découvrir aussitôt des problèmes que nous n'aurions jamais osé poser autrement."
 tech_adastra_rocketry:0 "Fusée à étages"
 tech_adastra_rocketry_desc:0 "Abandonner en route ce qui est devenu inutile pour continuer à monter. La leçon dépasse de loin l'ingénierie."
 tech_adastra_remote_sensing:0 "Télédétection"
 tech_adastra_remote_sensing_desc:0 "Voir notre monde depuis l'extérieur. Les ressources que nous cherchions à tâtons apparaissent d'un coup, cartographiées."
 tech_adastra_genetics:0 "Génétique appliquée"
 tech_adastra_genetics_desc:0 "Lire, puis corriger, le texte dont nous sommes faits. Nous devenons la première espèce à relire ses propres instructions."
 tech_adastra_cooperation:0 "Coopération internationale"
 tech_adastra_cooperation_desc:0 "Aucune nation ne va dans l'espace toute seule. La dernière technologie avant les étoiles n'est pas une machine : c'est un accord."
 tech_adastra_nuclear_medicine:0 "Médecine nucléaire"
 tech_adastra_nuclear_medicine_desc:0 "Le même atome qui a fait la bombe éclaire l'intérieur d'un corps vivant. On voit la tumeur avant qu'elle ne se voie."
 tech_adastra_satellites:0 "Satellite artificiel"
 tech_adastra_satellites_desc:0 "Un objet qui tombe assez vite pour manquer la planète à chaque tour. La première chose que nous ayons mise là-haut et qui y soit restée."
 tech_adastra_microprocessor:0 "Microprocesseur"
 tech_adastra_microprocessor_desc:0 "Une machine à calculer entière sur un éclat de silicium. Elle se glisse dans tout, y compris dans ce qui n'avait aucune raison de calculer."
 tech_adastra_networks:0 "Réseaux mondiaux"
 tech_adastra_networks_desc:0 "Relier les machines entre elles jusqu'à ce que la distance ne compte plus. Une planète entière devient une seule conversation, souvent pénible."
 tech_adastra_ecology:0 "Écologie planétaire"
 tech_adastra_ecology_desc:0 "La première photo de notre monde vu de l'extérieur a fait plus pour cette science que trente ans de rapports. On y voit une bille, et rien autour."
