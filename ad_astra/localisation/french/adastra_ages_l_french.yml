l_french:
 # Ad Astra 1.2 - Les Ages. GENERE par tools/gen_age_techs.py.
 # --- stone ---
 tech_adastra_fire:0 "Maîtrise du feu"
 tech_adastra_fire_desc:0 "Nous ne l'avons pas inventé : nous avons appris à ne pas le laisser mourir. Le foyer devient le premier lieu où la nuit ne gagne plus."
 tech_adastra_stone_tools:0 "Outils de pierre taillée"
 tech_adastra_stone_tools_desc:0 "Frapper une pierre contre une autre selon le bon angle. Tout le reste - la roue, la fonderie, la fusée - descend de ce geste."
 tech_adastra_hunting:0 "Chasse coordonnée"
 tech_adastra_hunting_desc:0 "Une bête plus grande que nous ne tombe pas devant un individu. Elle tombe devant un plan."
 tech_adastra_cave_art:0 "Peintures rupestres"
 tech_adastra_cave_art_desc:0 "Les premières mains posées sur la paroi disent une chose simple et vertigineuse : nous étions là, et nous voulions qu'on le sache.\n\n§YDébloque le bâtiment : Monument des ancêtres.§!"
 tech_adastra_language:0 "Langage articulé"
 tech_adastra_language_desc:0 "Le savoir cesse de mourir avec celui qui le porte. C'est la seule invention qui rend toutes les autres possibles.\n\n§YPermet d'améliorer le siège du pouvoir en Maison commune.§!"
 tech_adastra_seasons:0 "Lecture des saisons"
 tech_adastra_seasons_desc:0 "Le ciel revient toujours au même endroit. Celui qui remarque cela sait quand les troupeaux passent, et devient indispensable."
 tech_adastra_pigments:0 "Terres et pigments"
 tech_adastra_pigments_desc:0 "Broyer l'ocre, la mélanger à la graisse, obtenir une couleur qui tient. C'est de la chimie, même si personne n'a encore de mot pour ça."
 tech_adastra_cordage:0 "Corde et vannerie"
 tech_adastra_cordage_desc:0 "Tordre des fibres jusqu'à ce qu'elles tiennent mieux ensemble que séparées. Le nœud est la première machine."
 tech_adastra_shelter:0 "Abri construit"
 tech_adastra_shelter_desc:0 "On cesse de chercher une grotte : on en fabrique une. La différence paraît mince, elle ne l'est pas."
 tech_adastra_burial:0 "Sépulture"
 tech_adastra_burial_desc:0 "Déposer un mort avec des fleurs et des outils, c'est affirmer que quelque chose continue. Aucun animal ne fait ce pari."
 tech_adastra_cooking:0 "Cuisson des aliments"
 tech_adastra_cooking_desc:0 "Le feu digere une part du travail a notre place. On tire davantage d'une meme carcasse, et le corps consacre ailleurs l'energie economisee."
 tech_adastra_clan:0 "Clan et parente"
 tech_adastra_clan_desc:0 "Savoir qui est le cousin de qui decide qui aide qui. C'est la premiere institution, et elle n'a besoin d'aucun batiment."
 tech_adastra_hafting:0 "Pointe emmanchee"
 tech_adastra_hafting_desc:0 "Lier la pierre au bois multiplie la force du bras. L'assemblage de deux materiaux vaut mieux que le meilleur des deux."
 tech_adastra_lunar_count:0 "Comptage lunaire"
 tech_adastra_lunar_count_desc:0 "Vingt-huit encoches sur un os. Quelqu'un a compris que le temps se decoupe, et qu'un decompte tient dans la main."
 tech_adastra_storytelling:0 "Recit et transmission"
 tech_adastra_storytelling_desc:0 "Ce qu'on raconte le soir survit a celui qui l'a vecu. La memoire cesse d'etre individuelle et devient un bien commun."
 tech_adastra_grinding:0 "Meule et broyage"
 tech_adastra_grinding_desc:0 "Ecraser la graine rend mangeable ce qui ne l'etait pas. Une pierre creuse et une pierre ronde nourrissent plus qu'une bonne chasse."
 tech_adastra_weaving:0 "Tissage"
 tech_adastra_weaving_desc:0 "Croiser des fils selon un ordre repete. C'est la premiere fois qu'on fabrique une matiere qui n'existait pas."
 tech_adastra_bow:0 "Propulseur et arc"
 tech_adastra_bow_desc:0 "Tuer a distance change tout : le chasseur ne partage plus le risque de sa proie. La guerre en heritera."
 tech_adastra_exchange:0 "Echange a distance"
 tech_adastra_exchange_desc:0 "De l'obsidienne a trois cents kilometres de sa source. Personne n'a voyage si loin : elle est passee de main en main."
 tech_adastra_canoe:0 "Pirogue et cabotage"
 tech_adastra_canoe_desc:0 "Un tronc evide, et la riviere devient une route. La premiere fois qu'on se deplace sur un element qui ne nous porte pas."
 tech_adastra_salt:0 "Le sel et la conservation"
 tech_adastra_salt_desc:0 "Ce qui est sale ne pourrit pas. On peut enfin manger en hiver ce qu'on a pris en ete - le temps devient une reserve."
 tech_adastra_village:0 "Village et grenier"
 tech_adastra_village_desc:0 "On ne suit plus le troupeau : on l'attend. Il faut alors un endroit ou poser ce qu'on garde, et quelqu'un pour le surveiller."
 tech_adastra_agriculture:0 "Agriculture"
 tech_adastra_agriculture_desc:0 "Cesser de suivre la nourriture, et la faire venir à soi. Le prix à payer : on ne partira plus.\n\n§YDébloque le bâtiment : Grenier.§!"
 tech_adastra_pottery:0 "Poterie"
 tech_adastra_pottery_desc:0 "Un récipient, c'est du temps mis en réserve. La récolte de cette année peut désormais nourrir l'année suivante."
 tech_adastra_domestication:0 "Domestication animale"
 tech_adastra_domestication_desc:0 "L'animal cesse d'être une proie pour devenir un associé. Il porte, il tire, il donne du lait, et il mange nos restes."
 # --- bronze ---
 tech_adastra_bronze:0 "Métallurgie du bronze"
 tech_adastra_bronze_desc:0 "Deux minerais médiocres, fondus ensemble, donnent un métal que ni l'un ni l'autre ne savait être. La métallurgie commence par cette surprise.\n\n§YDébloque le bâtiment : Fonderie. Débloque la ressource Alliages : sans métallurgie, un empire n'en produit aucun.§!"
 tech_adastra_writing:0 "Écriture"
 tech_adastra_writing_desc:0 "Née pour compter des sacs de grain, elle finira par porter nos lois, nos poèmes et nos équations. Aucun outil n'a autant dépassé son usage.\n\n§YDébloque le bâtiment : Maison des tablettes.§!"
 tech_adastra_first_city:0 "Première cité"
 tech_adastra_first_city_desc:0 "Assez de gens au même endroit pour que certains cessent de produire leur propre nourriture. C'est là que naissent l'artisan, le prêtre et le percepteur.\n\n§YPermet d'améliorer le siège du pouvoir en Palais.§!"
 tech_adastra_calendar:0 "Calendrier lunaire"
 tech_adastra_calendar_desc:0 "Compter les lunes jusqu'à ce que le compte tombe juste. L'année cesse d'être une surprise annuelle."
 tech_adastra_measures:0 "Poids et mesures"
 tech_adastra_measures_desc:0 "Deux personnes qui échangent doivent d'abord tomber d'accord sur ce que veut dire « autant ». Tout le commerce tient dans cette phrase."
 tech_adastra_irrigation:0 "Irrigation"
 tech_adastra_irrigation_desc:0 "Creuser un canal, c'est décider où l'eau va. Le premier pouvoir qu'une société exerce sur un paysage."
 tech_adastra_priesthood:0 "Sacerdoce"
 tech_adastra_priesthood_desc:0 "Une poignée de gens cessent de cultiver. Les autres les nourrissent, en échange d'une explication du monde."
 tech_adastra_wheel:0 "La roue et la route"
 tech_adastra_wheel_desc:0 "La roue seule ne sert à rien : il lui fallait une surface digne d'elle. L'une sans l'autre, on reste chez soi."
 tech_adastra_sail:0 "Voile de fleuve"
 tech_adastra_sail_desc:0 "Le vent remonte le fleuve, le courant le redescend : un bateau fait enfin l'aller et le retour chargé. Le premier moteur ne coûte rien à nourrir."
 tech_adastra_plough:0 "Araire"
 tech_adastra_plough_desc:0 "Un soc traîné par une bête ouvre en une matinée ce qu'une houe retourne en trois jours. Le sol cède plus vite que les bras ne fatiguent."
 tech_adastra_brewing:0 "Brasserie"
 tech_adastra_brewing_desc:0 "L'orge trempée fermente et devient buvable là où l'eau ne l'est pas. On paie les équipes de chantier en pain et en bière, et personne ne trouve cela étrange."
 tech_adastra_kingship:0 "Royauté"
 tech_adastra_kingship_desc:0 "Un homme cesse d'être le premier parmi ses pairs et devient celui à qui l'on rend des comptes. Il fait estampiller son nom dans les briques du mur qu'il ordonne."
 tech_adastra_fired_brick:0 "Brique cuite"
 tech_adastra_fired_brick_desc:0 "La brique séchée au soleil fond sous la pluie ; celle qui passe au four tient des siècles. Le bois de chauffe coûte si cher qu'on la réserve d'abord aux égouts et aux quais."
 tech_adastra_lever:0 "Levier et rampe"
 tech_adastra_lever_desc:0 "Rien ne rend la pierre plus légère : on échange son poids contre de la distance. Trente hommes et une poutre déplacent ce qui en écraserait cent."
 tech_adastra_lost_wax:0 "Fonte à la cire perdue"
 tech_adastra_lost_wax_desc:0 "On modèle en cire, on enrobe d'argile, on chauffe : la cire s'écoule et le bronze prend sa place exacte. Le moule ne sert qu'une fois, et il faut le briser pour voir le résultat."
 tech_adastra_sexagesimal:0 "Numération sexagésimale"
 tech_adastra_sexagesimal_desc:0 "Compter par soixante, parce que soixante se partage en deux, trois, quatre, cinq et six sans reste. Le scribe qui pose ce choix ne saura jamais qu'on le suivra toujours."
 tech_adastra_faience:0 "Faïence et émail"
 tech_adastra_faience_desc:0 "Du sable broyé, un peu de cendre, et la surface ressort du four bleue et vitreuse. On ne comprend pas pourquoi : on note la recette et on la garde."
 tech_adastra_shield_wall:0 "Mur de boucliers"
 tech_adastra_shield_wall_desc:0 "Six rangs qui avancent au même pas, boucliers joints, lances passées par-dessus. Le courage d'un seul compte moins que de ne pas rompre la ligne."
 tech_adastra_empire:0 "Premier empire"
 tech_adastra_empire_desc:0 "Un roi soumet les cités voisines, laisse leurs dieux en place et nomme ses propres gouverneurs. Commander plus loin que trois jours de marche est un problème entièrement neuf."
 tech_adastra_trade_colony:0 "Comptoir marchand"
 tech_adastra_trade_colony_desc:0 "Des familles s'installent à un mois de caravane de chez elles, dans un quartier qu'on leur réserve, pour vendre l'étain et acheter l'argent. Elles écrivent à la maison plus souvent que les rois n'écrivent leurs annales."
 tech_adastra_chariot:0 "Char de guerre"
 tech_adastra_chariot_desc:0 "Une caisse légère sur deux roues à rayons, deux chevaux, un conducteur et un archer. Il coûte le revenu d'un village et il décide des batailles."
 tech_adastra_surveying:0 "Arpentage"
 tech_adastra_surveying_desc:0 "La crue efface chaque année les limites des champs, et il faut les rétablir avec une corde à nœuds. La mesure du monde naît d'une querelle de bornes."
 tech_adastra_medicine:0 "Médecine et prescriptions"
 tech_adastra_medicine_desc:0 "Un rouleau décrit quarante-huit blessures, du crâne au thorax, et dit pour chacune s'il faut soigner, tenter, ou s'abstenir. Reconnaître ce qu'on ne sait pas guérir est déjà un savoir."
 tech_adastra_dyes:0 "Teinture et pourpre"
 tech_adastra_dyes_desc:0 "Il faut dix mille coquillages pour teindre un seul manteau, et l'atelier empeste à une lieue. La couleur devient un rang qu'on porte sur le dos."
 tech_adastra_diplomacy:0 "Traité et ambassade"
 tech_adastra_diplomacy_desc:0 "Deux empires qui n'ont pas réussi à s'écraser gravent la même paix, chacun dans sa langue, et s'échangent les copies. On y promet aussi de se rendre les fuyards."
 # --- iron ---
 tech_adastra_iron:0 "Forge du fer"
 tech_adastra_iron_desc:0 "Le minerai est partout, et non plus réservé aux routes commerciales des rois. Le fer démocratise autant l'outil que l'arme."
 tech_adastra_law:0 "Code de lois"
 tech_adastra_law_desc:0 "Graver la règle dans la pierre, c'est la soustraire à l'humeur de celui qui gouverne. Le progrès n'est pas la sévérité : c'est la prévisibilité.\n\n§YDébloque le bâtiment : Tribunal. Permet d'améliorer le siège du pouvoir en Cour et chancellerie.§!"
 tech_adastra_coinage:0 "Monnaie frappée"
 tech_adastra_coinage_desc:0 "Un disque de métal garanti par une autorité. Il ne vaut rien, et c'est exactement pour cela qu'il vaut tout."
 tech_adastra_astronomy:0 "Astronomie à l'œil nu"
 tech_adastra_astronomy_desc:0 "Sans instrument, seulement des générations de patience, nous cartographions le ciel. Il faudra très longtemps pour comprendre que ce sont des lieux."
 tech_adastra_geometry:0 "Géométrie"
 tech_adastra_geometry_desc:0 "Mesurer un champ après la crue sans se disputer. La rigueur naît d'un problème de bornage."
 tech_adastra_glass:0 "Verre"
 tech_adastra_glass_desc:0 "Du sable chauffé jusqu'à devenir transparent. On ne comprend pas encore pourquoi ; on sait déjà quoi en faire."
 tech_adastra_aqueduct:0 "Aqueduc"
 tech_adastra_aqueduct_desc:0 "Faire venir l'eau propre à la ville plutôt que la ville à l'eau. La pente est calculée au doigt près sur des dizaines de lieues."
 tech_adastra_alphabet:0 "Alphabet"
 tech_adastra_alphabet_desc:0 "Trente signes au lieu de mille. Écrire cesse d'être un métier pour devenir une compétence."
 tech_adastra_standing_army:0 "Armée permanente"
 tech_adastra_standing_army_desc:0 "Des soldats qui ne rentrent pas aux champs après la saison. C'est cher, et c'est ce qui fait la différence."
 tech_adastra_star_catalogue:0 "Catalogue d'étoiles"
 tech_adastra_star_catalogue_desc:0 "Huit cent cinquante étoiles, chacune avec sa position et son éclat, notées une par une. En comparant avec des relevés vieux de cent cinquante ans, l'auteur s'aperçoit que le ciel entier a bougé."
 tech_adastra_atomism:0 "Atomisme"
 tech_adastra_atomism_desc:0 "Un philosophe soutient qu'en coupant la matière assez souvent, on finit par buter sur quelque chose d'insécable. Il n'a aucune preuve, et il a raison pour deux mille ans."
 tech_adastra_water_clock:0 "Clepsydre"
 tech_adastra_water_clock_desc:0 "Au tribunal, chaque plaideur reçoit sa mesure d'eau : quand le vase est vide, il se tait. La durée devient une quantité qu'on partage."
 tech_adastra_pulley:0 "Levier et poulie"
 tech_adastra_pulley_desc:0 "Un seul homme hale un navire chargé jusqu'à la grève, devant une foule qui n'y croit pas. La force ne se crée pas : elle se répartit."
 tech_adastra_lodestone:0 "Pierre d'aimant"
 tech_adastra_lodestone_desc:0 "Une cuiller de minerai posée sur une plaque polie s'arrête toujours dans la même direction. On s'en sert d'abord pour orienter les maisons, pas les navires."
 tech_adastra_cavalry:0 "Cavalerie montée"
 tech_adastra_cavalry_desc:0 "Monter le cheval au lieu de l'atteler. Le cavalier couvre en un jour ce que le fantassin met trois jours à faire, et il arrive encore capable de se battre."
 tech_adastra_tax_register:0 "Recensement"
 tech_adastra_tax_register_desc:0 "Un scribe passe de porte en porte et inscrit les champs, les bœufs et les fils en âge de porter les armes. Ce qui est compté peut être imposé, nourri, appelé."
 tech_adastra_clinical_medicine:0 "Médecine d'observation"
 tech_adastra_clinical_medicine_desc:0 "Le médecin note ce qu'il voit jour après jour au lieu de chercher quel dieu il a fâché. La fièvre ne change pas ; la façon de la regarder, si."
 tech_adastra_philosophy:0 "École philosophique"
 tech_adastra_philosophy_desc:0 "Un maître répond aux questions par d'autres questions et retient celles qui résistent. On y apprend moins un savoir qu'une façon d'en douter."
 tech_adastra_silk_road:0 "Routes caravanières"
 tech_adastra_silk_road_desc:0 "Une balle de soie change six fois de mains entre l'orient et la mer. Aucun de ces marchands n'a vu les deux bouts de la route, et la route existe."
 tech_adastra_trireme:0 "Navire de guerre à rames"
 tech_adastra_trireme_desc:0 "Cent soixante rameurs qui doivent respirer comme un seul homme. La coque ne vaut rien sans les mois d'entraînement qu'elle exige."
 tech_adastra_crucible_steel:0 "Acier au creuset"
 tech_adastra_crucible_steel_desc:0 "Le fer scellé dans un pot d'argile avec du charbon en ressort autre : assez dur pour trancher, assez souple pour ne pas rompre. Le forgeron ignore pourquoi, il sait combien de temps."
 tech_adastra_roman_road:0 "Voie pavée"
 tech_adastra_roman_road_desc:0 "Un lit de pierres, du gravier, des dalles, et juste assez de bombement pour que l'eau s'en aille. Le courrier met huit jours là où il en mettait vingt."
 tech_adastra_lighthouse:0 "Phare"
 tech_adastra_lighthouse_desc:0 "Un feu entretenu toute la nuit en haut d'une tour, visible à trente milles. Les capitaines cessent d'attendre le jour pour entrer au port."
 tech_adastra_bellows:0 "Soufflet et fourneau"
 tech_adastra_bellows_desc:0 "Un souffle continu pousse le foyer plus haut que le feu ne monte seul, et le métal coule au lieu de ramollir. On cesse de marteler ce qu'on peut verser."
 tech_adastra_concrete:0 "Béton de chaux"
 tech_adastra_concrete_desc:0 "De la chaux, du sable et de la cendre volcanique prennent en masse, même sous l'eau. On coule désormais la pierre au lieu de la tailler, et les portées s'allongent."
 # --- medieval ---
 tech_adastra_crop_rotation:0 "Assolement triennal"
 tech_adastra_crop_rotation_desc:0 "Laisser une part de la terre se reposer produit davantage que la forcer entièrement. Une leçon que chaque civilisation réapprend à ses dépens."
 tech_adastra_mills:0 "Moulin à eau et à vent"
 tech_adastra_mills_desc:0 "Pour la première fois, un travail est fait sans muscle - ni le nôtre, ni celui d'une bête. La rivière ne demande pas de salaire.\n\n§YDébloque le bâtiment : Moulin.§!"
 tech_adastra_stone_architecture:0 "Architecture de pierre"
 tech_adastra_stone_architecture_desc:0 "L'arc, la voûte, le contrefort : trois façons de convaincre la pierre de tenir en l'air. Nos villes cessent de brûler tous les vingt ans.\n\n§YDébloque le bâtiment : Citadelle. Permet d'améliorer le siège du pouvoir en Hôtel de ville.§!"
 tech_adastra_scholasticism:0 "Scolastique"
 tech_adastra_scholasticism_desc:0 "Une méthode pour se disputer proprement : thèse, objection, réponse. Elle paraîtra rigide plus tard, mais elle apprend à un peuple à argumenter.\n\n§YDébloque le bâtiment : Université.§!"
 tech_adastra_guilds:0 "Guildes"
 tech_adastra_guilds_desc:0 "Le métier se transmet, se protège et se facture. La qualité devient une norme collective plutôt qu'un talent isolé."
 tech_adastra_algebra:0 "Algèbre et le zéro"
 tech_adastra_algebra_desc:0 "Un signe pour ce qui n'est pas là. L'idée est si difficile qu'il a fallu des siècles pour l'accepter, et tout le calcul en dépend."
 tech_adastra_optics:0 "Optique et lentilles"
 tech_adastra_optics_desc:0 "Un verre courbe redresse une vue qui faiblit. Un savant de soixante ans peut continuer à lire : la connaissance gagne vingt ans."
 tech_adastra_heavy_plough:0 "Charrue lourde"
 tech_adastra_heavy_plough_desc:0 "Un soc qui retourne la terre lourde du nord au lieu de la gratter. Des régions entières deviennent cultivables."
 tech_adastra_hospices:0 "Hospices"
 tech_adastra_hospices_desc:0 "Un lieu où l'on garde les malades au lieu de les écarter. On ne sait pas encore guérir ; on sait déjà veiller."
 tech_adastra_cartography:0 "Cartographie"
 tech_adastra_cartography_desc:0 "Dessiner une côte qu'on a longée, et la retrouver dix ans plus tard. La carte est une mémoire qui se transmet."
 tech_adastra_stirrup:0 "Étrier"
 tech_adastra_stirrup_desc:0 "Deux boucles de fer sous les pieds, et un cavalier peut frapper sans quitter sa selle. Le cheval devient une arme, et qui a les moyens de l'entretenir devient un seigneur."
 tech_adastra_paper_mill:0 "Moulin à papier"
 tech_adastra_paper_mill_desc:0 "Le chiffon usé revient en feuilles. Écrire cesse d'être un luxe de peau de bête : un scribe ne compte plus ses brouillons."
 tech_adastra_distillation:0 "Alambic et distillation"
 tech_adastra_distillation_desc:0 "On chauffe, on recueille la vapeur, et ce qui retombe est plus pur que ce qu'on avait. L'appareil sert d'abord au parfum et au remède, et enseigne au passage à séparer les choses."
 tech_adastra_translation_movement:0 "Mouvement de traduction"
 tech_adastra_translation_movement_desc:0 "Des commanditaires paient un livre au poids de l'or pour qu'un traité grec passe en arabe. Une bibliothèque de Bagdad garde ce qu'Athènes avait cessé de lire."
 tech_adastra_astrolabe:0 "Astrolabe"
 tech_adastra_astrolabe_desc:0 "Un disque de laiton qui répond à deux questions simples : où suis-je, et quelle heure est-il. On le tient par son anneau, on vise une étoile, on lit."
 tech_adastra_gunpowder:0 "Poudre noire"
 tech_adastra_gunpowder_desc:0 "Salpêtre, soufre, charbon de bois. Des alchimistes cherchaient l'élixir de longue vie ; ce qu'ils ont trouvé abrège les sièges et les hommes."
 tech_adastra_horse_collar:0 "Collier d'épaule"
 tech_adastra_horse_collar_desc:0 "Le collier appuie sur l'épaule et non sur la gorge : le cheval tire enfin sans s'étrangler. Un attelage fait le travail de quatre bœufs, et marche deux fois plus vite."
 tech_adastra_trigonometry:0 "Trigonométrie"
 tech_adastra_trigonometry_desc:0 "Une table de sinus tient sur deux pages et remplace une vie de mesures. Avec un angle et une longueur, on donne la hauteur d'un minaret sans y monter."
 tech_adastra_crop_diffusion:0 "Migration des plantes"
 tech_adastra_crop_diffusion_desc:0 "Le riz, le coton et la canne à sucre suivent les caravanes et prennent racine à trois mille lieues de chez eux. Un paysan sème une plante dont son grand-père ignorait le nom."
 tech_adastra_paper_money:0 "Papier-monnaie"
 tech_adastra_paper_money_desc:0 "L'État promet, et le papier vaut. Une fortune tient désormais dans une manche, ce qui ravit les marchands et inquiète ceux qui savent compter."
 tech_adastra_blast_furnace:0 "Haut fourneau"
 tech_adastra_blast_furnace_desc:0 "Un four assez chaud pour que le fer coule au lieu de ramollir. On le verse dans un moule et la pièce sort déjà faite, cent fois de suite."
 tech_adastra_compass:0 "Boussole"
 tech_adastra_compass_desc:0 "Une aiguille frottée à la pierre d'aimant, posée sur une paille qui flotte, montre toujours le sud. Le ciel couvert cesse d'être une raison de rester au port."
 tech_adastra_caravanserai:0 "Caravansérail"
 tech_adastra_caravanserai_desc:0 "Une journée de marche, puis un mur, un puits, une écurie et un toit. La longue route devient une suite de courtes, et le commerce cesse d'être une aventure."
 tech_adastra_stern_rudder:0 "Gouvernail d'étambot"
 tech_adastra_stern_rudder_desc:0 "Un gouvernail accroché à l'arrière et mené à la barre : un seul homme dirige un navire que dix avirons ne redressaient plus. Les coques peuvent enfin grandir."
 tech_adastra_impetus:0 "Théorie de l'impetus"
 tech_adastra_impetus_desc:0 "Une pierre lancée continue parce qu'elle emporte quelque chose avec elle, et non parce que l'air la pousse par derrière. L'idée est fausse dans le détail et juste dans l'esprit : le mouvement n'a pas besoin d'être entretenu."
 # --- renaissance ---
 tech_adastra_printing:0 "Imprimerie"
 tech_adastra_printing_desc:0 "Copier une idée coûte désormais presque rien. Ceux qui vivaient du monopole du savoir ne comprennent pas encore ce qui vient de leur arriver.\n\n§YPermet d'améliorer le siège du pouvoir en Palais du gouvernement.§!"
 tech_adastra_experimental_method:0 "Méthode expérimentale"
 tech_adastra_experimental_method_desc:0 "Ne plus demander ce qui devrait être vrai, mais ce qui résiste à l'épreuve. Notre civilisation vient d'accepter de pouvoir avoir tort."
 tech_adastra_anatomy:0 "Anatomie"
 tech_adastra_anatomy_desc:0 "Regarder à l'intérieur du corps sans détourner les yeux. La médecine cesse d'être une consolation pour devenir une discipline."
 tech_adastra_mechanics:0 "Perspective et mécanique"
 tech_adastra_mechanics_desc:0 "La même géométrie sert à peindre une nef et à calculer un engrenage. L'art et la machine partagent brièvement le même atelier."
 tech_adastra_banking:0 "Banque et crédit"
 tech_adastra_banking_desc:0 "Prêter de l'argent que l'on n'a pas encore, contre une part de ce qu'il produira. Toute entreprise trop grande pour une seule vie devient possible."
 tech_adastra_chemistry:0 "Chimie des substances"
 tech_adastra_chemistry_desc:0 "L'alchimie cherchait l'or et a trouvé la méthode. On pèse avant, on pèse après, et on écrit ce qui a changé."
 tech_adastra_metallurgy_casting:0 "Fonte et artillerie"
 tech_adastra_metallurgy_casting_desc:0 "Couler le métal en une seule pièce assez solide pour contenir une explosion. Les murailles cessent d'être une réponse."
 tech_adastra_clockwork:0 "Horlogerie"
 tech_adastra_clockwork_desc:0 "Un mécanisme qui découpe la journée en parts égales, sans se soucier du soleil. Le premier objet qui impose son rythme aux hommes."
 tech_adastra_double_entry:0 "Comptabilité en partie double"
 tech_adastra_double_entry_desc:0 "Chaque somme est écrite deux fois, à deux endroits. Si les deux colonnes ne tombent pas juste, quelqu'un a menti ou s'est trompé."
 tech_adastra_navigation:0 "Navigation hauturière"
 tech_adastra_navigation_desc:0 "Perdre la côte de vue et savoir quand même où l'on est. C'est la première fois qu'on part sans repère — la seconde sera plus haut."
 tech_adastra_telescope:0 "Lunette astronomique"
 tech_adastra_telescope_desc:0 "Trois verres alignés dans un tube, et Jupiter a des lunes qui ne tournent pas autour de nous. Pour la première fois, un instrument voit avant l'œil."
 tech_adastra_heliocentrism:0 "Système héliocentrique"
 tech_adastra_heliocentrism_desc:0 "Un chanoine repousse la publication jusqu'à son lit de mort, et il a raison d'hésiter : il déplace le sol sous les pieds de tout le monde."
 tech_adastra_magnetism:0 "Magnétisme terrestre"
 tech_adastra_magnetism_desc:0 "L'aiguille ne pointe pas tout à fait le nord, et elle ment différemment selon l'endroit. La Terre elle-même est un aimant : le pilote apprend à corriger."
 tech_adastra_vacuum_pump:0 "Pompe à vide"
 tech_adastra_vacuum_pump_desc:0 "Deux hémisphères de cuivre vidés d'air, et seize chevaux n'arrivent pas à les séparer. Ce qui pèse sur nous depuis toujours vient d'être mesuré."
 tech_adastra_universal_gravitation:0 "Gravitation universelle"
 tech_adastra_universal_gravitation_desc:0 "La pomme et la Lune tombent de la même façon, avec la même équation. Le ciel cesse d'être un autre monde : il obéit aux règles de la cour de ferme."
 tech_adastra_microscope:0 "Microscope"
 tech_adastra_microscope_desc:0 "Une goutte d'eau de pluie est pleine de bêtes qui nagent. Personne n'avait imaginé que le monde continue en dessous de ce que l'œil sait voir."
 tech_adastra_new_crops:0 "Plantes du Nouveau Monde"
 tech_adastra_new_crops_desc:0 "La pomme de terre nourrit trois fois plus de bouches sur le même champ, et personne n'en veut avant la première famine. Ensuite, plus personne ne s'en passe."
 tech_adastra_pike_and_shot:0 "Pique et arquebuse"
 tech_adastra_pike_and_shot_desc:0 "Un carré de piques protège les tireurs pendant qu'ils rechargent. Un paysan formé en six semaines abat un cavalier entraîné depuis l'enfance."
 tech_adastra_joint_stock:0 "Société par actions"
 tech_adastra_joint_stock_desc:0 "Le risque d'un voyage est découpé en parts que l'on peut vendre à un inconnu. Un naufrage ruine cent personnes d'un centième chacune."
 tech_adastra_permanent_embassy:0 "Ambassade permanente"
 tech_adastra_permanent_embassy_desc:0 "Au lieu d'envoyer un messager quand tout va mal, on laisse un homme sur place qui écrit chaque semaine. Il s'ennuie, il écoute, et il coûte moins cher qu'une guerre."
 tech_adastra_caravel:0 "Caravelle"
 tech_adastra_caravel_desc:0 "Une coque assez petite pour remonter un fleuve et assez solide pour l'océan, gréée pour avancer contre le vent. Le retour cesse d'être le problème."
 tech_adastra_canal_lock:0 "Écluse à sas"
 tech_adastra_canal_lock_desc:0 "Deux portes et un bassin : une péniche monte une colline en une demi-heure. Le grain voyage par eau jusqu'à des villes qui n'ont pas de port."
 tech_adastra_bastion_fort:0 "Fortification bastionnée"
 tech_adastra_bastion_fort_desc:0 "Les murailles s'abaissent, s'épaississent et prennent la forme d'une étoile pour que rien ne reste hors de vue. Un siège se compte désormais en mois et en terrassiers."
 tech_adastra_deep_mining:0 "Mines profondes et exhaure"
 tech_adastra_deep_mining_desc:0 "Sous un certain niveau, la galerie se remplit d'eau plus vite qu'on ne la creuse. Des chaînes de godets tournent jour et nuit pour que dix hommes travaillent au sec."
 tech_adastra_clear_glass:0 "Verre cristallin"
 tech_adastra_clear_glass_desc:0 "Un verre sans bulle ni teinte verte, assez pur pour qu'on oublie qu'il est là. On en fait des fenêtres, des miroirs, et bientôt des lentilles."
 # --- steam ---
 tech_adastra_steam_engine:0 "Machine à vapeur"
 tech_adastra_steam_engine_desc:0 "Une force qui ne dort pas, ne mange pas et ne se révolte pas. La limite de ce qu'un peuple peut produire cesse d'être le nombre de ses bras.\n\n§YDébloque le bâtiment : Manufacture. Débloque la ressource Biens de consommation : la première production en série.§!"
 tech_adastra_coal:0 "Charbon et coke"
 tech_adastra_coal_desc:0 "Nous brûlons des forêts vieilles de millions d'années. Personne ne se demande encore ce qui se passera quand il n'y en aura plus."
 tech_adastra_railways:0 "Chemin de fer"
 tech_adastra_railways_desc:0 "Deux villes distantes de trois semaines se retrouvent à une journée l'une de l'autre. Le pays tout entier change de taille sans bouger d'un pouce."
 tech_adastra_telegraph:0 "Télégraphe"
 tech_adastra_telegraph_desc:0 "Pour la première fois, un message va plus vite que le messager. La distance vient de perdre sa première bataille."
 tech_adastra_sanitation:0 "Hygiène publique"
 tech_adastra_sanitation_desc:0 "Des égouts et de l'eau propre sauveront plus de vies que tous nos médecins réunis. Le progrès le plus décisif est aussi le moins glorieux."
 tech_adastra_gas_lighting:0 "Éclairage au gaz"
 tech_adastra_gas_lighting_desc:0 "La nuit recule dans les rues et dans les ateliers. La journée de travail cesse d'être limitée par le soleil — pour le meilleur et pour le pire."
 tech_adastra_electromagnetism:0 "Électromagnétisme"
 tech_adastra_electromagnetism_desc:0 "Une aiguille bouge quand un courant passe à côté. Vingt ans plus tard, le même fait explique la lumière."
 tech_adastra_machine_tools:0 "Machines-outils"
 tech_adastra_machine_tools_desc:0 "Une machine qui fabrique les pièces d'une autre machine, au centième près. C'est ici que l'industrie cesse de dépendre du tour de main."
 tech_adastra_census:0 "Recensement"
 tech_adastra_census_desc:0 "Compter ses habitants un par un, avec leur âge et leur métier. Un État qui sait combien il a de bras cesse de gouverner à l'estime."
 tech_adastra_anesthesia:0 "Anesthésie"
 tech_adastra_anesthesia_desc:0 "L'opération cesse d'être une course contre la douleur. Le chirurgien peut enfin prendre son temps, et c'est ce temps qui sauve."
 tech_adastra_photography:0 "Photographie"
 tech_adastra_photography_desc:0 "Fixer une image sans la dessiner. Pour la première fois, un visage traverse le temps sans passer par la main d'un peintre."
 tech_adastra_selective_breeding:0 "Sélection animale"
 tech_adastra_selective_breeding_desc:0 "En choisissant quels animaux se reproduisent, on double le poids d'un mouton en trois générations. La ferme devient un atelier comme un autre."
 tech_adastra_canals:0 "Canaux de navigation"
 tech_adastra_canals_desc:0 "Un seul cheval tirant une péniche déplace trente fois ce qu'un chariot emporte sur la route. Le charbon arrive en ville à moitié prix."
 tech_adastra_spinning_jenny:0 "Filature mécanique"
 tech_adastra_spinning_jenny_desc:0 "Une ouvrière fait tourner huit fuseaux, puis quatre-vingts. Le tissu devient assez bon marché pour qu'on ait deux chemises, et assez bon marché pour que les fileuses n'aient plus d'ouvrage."
 tech_adastra_political_economy:0 "Économie politique"
 tech_adastra_political_economy_desc:0 "Quelqu'un écrit que la richesse d'un pays n'est pas l'or de ses coffres mais le travail de ses habitants. Les ministres mettront cinquante ans à le croire."
 tech_adastra_iron_bridge:0 "Construction en fonte"
 tech_adastra_iron_bridge_desc:0 "Un pont entièrement en fonte, sans une seule pierre. Les charretiers font un détour pour venir le voir, persuadés qu'il finira dans la rivière."
 tech_adastra_balloon:0 "Ballon à air chaud"
 tech_adastra_balloon_desc:0 "Deux hommes s'élèvent au-dessus des toits dans un sac de toile et de fumée. C'est la première fois que quelqu'un quitte le sol sans retomber aussitôt."
 tech_adastra_mass_conscription:0 "Conscription de masse"
 tech_adastra_mass_conscription_desc:0 "L'armée cesse d'être un métier pour devenir une classe d'âge. On ne compte plus les soldats en régiments mais en générations."
 tech_adastra_vaccine_cowpox:0 "Vaccine"
 tech_adastra_vaccine_cowpox_desc:0 "On donne à un enfant la maladie bénigne des vaches pour lui épargner celle qui tue. La variole recule pour la première fois de mémoire d'homme."
 tech_adastra_scientific_expeditions:0 "Expéditions scientifiques"
 tech_adastra_scientific_expeditions_desc:0 "Des navires partent chargés de baromètres, d'herbiers et de dessinateurs plutôt que de soldats. Ils reviennent avec des caisses de plantes que personne ici ne sait nommer."
 tech_adastra_atomic_theory:0 "Théorie atomique"
 tech_adastra_atomic_theory_desc:0 "Les substances se combinent toujours dans les mêmes proportions, jamais dans d'autres. La seule explication tient en une phrase : la matière est faite de grains qu'on ne peut pas couper en deux."
 tech_adastra_steamship:0 "Navire à vapeur"
 tech_adastra_steamship_desc:0 "Un bateau qui remonte le fleuve sans vent et sans rameurs. Les heures d'arrivée cessent d'être des estimations."
 tech_adastra_fraunhofer_lines:0 "Raies du spectre"
 tech_adastra_fraunhofer_lines_desc:0 "En étalant la lumière du soleil, on y trouve des raies noires, toujours aux mêmes endroits. Un jour, elles nous diront de quoi les étoiles sont faites."
 tech_adastra_difference_engine:0 "Machine à différences"
 tech_adastra_difference_engine_desc:0 "Un assemblage de roues dentées qui calcule des tables sans se fatiguer ni se tromper. Les erreurs des tables précédentes avaient déjà coûté des navires."
 tech_adastra_abolition:0 "Abolition de l'esclavage"
 tech_adastra_abolition_desc:0 "On finit par écrire dans la loi qu'un homme ne peut pas être une marchandise. Ceux qui s'y opposaient demandent à être indemnisés de leur perte."
 # --- industrial ---
 tech_adastra_bessemer:0 "Acier Bessemer"
 tech_adastra_bessemer_desc:0 "Souffler de l'air dans la fonte en fusion pour en brûler les impuretés. L'acier passe du luxe au matériau de base, et nos bâtiments montent."
 tech_adastra_thermodynamics:0 "Thermodynamique"
 tech_adastra_thermodynamics_desc:0 "Nos machines fonctionnaient avant que nous sachions pourquoi. Comprendre la chaleur, c'est découvrir que même l'énergie a une comptabilité."
 tech_adastra_fertilizers:0 "Engrais chimiques"
 tech_adastra_fertilizers_desc:0 "Fabriquer la fertilité au lieu de l'attendre. Notre population franchit un plafond que nous croyions posé par la nature elle-même."
 tech_adastra_labour_law:0 "Droit du travail"
 tech_adastra_labour_law_desc:0 "Après un siècle de fumée, il devient évident qu'une machine qui ne se fatigue pas ne doit pas servir de modèle à ceux qui se fatiguent."
 tech_adastra_periodic_table:0 "Table périodique"
 tech_adastra_periodic_table_desc:0 "Ranger les éléments dans un tableau qui laisse des cases vides — et affirmer que ce qui manque existe. On les a trouvés."
 tech_adastra_refrigeration:0 "Réfrigération"
 tech_adastra_refrigeration_desc:0 "Le froid produit à volonté. La viande voyage, et la ville mange autre chose que ce qui pousse à une journée de charrette."
 tech_adastra_germ_theory:0 "Théorie microbienne"
 tech_adastra_germ_theory_desc:0 "La maladie a une cause, elle est vivante, et elle est trop petite pour être vue. Se laver les mains devient un acte médical."
 tech_adastra_universal_suffrage:0 "Suffrage élargi"
 tech_adastra_universal_suffrage_desc:0 "Le droit de vote cesse d'être attaché à la fortune. Ceux qui font tourner les usines pèsent enfin sur ce qu'on en fait."
 tech_adastra_electricity:0 "Réseau électrique"
 tech_adastra_electricity_desc:0 "L'énergie cesse d'être produite là où elle est consommée. L'usine peut désormais s'installer ailleurs que sur une chute d'eau.\n\n§YDébloque la ressource Crédits énergétiques et les districts générateurs. L'entretien des districts, jusque-là payé en minerais, repasse en énergie.§!"
 tech_adastra_social_insurance:0 "Assurance sociale"
 tech_adastra_social_insurance_desc:0 "Cotiser quand on va bien pour être couvert quand on va mal. Le risque cesse d'être individuel : c'est une invention politique, pas médicale."
 tech_adastra_synthetic_dye:0 "Colorants de synthèse"
 tech_adastra_synthetic_dye_desc:0 "Un étudiant rate une préparation de quinine et obtient un violet que personne n'avait jamais porté. La couleur cesse d'être arrachée aux plantes et aux coquillages."
 tech_adastra_spectroscopy:0 "Spectroscopie"
 tech_adastra_spectroscopy_desc:0 "Chaque élément brûle avec ses raies à lui, toujours les mêmes. On pointe l'instrument vers le soleil et on apprend de quoi il est fait, sans y aller."
 tech_adastra_antiseptic_surgery:0 "Chirurgie antiseptique"
 tech_adastra_antiseptic_surgery_desc:0 "On lave les mains et les instruments au phénol, et les plaies cessent de pourrir. Les vieux chirurgiens, fiers d'un tablier raidi par le sang, mettront dix ans à céder."
 tech_adastra_dynamite:0 "Dynamite"
 tech_adastra_dynamite_desc:0 "La nitroglycérine absorbée dans de la terre cesse d'exploser au moindre choc. On perce les montagnes ; l'inventeur lira un jour sa propre nécrologie et n'aimera pas ce qu'il y trouve."
 tech_adastra_general_staff:0 "État-major général"
 tech_adastra_general_staff_desc:0 "Une pièce d'officiers qui préparent des guerres qui n'ont pas commencé, horaires de trains compris. La campagne se gagne désormais avant le premier coup de feu."
 tech_adastra_dynamo:0 "Dynamo"
 tech_adastra_dynamo_desc:0 "Une machine qui rend le courant abondant et régulier au lieu de rare et capricieux. L'électricité quitte la table du laboratoire pour l'atelier."
 tech_adastra_telephone:0 "Téléphone"
 tech_adastra_telephone_desc:0 "Parler à quelqu'un qu'on n'entendrait pas crier. Les premiers abonnés hurlent dans l'appareil par réflexe, comme si la distance devait s'entendre dans la voix."
 tech_adastra_ocean_liner:0 "Paquebot transocéanique"
 tech_adastra_ocean_liner_desc:0 "Coque d'acier, machine compound, départs affichés à l'année d'avance. La traversée cesse d'être une aventure et devient un billet, et des millions de gens l'achètent pour ne pas revenir."
 tech_adastra_machine_gun:0 "Arme automatique"
 tech_adastra_machine_gun_desc:0 "Un homme, une manivelle, six cents balles par minute. Les états-majors la classent d'abord parmi les curiosités coloniales et ne comprendront qu'une génération plus tard, dans la boue."
 tech_adastra_steel_frame:0 "Ossature d'acier"
 tech_adastra_steel_frame_desc:0 "Le bâtiment ne porte plus sur ses murs mais sur une cage d'acier, et l'ascenseur rend le dernier étage désirable. La ville, à court de terrain, se met à pousser vers le haut."
 tech_adastra_colonial_partition:0 "Partage colonial"
 tech_adastra_colonial_partition_desc:0 "Des hommes en redingote tracent des frontières à la règle sur la carte de continents qu'ils n'ont pas vus. Les fleuves et les peuples ne suivront pas ces lignes."
 tech_adastra_radio_waves:0 "Ondes hertziennes"
 tech_adastra_radio_waves_desc:0 "Une étincelle d'un côté de la pièce, une autre qui répond dans une boucle de fil, et rien entre les deux. On lui demande à quoi cela peut servir ; à rien du tout, répond-il."
 tech_adastra_punch_cards:0 "Cartes perforées"
 tech_adastra_punch_cards_desc:0 "Le recensement précédent avait demandé huit ans de dépouillement. Des cartes trouées et des compteurs électriques le font en un : on vient d'apprendre à faire compter une machine."
 tech_adastra_x_rays:0 "Rayons X"
 tech_adastra_x_rays_desc:0 "Une main posée devant l'écran, et ses os apparaissent. Sa femme regarde le cliché et dit qu'elle vient de voir sa propre mort."
 tech_adastra_steam_turbine:0 "Turbine à vapeur"
 tech_adastra_steam_turbine_desc:0 "Au lieu de pousser un piston d'avant en arrière, la vapeur fait simplement tourner. Un petit bateau non invité traverse la revue navale plus vite que tout ce qui aurait pu le rattraper."
 # --- machine ---
 tech_adastra_radio:0 "Radio"
 tech_adastra_radio_desc:0 "Une voix qui entre dans toutes les maisons en même temps. Un peuple peut enfin se penser comme un seul corps - pour le meilleur et pour le pire.\n\n§YDébloque le bâtiment : Station de radiodiffusion.§!"
 tech_adastra_aviation:0 "Moteur à explosion et aviation"
 tech_adastra_aviation_desc:0 "Un moteur assez léger pour quitter le sol. Une génération sépare le premier vol du premier bombardement."
 tech_adastra_antibiotics:0 "Antibiotiques"
 tech_adastra_antibiotics_desc:0 "Une moisissure oubliée sur une paillasse met fin à des millénaires de morts par égratignure. Le hasard, mais un hasard préparé."
 tech_adastra_mass_education:0 "Éducation de masse"
 tech_adastra_mass_education_desc:0 "Instruire tout le monde, pas seulement ceux qui le peuvent. Le réservoir de gens capables de trouver quelque chose vient d'être multiplié par cent.\n\n§YDébloque le bâtiment : École publique.§!"
 tech_adastra_quantum_theory:0 "Théorie des quanta"
 tech_adastra_quantum_theory_desc:0 "L'énergie ne coule pas, elle saute. Le monde à l'échelle de l'atome refuse le bon sens, et il a raison."
 tech_adastra_haber:0 "Synthèse de l'ammoniac"
 tech_adastra_haber_desc:0 "Fabriquer de l'engrais à partir de l'air. La moitié des vivants d'aujourd'hui mangent grâce à ce procédé — et la moitié de sa production a servi à faire des explosifs."
 tech_adastra_plastics:0 "Matières plastiques"
 tech_adastra_plastics_desc:0 "Une matière qui n'imite rien de ce qui existe. On peut lui donner la forme qu'on veut, et elle ne disparaît jamais."
 tech_adastra_epidemiology:0 "Épidémiologie"
 tech_adastra_epidemiology_desc:0 "Retirer la poignée d'une pompe et voir l'épidémie s'arrêter. La statistique devient une arme de santé publique."
 tech_adastra_assembly_line:0 "Chaîne de montage"
 tech_adastra_assembly_line_desc:0 "Découper le travail en gestes si simples que n'importe qui peut les faire. La production explose ; l'ouvrier, lui, ne voit plus jamais l'objet fini."
 tech_adastra_petrochemistry:0 "Pétrochimie"
 tech_adastra_petrochemistry_desc:0 "Des matériaux qui n'existent nulle part dans la nature, produits à la tonne. Notre quotidien devient synthétique presque sans que nous le remarquions."
 tech_adastra_jet_engine:0 "Turboréacteur"
 tech_adastra_jet_engine_desc:0 "Plus d'hélice : on avale l'air devant et on le rejette derrière, plus vite. Le principe est celui de la fusée, en respirant encore."
 tech_adastra_television:0 "Télévision"
 tech_adastra_television_desc:0 "Voir un événement lointain pendant qu'il se produit. Notre planète devient, pour la première fois, un endroit que l'on peut regarder d'un seul coup."
 tech_adastra_relativity:0 "Relativité"
 tech_adastra_relativity_desc:0 "Deux horloges identiques cessent de marquer la même heure dès que l'une voyage. L'univers n'a plus de présent commun, et personne ne sent la différence."
 tech_adastra_atomic_nucleus:0 "Le noyau atomique"
 tech_adastra_atomic_nucleus_desc:0 "On tire de minuscules projectiles sur une feuille d'or, et quelques-uns reviennent en arrière. La matière est presque entièrement vide, avec un point dur au milieu."
 tech_adastra_cosmic_rays:0 "Rayons cosmiques"
 tech_adastra_cosmic_rays_desc:0 "Un physicien monte en ballon à cinq kilomètres, à moitié gelé, pour vérifier que le rayonnement augmente au lieu de faiblir. Quelque chose nous bombarde depuis l'extérieur du monde."
 tech_adastra_expanding_universe:0 "Expansion de l'univers"
 tech_adastra_expanding_universe_desc:0 "Toutes les galaxies s'éloignent, et les plus lointaines vont le plus vite. L'univers a donc un âge, question que nous ne savions pas encore poser."
 tech_adastra_radar:0 "Radar"
 tech_adastra_radar_desc:0 "Envoyer une onde et écouter ce qui revient : les avions apparaissent une demi-heure avant d'être visibles. Des opératrices poussent des jetons sur une carte pendant qu'on décide qui décolle."
 tech_adastra_cryptanalysis:0 "Cryptanalyse mécanique"
 tech_adastra_cryptanalysis_desc:0 "Des machines faites de relais cherchent jour et nuit la clé d'autres machines, dans des baraquements en bois. Ceux qui y travaillent n'en diront rien pendant trente ans."
 tech_adastra_polar_exploration:0 "Exploration polaire"
 tech_adastra_polar_exploration_desc:0 "Les derniers blancs de la carte se referment sur des hommes qui n'en reviennent pas tous. Ce qui rentre au port, ce sont des relevés météo, des roches et des carnets tenus jusqu'à la dernière page."
 tech_adastra_vitamins:0 "Vitamines"
 tech_adastra_vitamins_desc:0 "Certaines maladies ne viennent pas d'un microbe mais d'une absence. Il manquait, dans le riz poli et les rations d'hiver, quelques milligrammes de presque rien."
 tech_adastra_blood_transfusion:0 "Transfusion et banques du sang"
 tech_adastra_blood_transfusion_desc:0 "Trier le sang par groupes, l'empêcher de coaguler, le garder au froid. À l'arrière du front, des bouteilles attendent un blessé qui ne saura jamais le nom du donneur."
 tech_adastra_propaganda:0 "Propagande de masse"
 tech_adastra_propaganda_desc:0 "Les techniques qui vendent du savon servent aussi à faire aimer une guerre. On appelle cela informer, et une affiche coûte moins cher qu'un régiment."
 tech_adastra_total_war:0 "Guerre totale"
 tech_adastra_total_war_desc:0 "Il n'y a plus d'arrière : l'usine, le champ et la ville comptent autant que le front. Les états apprennent à mobiliser un pays entier, et n'oublieront pas comment on fait."
 tech_adastra_reinforced_concrete:0 "Béton armé"
 tech_adastra_reinforced_concrete_desc:0 "De l'acier noyé dans la pierre coulée : on empile enfin les logements au lieu d'étaler la ville. Un immeuble sort de terre en quelques mois, et il tient."
 tech_adastra_tractor:0 "Tracteur agricole"
 tech_adastra_tractor_desc:0 "Une machine laboure en une journée ce qu'un attelage faisait en une semaine. Les chevaux quittent les champs, et avec eux la moitié des bras du village."
 # --- atomic ---
 tech_adastra_fission:0 "Fission contrôlée"
 tech_adastra_fission_desc:0 "Nous avons appris à défaire l'atome avant d'apprendre à nous faire confiance. Toute la suite de notre histoire dépend de l'ordre de ces deux leçons."
 tech_adastra_electronics:0 "Électronique"
 tech_adastra_electronics_desc:0 "Faire porter un raisonnement par un courant. La pensée devient une chose que l'on peut fabriquer en série."
 tech_adastra_vaccination:0 "Vaccination universelle"
 tech_adastra_vaccination_desc:0 "Effacer volontairement une maladie de la surface du monde. C'est la première fois que notre espèce agit à son échelle entière et réussit."
 tech_adastra_radio_astronomy:0 "Radioastronomie"
 tech_adastra_radio_astronomy_desc:0 "Le ciel émet dans des longueurs d'onde qu'aucun œil ne voit. On découvre qu'on regardait l'univers par un trou de serrure."
 tech_adastra_containers:0 "Conteneur normalisé"
 tech_adastra_containers_desc:0 "Une boîte de la même taille partout dans le monde. L'invention la plus ennuyeuse du siècle, et celle qui a le plus changé les échanges."
 tech_adastra_human_rights:0 "Déclaration des droits"
 tech_adastra_human_rights_desc:0 "Écrire ce qui est dû à quelqu'un du seul fait qu'il existe. Le texte n'oblige personne, et pourtant tout le monde s'en réclame."
 tech_adastra_computing:0 "Informatique"
 tech_adastra_computing_desc:0 "Déléguer le calcul à une machine, et découvrir aussitôt des problèmes que nous n'aurions jamais osé poser autrement."
 tech_adastra_cooperation:0 "Coopération internationale"
 tech_adastra_cooperation_desc:0 "Aucune nation ne va dans l'espace toute seule. La dernière technologie avant les étoiles n'est pas une machine : c'est un accord."
 tech_adastra_nuclear_medicine:0 "Médecine nucléaire"
 tech_adastra_nuclear_medicine_desc:0 "Le même atome qui a fait la bombe éclaire l'intérieur d'un corps vivant. On voit la tumeur avant qu'elle ne se voie."
 tech_adastra_sounding_rocket:0 "Fusée-sonde"
 tech_adastra_sounding_rocket_desc:0 "Une fusée de guerre récupérée, une caméra de trente-cinq millimètres sanglée dessus, et le film retrouvé dans le sable du désert. Quelqu'un regarde enfin une photographie de son propre monde vu du dehors."
 tech_adastra_transistor:0 "Transistor"
 tech_adastra_transistor_desc:0 "Un cristal de germanium, deux contacts d'or, et un signal qui ressort plus fort qu'il n'est entré. La chose tient au creux de la main et remplacera des salles entières."
 tech_adastra_decolonization:0 "Décolonisation"
 tech_adastra_decolonization_desc:0 "À minuit un drapeau descend, un autre monte. Dans les semaines qui suivent, des millions de gens marchent dans les deux sens sur la même route : l'indépendance et la partition sont arrivées le même jour."
 tech_adastra_welfare_state:0 "État-providence"
 tech_adastra_welfare_state_desc:0 "Se faire soigner sans sortir d'argent au moment où l'on a mal. Le premier jour, les cabinets se remplissent de gens qui attendaient depuis vingt ans."
 tech_adastra_information_theory:0 "Théorie de l'information"
 tech_adastra_information_theory_desc:0 "Un message cesse d'avoir un sens et devient une quantité. On peut compter l'information comme on compte le charbon, et la transmettre sans en perdre un grain."
 tech_adastra_deterrence:0 "Dissuasion"
 tech_adastra_deterrence_desc:0 "Une deuxième bombe existe désormais, en face. La paix ne tient plus à la confiance mais au calcul froid que personne ne survivrait à commencer."
 tech_adastra_suburbs:0 "Banlieue pavillonnaire"
 tech_adastra_suburbs_desc:0 "Des maisons identiques posées en rangées sur d'anciens champs de pommes de terre, trente par jour. On y entre avec une voiture et un crédit sur trente ans."
 tech_adastra_civil_aviation:0 "Aviation de ligne à réaction"
 tech_adastra_civil_aviation_desc:0 "Quatre heures de gagnées et le silence en cabine. Deux ans plus tard, deux appareils se déchirent en plein vol et l'on apprend qu'un hublot carré fatigue le métal."
 tech_adastra_dna_structure:0 "Structure de l'hérédité"
 tech_adastra_dna_structure_desc:0 "Deux rubans enroulés l'un autour de l'autre : la forme dit d'elle-même comment elle se recopie. La photographie qui l'a révélée avait été prise par quelqu'un d'autre."
 tech_adastra_maser:0 "Émission stimulée"
 tech_adastra_maser_desc:0 "Obliger des molécules à lâcher leur énergie toutes ensemble, en cadence. Le faisceau qui en sort est si régulier qu'il servira d'horloge, puis de règle pour mesurer le ciel."
 tech_adastra_nuclear_submarine:0 "Sous-marin à propulsion nucléaire"
 tech_adastra_nuclear_submarine_desc:0 "Un navire qui n'a plus besoin ni d'air ni de remonter, et qui peut rester dessous des mois. L'équipage cesse de compter les jours et se met à vivre à l'horloge."
 tech_adastra_solar_cell:0 "Cellule photovoltaïque"
 tech_adastra_solar_cell_desc:0 "Une plaque de silicium qui fait du courant avec de la lumière, sans pièce mobile ni bruit. Son premier emploi sérieux est une ligne téléphonique de campagne."
 tech_adastra_desegregation:0 "Fin de la ségrégation"
 tech_adastra_desegregation_desc:0 "Une femme fatiguée refuse de changer de place dans un autobus, et une ville entière va au travail à pied pendant un an. La loi cède avant les habitudes."
 tech_adastra_motorways:0 "Réseau autoroutier"
 tech_adastra_motorways_desc:0 "Des routes sans croisement ni feu rouge, tracées d'un trait à travers le pays. Elles rapprochent tout le monde, sauf les villages qu'elles contournent."
 tech_adastra_magnetic_storage:0 "Mémoire magnétique"
 tech_adastra_magnetic_storage_desc:0 "Cinquante disques qui tournent dans une armoire d'une tonne, et une tête qui va chercher n'importe quelle ligne sans dérouler tout le reste. Une machine sait enfin se souvenir dans le désordre."
 tech_adastra_ballistic_missile:0 "Missile balistique"
 tech_adastra_ballistic_missile_desc:0 "Une fusée assez puissante pour porter une charge d'un continent à l'autre, donc assez puissante pour ne jamais redescendre. Ceux qui la construisent le savent avant tout le monde."
 # --- space ---
 tech_adastra_rocketry:0 "Fusée à étages"
 tech_adastra_rocketry_desc:0 "Abandonner en route ce qui est devenu inutile pour continuer à monter. La leçon dépasse de loin l'ingénierie."
 tech_adastra_remote_sensing:0 "Télédétection"
 tech_adastra_remote_sensing_desc:0 "Voir notre monde depuis l'extérieur. Les ressources que nous cherchions à tâtons apparaissent d'un coup, cartographiées."
 tech_adastra_genetics:0 "Génétique appliquée"
 tech_adastra_genetics_desc:0 "Lire, puis corriger, le texte dont nous sommes faits. Nous devenons la première espèce à relire ses propres instructions."
 tech_adastra_satellites:0 "Satellite artificiel"
 tech_adastra_satellites_desc:0 "Un objet qui tombe assez vite pour manquer la planète à chaque tour. La première chose que nous ayons mise là-haut et qui y soit restée."
 tech_adastra_microprocessor:0 "Microprocesseur"
 tech_adastra_microprocessor_desc:0 "Une machine à calculer entière sur un éclat de silicium. Elle se glisse dans tout, y compris dans ce qui n'avait aucune raison de calculer."
 tech_adastra_networks:0 "Réseaux mondiaux"
 tech_adastra_networks_desc:0 "Relier les machines entre elles jusqu'à ce que la distance ne compte plus. Une planète entière devient une seule conversation, souvent pénible."
 tech_adastra_ecology:0 "Écologie planétaire"
 tech_adastra_ecology_desc:0 "La première photo de notre monde vu de l'extérieur a fait plus pour cette science que trente ans de rapports. On y voit une bille, et rien autour."
 tech_adastra_green_revolution:0 "Révolution verte"
 tech_adastra_green_revolution_desc:0 "Des variétés sélectionnées, de l'engrais, de l'irrigation. Les famines annoncées n'ont pas eu lieu — et le sol a payé la note."
 tech_adastra_superconductivity:0 "Supraconductivité"
 tech_adastra_superconductivity_desc:0 "Refroidir un métal jusqu'à ce que la résistance disparaisse tout à fait — pas presque, tout à fait. Un courant lancé dans l'anneau le soir tourne encore au matin."
 tech_adastra_laser:0 "Laser"
 tech_adastra_laser_desc:0 "Une lumière dont toutes les ondes avancent au pas. Ses inventeurs la présentent eux-mêmes comme une solution qui cherche encore son problème."
 tech_adastra_chaos_theory:0 "Théorie du chaos"
 tech_adastra_chaos_theory_desc:0 "Un météorologue relance son modèle avec trois décimales de moins pour gagner du temps, et obtient un autre climat. Certaines choses sont prévisibles en théorie et pas en pratique."
 tech_adastra_quarks:0 "Modèle des quarks"
 tech_adastra_quarks_desc:0 "Le proton n'est pas indivisible : il en contient trois, et aucun ne sortira jamais seul. La matière a un étage de plus que prévu."
 tech_adastra_plate_tectonics:0 "Tectonique des plaques"
 tech_adastra_plate_tectonics_desc:0 "Le plancher océanique porte, de part et d'autre de la dorsale, des bandes magnétiques symétriques : le sol fabrique du sol, et les continents dérivent. La carte du monde cesse d'être un décor."
 tech_adastra_cosmic_background:0 "Fond diffus cosmologique"
 tech_adastra_cosmic_background_desc:0 "Deux ingénieurs nettoient les fientes de pigeon dans leur antenne pour faire taire un sifflement qui vient de partout. Le bruit reste : c'est la lueur refroidie du commencement."
 tech_adastra_fiber_optics:0 "Fibre optique"
 tech_adastra_fiber_optics_desc:0 "Un fil de verre assez pur pour qu'on voie au travers sur des kilomètres. La conversation passe désormais par la lumière, et le cuivre commence sa retraite."
 tech_adastra_birth_control:0 "Contrôle des naissances"
 tech_adastra_birth_control_desc:0 "Une pilule décide de la date, et la décision change de mains. Les familles rétrécissent, les carrières s'allongent, et personne n'avait prévu à quel point ce serait politique."
 tech_adastra_transplant:0 "Transplantation"
 tech_adastra_transplant_desc:0 "Le cœur d'un mort bat dix-huit jours dans la poitrine d'un vivant. Il faut aussitôt redéfinir le moment exact où quelqu'un cesse d'être quelqu'un."
 tech_adastra_hotline:0 "Dissuasion"
 tech_adastra_hotline_desc:0 "Treize jours pendant lesquels deux camps calculent que frapper le premier ne sauve personne. On installe ensuite une ligne téléphonique directe, parce que le silence coûtait trop cher."
 tech_adastra_deep_sea:0 "Grands fonds"
 tech_adastra_deep_sea_desc:0 "Deux hommes dans une sphère d'acier touchent le fond de la fosse la plus profonde et y voient un poisson plat les regarder. On descend au plus bas du monde la décennie même où l'on commence à en sortir."
 tech_adastra_civil_rights:0 "Droits civiques"
 tech_adastra_civil_rights_desc:0 "Une signature au bas d'une loi ne change pas les gens, mais elle change ce qu'un guichet a le droit de refuser. Le reste se gagne un comptoir à la fois."
 tech_adastra_manned_flight:0 "Vol habité"
 tech_adastra_manned_flight_desc:0 "Une heure quarante-huit pour faire le tour du monde, enfermé dans une bille de métal, sans une commande à toucher. Il redescend, et la planète entière connaît son prénom."
 tech_adastra_lunar_landing:0 "Alunissage"
 tech_adastra_lunar_landing_desc:0 "Le calculateur de bord sature à quelques centaines de mètres du sol et l'équipage se pose à la main, avec vingt secondes de carburant. L'empreinte d'une botte reste dans la poussière, faute de vent pour l'effacer."
 tech_adastra_ion_drive:0 "Propulsion ionique"
 tech_adastra_ion_drive_desc:0 "Une poussée si faible qu'une feuille de papier lui résiste, mais qui ne s'arrête jamais. Sur plusieurs mois, la patience bat la puissance."
 tech_adastra_heat_shield:0 "Bouclier ablatif"
 tech_adastra_heat_shield_desc:0 "Monter est une affaire de moteurs ; redescendre est une affaire de chimie. On fabrique un bouclier qui protège en brûlant, et qui s'use exactement autant qu'il le faut."
 tech_adastra_industrial_robot:0 "Bras manipulateur"
 tech_adastra_industrial_robot_desc:0 "Un bras hydraulique saisit une pièce brûlante et la pose au bon endroit, toute la nuit, sans prime de risque. L'atelier gagne en régularité ce que le quartier perd en embauches."
