l_french:
 # Ad Astra 1.2 - batiments d'epoque. GENERE par tools/gen_age_buildings.py.
 building_adastra_cave:0 "Monument des ancêtres"
 building_adastra_cave_desc:0 "Une pierre dressée à l'écart du campement, couverte de mains peintes. On y vient depuis quatre générations, et chaque génération ajoute la sienne à côté des autres."
 building_adastra_granary:0 "Grenier"
 building_adastra_granary_desc:0 "Le premier bâtiment que nous ayons construit pour un moment qui n'est pas encore arrivé. Une civilisation commence quand elle apprend à se méfier de l'hiver."
 building_adastra_foundry:0 "Fonderie"
 building_adastra_foundry_desc:0 "Le feu y est entretenu jour et nuit. Le fondeur est le seul artisan que personne ne songe à contredire."
 building_adastra_tablet_house:0 "Maison des tablettes"
 building_adastra_tablet_house_desc:0 "On y apprend à tracer les signes, et surtout à les relire. Le premier endroit où le savoir survit à celui qui l'a écrit."
 building_adastra_courthouse:0 "Tribunal"
 building_adastra_courthouse_desc:0 "La loi y est affichée à l'entrée, lisible par quiconque sait lire. Le reste du bâtiment ne sert qu'à tenir cette promesse."
 building_adastra_mill:0 "Moulin"
 building_adastra_mill_desc:0 "Il tourne tant que le vent souffle ou que l'eau descend, sans qu'on lui demande rien. Le premier ouvrier qui ne se plaint jamais - et il moud assez de grain pour nourrir un village entier."
 building_adastra_citadel:0 "Citadelle"
 building_adastra_citadel_desc:0 "Des murs assez épais pour que la population entière puisse y tenir pendant un siège. On espère ne jamais avoir à vérifier."
 building_adastra_university:0 "Université"
 building_adastra_university_desc:0 "Une corporation de maîtres et d'élèves, avec ses propres règles et ses propres querelles. Elle survivra aux royaumes qui l'ont fondée."
 building_adastra_manufactory:0 "Manufacture"
 building_adastra_manufactory_desc:0 "Le bruit s'entend depuis l'autre bout de la ville, et ne s'arrête jamais tout à fait. On y produit en un mois ce qu'un atelier faisait en un an."
 building_adastra_radio:0 "Station de radiodiffusion"
 building_adastra_radio_desc:0 "Un mât, un studio, et soudain la même voix dans chaque cuisine du pays. Personne n'a encore mesuré ce que cela va changer."
 building_adastra_school:0 "École publique"
 building_adastra_school_desc:0 "Gratuite, obligatoire, et vivement contestée. Dans deux générations, plus personne ne se souviendra qu'elle a dû être imposée."
 # Chaine des capitales d'epoque
 building_adastra_seat:0 "Cercle de pierres"
 building_adastra_seat_desc:0 "Pas un batiment : un endroit. On s'y assoit en rond parce que personne n'accepte d'etre derriere un autre."
 building_adastra_seat_bronze:0 "Maison commune"
 building_adastra_seat_bronze_desc:0 "Un toit assez grand pour contenir tout le monde en cas d'orage, et assez central pour qu'on sache ou aller quand ca ne va pas."
 building_adastra_seat_iron:0 "Palais"
 building_adastra_seat_iron_desc:0 "Le pouvoir cesse de se deplacer et se met a habiter quelque part. C'est plus commode, et beaucoup plus dangereux."
 building_adastra_seat_medieval:0 "Cour et chancellerie"
 building_adastra_seat_medieval_desc:0 "Une salle pour trancher, une piece a cote pour ecrire ce qui a ete tranche. La seconde finira par compter davantage que la premiere."
 building_adastra_seat_renaissance:0 "Hotel de ville"
 building_adastra_seat_renaissance_desc:0 "La ville se paie un batiment a elle, avec une horloge dessus. Elle annonce que le temps de tous vaut la peine d'etre affiche."
 building_adastra_seat_steam:0 "Palais du gouvernement"
 building_adastra_seat_steam_desc:0 "On y compte les habitants, on y leve l'impot, on y decide du trace des voies ferrees. L'Etat commence a savoir ce qu'il contient."
 building_adastra_seat_industrial:0 "Ministeres"
 building_adastra_seat_industrial_desc:0 "Le gouvernement ne tient plus dans une salle : il lui faut des couloirs, des services, des archives. Le dernier siege avant l'administration planetaire."
