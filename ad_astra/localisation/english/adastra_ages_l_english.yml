l_english:
 # Ad Astra 1.2 - Les Ages. GENERE par tools/gen_age_techs.py.
 # --- stone ---
 tech_adastra_fire:0 "Mastery of Fire"
 tech_adastra_fire_desc:0 "We did not invent it; we learned not to let it die. The hearth becomes the first place where the night stops winning."
 tech_adastra_stone_tools:0 "Knapped Stone Tools"
 tech_adastra_stone_tools_desc:0 "Strike one stone against another at the right angle. Everything after - the wheel, the foundry, the rocket - descends from that gesture."
 tech_adastra_hunting:0 "Coordinated Hunting"
 tech_adastra_hunting_desc:0 "A beast larger than us does not fall to an individual. It falls to a plan."
 tech_adastra_cave_art:0 "Cave Paintings"
 tech_adastra_cave_art_desc:0 "The first hands pressed to the rock say something simple and vertiginous: we were here, and we wanted it known.\n\n§YUnlocks the building: Monument des ancêtres.§!"
 tech_adastra_language:0 "Articulate Language"
 tech_adastra_language_desc:0 "Knowledge stops dying with the one who carries it. It is the single invention that makes every other one possible.\n\n§YAllows the seat of power to be upgraded to a Common House.§!"
 tech_adastra_seasons:0 "Reading the Seasons"
 tech_adastra_seasons_desc:0 "The sky always comes back to the same place. Whoever notices that knows when the herds pass, and becomes indispensable."
 tech_adastra_pigments:0 "Earths and Pigments"
 tech_adastra_pigments_desc:0 "Grind the ochre, mix it with fat, obtain a colour that holds. This is chemistry, even if nobody has a word for it yet."
 tech_adastra_cordage:0 "Cordage and Basketry"
 tech_adastra_cordage_desc:0 "Twist fibres until they hold better together than apart. The knot is the first machine."
 tech_adastra_shelter:0 "Built Shelter"
 tech_adastra_shelter_desc:0 "We stop looking for a cave and start making one. The difference sounds small. It is not."
 tech_adastra_burial:0 "Burial"
 tech_adastra_burial_desc:0 "To lay a body down with flowers and tools is to claim that something continues. No animal makes that wager."
 # --- bronze ---
 tech_adastra_agriculture:0 "Agriculture"
 tech_adastra_agriculture_desc:0 "Stop following the food and make it come to you. The price: we will never move again.\n\n§YUnlocks the building: Grenier.§!"
 tech_adastra_pottery:0 "Pottery"
 tech_adastra_pottery_desc:0 "A vessel is time held in reserve. This year's harvest can now feed the next."
 tech_adastra_bronze:0 "Bronze Metallurgy"
 tech_adastra_bronze_desc:0 "Two mediocre ores, melted together, yield a metal neither knew how to be. Metallurgy begins with that surprise.\n\n§YUnlocks the building: Fonderie. Unlocks the Alloys resource: without metallurgy, an empire produces none.§!"
 tech_adastra_writing:0 "Writing"
 tech_adastra_writing_desc:0 "Born to count sacks of grain, it will end up carrying our laws, our poems and our equations. No tool has ever so outgrown its purpose.\n\n§YUnlocks the building: Maison des tablettes.§!"
 tech_adastra_first_city:0 "The First City"
 tech_adastra_first_city_desc:0 "Enough people in one place that some can stop growing their own food. This is where the artisan, the priest and the tax collector are born.\n\n§YAllows the seat of power to be upgraded to a Palace.§!"
 tech_adastra_calendar:0 "Lunar Calendar"
 tech_adastra_calendar_desc:0 "Count the moons until the count comes out right. The year stops being an annual surprise."
 tech_adastra_measures:0 "Weights and Measures"
 tech_adastra_measures_desc:0 "Two people trading must first agree on what « this much » means. All commerce fits inside that sentence."
 tech_adastra_irrigation:0 "Irrigation"
 tech_adastra_irrigation_desc:0 "Digging a canal is deciding where the water goes. The first power a society holds over a landscape."
 tech_adastra_priesthood:0 "Priesthood"
 tech_adastra_priesthood_desc:0 "A handful of people stop farming. The others feed them, in exchange for an explanation of the world."
 tech_adastra_domestication:0 "Animal Domestication"
 tech_adastra_domestication_desc:0 "The animal stops being prey and becomes an associate. It carries, it pulls, it gives milk, and it eats our leftovers."
 # --- iron ---
 tech_adastra_iron:0 "Ironworking"
 tech_adastra_iron_desc:0 "The ore is everywhere, no longer reserved to the trade routes of kings. Iron democratises the tool as much as the weapon."
 tech_adastra_wheel:0 "The Wheel and the Road"
 tech_adastra_wheel_desc:0 "The wheel alone is useless; it needed a surface worthy of it. Without each other, we stay home."
 tech_adastra_law:0 "Code of Laws"
 tech_adastra_law_desc:0 "Carving the rule in stone removes it from the mood of whoever governs. The advance is not severity: it is predictability.\n\n§YUnlocks the building: Tribunal. Allows the seat of power to be upgraded to a Court and Chancery.§!"
 tech_adastra_coinage:0 "Minted Coinage"
 tech_adastra_coinage_desc:0 "A disc of metal guaranteed by an authority. It is worth nothing, and that is precisely why it is worth everything."
 tech_adastra_astronomy:0 "Naked-Eye Astronomy"
 tech_adastra_astronomy_desc:0 "With no instrument, only generations of patience, we chart the sky. It will take a very long time to understand that those are places."
 tech_adastra_geometry:0 "Geometry"
 tech_adastra_geometry_desc:0 "Measuring a field again after the flood without an argument. Rigour is born from a boundary dispute."
 tech_adastra_glass:0 "Glassmaking"
 tech_adastra_glass_desc:0 "Sand heated until it turns transparent. We do not yet understand why; we already know what to do with it."
 tech_adastra_aqueduct:0 "Aqueduct"
 tech_adastra_aqueduct_desc:0 "Bring the clean water to the city instead of the city to the water. The slope is calculated to a finger's width over dozens of leagues."
 tech_adastra_alphabet:0 "The Alphabet"
 tech_adastra_alphabet_desc:0 "Thirty signs instead of a thousand. Writing stops being a profession and becomes a skill."
 tech_adastra_standing_army:0 "Standing Army"
 tech_adastra_standing_army_desc:0 "Soldiers who do not go back to the fields when the season ends. It is expensive, and it is what makes the difference."
 # --- medieval ---
 tech_adastra_crop_rotation:0 "Three-Field Rotation"
 tech_adastra_crop_rotation_desc:0 "Letting part of the land rest yields more than forcing all of it. A lesson every civilisation relearns the hard way."
 tech_adastra_mills:0 "Water and Wind Mills"
 tech_adastra_mills_desc:0 "For the first time, work is done without muscle - neither ours nor an animal's. The river asks for no wages.\n\n§YUnlocks the building: Moulin.§!"
 tech_adastra_stone_architecture:0 "Stone Architecture"
 tech_adastra_stone_architecture_desc:0 "The arch, the vault, the buttress: three ways of persuading stone to stand in mid-air. Our cities stop burning down every twenty years.\n\n§YUnlocks the building: Citadelle. Allows the seat of power to be upgraded to a Town Hall.§!"
 tech_adastra_scholasticism:0 "Scholasticism"
 tech_adastra_scholasticism_desc:0 "A method for arguing cleanly: thesis, objection, reply. It will look rigid later, but it teaches a people how to reason aloud.\n\n§YUnlocks the building: Université.§!"
 tech_adastra_guilds:0 "Guilds"
 tech_adastra_guilds_desc:0 "The craft is passed on, protected and priced. Quality becomes a collective standard rather than an isolated talent."
 tech_adastra_algebra:0 "Algebra and the Zero"
 tech_adastra_algebra_desc:0 "A sign for what is not there. The idea is so hard that it took centuries to accept, and every calculation depends on it."
 tech_adastra_optics:0 "Optics and Lenses"
 tech_adastra_optics_desc:0 "A curved glass corrects a failing eye. A scholar of sixty can keep reading: knowledge gains twenty years."
 tech_adastra_heavy_plough:0 "Heavy Plough"
 tech_adastra_heavy_plough_desc:0 "A blade that turns the heavy northern soil instead of scratching it. Whole regions become farmland."
 tech_adastra_hospices:0 "Hospices"
 tech_adastra_hospices_desc:0 "A place where the sick are kept instead of pushed away. We cannot cure yet; we can already watch over."
 tech_adastra_cartography:0 "Cartography"
 tech_adastra_cartography_desc:0 "Draw a coast you have sailed, and find it again ten years later. A map is a memory that can be handed on."
 # --- renaissance ---
 tech_adastra_printing:0 "The Printing Press"
 tech_adastra_printing_desc:0 "Copying an idea now costs almost nothing. Those who lived off the monopoly of knowledge do not yet grasp what has happened to them.\n\n§YAllows the seat of power to be upgraded to a Government House.§!"
 tech_adastra_experimental_method:0 "The Experimental Method"
 tech_adastra_experimental_method_desc:0 "No longer asking what ought to be true, but what survives the test. Our civilisation has just agreed that it can be wrong."
 tech_adastra_anatomy:0 "Anatomy"
 tech_adastra_anatomy_desc:0 "Looking inside the body without turning away. Medicine stops being a consolation and becomes a discipline."
 tech_adastra_mechanics:0 "Perspective and Mechanics"
 tech_adastra_mechanics_desc:0 "The same geometry paints a nave and computes a gear train. Art and machine briefly share a workshop."
 tech_adastra_banking:0 "Banking and Credit"
 tech_adastra_banking_desc:0 "Lending money you do not yet have against a share of what it will make. Any undertaking too large for one lifetime becomes possible."
 tech_adastra_chemistry:0 "Chemistry of Substances"
 tech_adastra_chemistry_desc:0 "Alchemy went looking for gold and found method instead. Weigh before, weigh after, and write down what changed."
 tech_adastra_metallurgy_casting:0 "Casting and Artillery"
 tech_adastra_metallurgy_casting_desc:0 "Cast metal in a single piece strong enough to hold an explosion. Walls stop being an answer."
 tech_adastra_clockwork:0 "Clockwork"
 tech_adastra_clockwork_desc:0 "A mechanism that cuts the day into equal parts without consulting the sun. The first object that imposes its rhythm on people."
 tech_adastra_double_entry:0 "Double-Entry Bookkeeping"
 tech_adastra_double_entry_desc:0 "Every sum is written twice, in two places. If the columns do not balance, someone lied or made a mistake."
 tech_adastra_navigation:0 "Deep-Sea Navigation"
 tech_adastra_navigation_desc:0 "Lose sight of the coast and still know where you are. The first time we leave without a landmark — the second time will be upward."
 # --- steam ---
 tech_adastra_steam_engine:0 "The Steam Engine"
 tech_adastra_steam_engine_desc:0 "A force that does not sleep, eat or revolt. What a people can produce stops being limited by how many arms it has.\n\n§YUnlocks the building: Manufacture. Unlocks the Consumer Goods resource: the first production in series.§!"
 tech_adastra_coal:0 "Coal and Coke"
 tech_adastra_coal_desc:0 "We are burning forests millions of years old. Nobody is yet asking what happens when they run out."
 tech_adastra_railways:0 "Railways"
 tech_adastra_railways_desc:0 "Two cities three weeks apart end up a day apart. The whole country changes size without moving an inch."
 tech_adastra_telegraph:0 "The Telegraph"
 tech_adastra_telegraph_desc:0 "For the first time, a message outruns the messenger. Distance has just lost its first battle."
 tech_adastra_sanitation:0 "Public Sanitation"
 tech_adastra_sanitation_desc:0 "Sewers and clean water will save more lives than all our physicians combined. The most decisive advance is also the least glamorous."
 tech_adastra_gas_lighting:0 "Gas Lighting"
 tech_adastra_gas_lighting_desc:0 "Night retreats from the streets and the workshops. The working day stops being limited by the sun — for better and for worse."
 tech_adastra_electromagnetism:0 "Electromagnetism"
 tech_adastra_electromagnetism_desc:0 "A needle moves when a current passes nearby. Twenty years later, that same fact explains light."
 tech_adastra_machine_tools:0 "Machine Tools"
 tech_adastra_machine_tools_desc:0 "A machine that makes the parts of another machine, to a hundredth. This is where industry stops depending on the knack of a hand."
 tech_adastra_census:0 "The Census"
 tech_adastra_census_desc:0 "Count your inhabitants one by one, with their age and trade. A state that knows how many hands it has stops governing by guesswork."
 tech_adastra_anesthesia:0 "Anaesthesia"
 tech_adastra_anesthesia_desc:0 "Surgery stops being a race against pain. The surgeon can finally take his time, and it is that time that saves."
 # --- industrial ---
 tech_adastra_assembly_line:0 "The Assembly Line"
 tech_adastra_assembly_line_desc:0 "Splitting work into gestures so simple anyone can perform them. Output explodes; the worker never sees the finished object again."
 tech_adastra_bessemer:0 "Bessemer Steel"
 tech_adastra_bessemer_desc:0 "Blowing air through molten iron to burn out its impurities. Steel goes from luxury to staple, and our buildings start to climb."
 tech_adastra_thermodynamics:0 "Thermodynamics"
 tech_adastra_thermodynamics_desc:0 "Our engines worked before we understood why. Understanding heat means discovering that even energy keeps books."
 tech_adastra_fertilizers:0 "Chemical Fertilizers"
 tech_adastra_fertilizers_desc:0 "Manufacturing fertility instead of waiting for it. Our population breaks through a ceiling we believed nature itself had set."
 tech_adastra_labour_law:0 "Labour Law"
 tech_adastra_labour_law_desc:0 "After a century of smoke, it becomes obvious that a machine which never tires is no model for those who do."
 tech_adastra_photography:0 "Photography"
 tech_adastra_photography_desc:0 "Fix an image without drawing it. For the first time a face crosses time without passing through a painter's hand."
 tech_adastra_periodic_table:0 "The Periodic Table"
 tech_adastra_periodic_table_desc:0 "Arrange the elements in a table that leaves empty squares — and claim that what is missing exists. They were found."
 tech_adastra_refrigeration:0 "Refrigeration"
 tech_adastra_refrigeration_desc:0 "Cold made on demand. Meat travels, and the city eats something other than whatever grows a cart-day away."
 tech_adastra_germ_theory:0 "Germ Theory"
 tech_adastra_germ_theory_desc:0 "Disease has a cause, it is alive, and it is too small to see. Washing your hands becomes a medical act."
 tech_adastra_universal_suffrage:0 "Widened Suffrage"
 tech_adastra_universal_suffrage_desc:0 "The vote stops being tied to wealth. The people who keep the factories running finally weigh on what is done with them."
 # --- machine ---
 tech_adastra_electricity:0 "The Electrical Grid"
 tech_adastra_electricity_desc:0 "Energy stops being produced where it is consumed. The factory can finally stand somewhere other than beside a waterfall.\n\n§YUnlocks the Energy Credits resource and generator districts. District upkeep, paid in minerals until now, goes back to energy.§!"
 tech_adastra_radio:0 "Radio"
 tech_adastra_radio_desc:0 "One voice entering every home at once. A people can finally think of itself as a single body - for better and for worse.\n\n§YUnlocks the building: Station de radiodiffusion.§!"
 tech_adastra_aviation:0 "Internal Combustion and Aviation"
 tech_adastra_aviation_desc:0 "An engine light enough to leave the ground. One generation separates the first flight from the first bombing run."
 tech_adastra_antibiotics:0 "Antibiotics"
 tech_adastra_antibiotics_desc:0 "A mould forgotten on a bench ends millennia of dying from a scratch. Chance - but prepared chance."
 tech_adastra_mass_education:0 "Mass Education"
 tech_adastra_mass_education_desc:0 "Teaching everyone, not only those who can afford it. The pool of people able to discover something has just multiplied a hundredfold.\n\n§YUnlocks the building: École publique.§!"
 tech_adastra_quantum_theory:0 "Quantum Theory"
 tech_adastra_quantum_theory_desc:0 "Energy does not flow, it jumps. The world at the scale of the atom refuses common sense, and it is right."
 tech_adastra_haber:0 "Ammonia Synthesis"
 tech_adastra_haber_desc:0 "Make fertilizer out of the air. Half the people alive today eat because of this process — and half its output went into explosives."
 tech_adastra_plastics:0 "Plastics"
 tech_adastra_plastics_desc:0 "A material that imitates nothing that exists. It can be given any shape you like, and it never goes away."
 tech_adastra_social_insurance:0 "Social Insurance"
 tech_adastra_social_insurance_desc:0 "Pay in while you are well so you are covered when you are not. Risk stops being individual: this is a political invention, not a medical one."
 tech_adastra_epidemiology:0 "Epidemiology"
 tech_adastra_epidemiology_desc:0 "Take the handle off a pump and watch the epidemic stop. Statistics become a public health weapon."
 # --- atomic ---
 tech_adastra_fission:0 "Controlled Fission"
 tech_adastra_fission_desc:0 "We learned to split the atom before we learned to trust ourselves. Everything that follows depends on the order of those two lessons."
 tech_adastra_electronics:0 "Electronics"
 tech_adastra_electronics_desc:0 "Making a current carry an argument. Thought becomes something you can manufacture in bulk."
 tech_adastra_petrochemistry:0 "Petrochemistry"
 tech_adastra_petrochemistry_desc:0 "Materials found nowhere in nature, produced by the tonne. Daily life turns synthetic almost without our noticing."
 tech_adastra_vaccination:0 "Universal Vaccination"
 tech_adastra_vaccination_desc:0 "Deliberately erasing a disease from the world. It is the first time our species acts at its own full scale and succeeds."
 tech_adastra_television:0 "Television"
 tech_adastra_television_desc:0 "Watching a distant event as it happens. Our world becomes, for the first time, a place you can take in at a glance."
 tech_adastra_radio_astronomy:0 "Radio Astronomy"
 tech_adastra_radio_astronomy_desc:0 "The sky broadcasts on wavelengths no eye can see. We discover we had been watching the universe through a keyhole."
 tech_adastra_jet_engine:0 "The Jet Engine"
 tech_adastra_jet_engine_desc:0 "No more propeller: swallow the air in front and throw it out behind, faster. The principle is the rocket's, still breathing."
 tech_adastra_containers:0 "The Standard Container"
 tech_adastra_containers_desc:0 "A box of the same size everywhere in the world. The most boring invention of the century, and the one that changed trade the most."
 tech_adastra_green_revolution:0 "The Green Revolution"
 tech_adastra_green_revolution_desc:0 "Selected varieties, fertilizer, irrigation. The announced famines did not happen — and the soil paid the bill."
 tech_adastra_human_rights:0 "Declaration of Rights"
 tech_adastra_human_rights_desc:0 "Write down what is owed to someone by the sole fact of existing. The text binds no one, and yet everyone invokes it."
 # --- space ---
 tech_adastra_computing:0 "Computing"
 tech_adastra_computing_desc:0 "Handing calculation to a machine, and immediately discovering problems we would never have dared to pose otherwise."
 tech_adastra_rocketry:0 "Multistage Rocketry"
 tech_adastra_rocketry_desc:0 "Discarding what has become dead weight in order to keep climbing. The lesson far outlives the engineering."
 tech_adastra_remote_sensing:0 "Remote Sensing"
 tech_adastra_remote_sensing_desc:0 "Seeing our world from outside it. The resources we groped for appear all at once, mapped."
 tech_adastra_genetics:0 "Applied Genetics"
 tech_adastra_genetics_desc:0 "Reading, then editing, the text we are made of. We become the first species to proofread its own instructions."
 tech_adastra_cooperation:0 "International Cooperation"
 tech_adastra_cooperation_desc:0 "No nation reaches space alone. The last technology before the stars is not a machine: it is an agreement."
 tech_adastra_nuclear_medicine:0 "Nuclear Medicine"
 tech_adastra_nuclear_medicine_desc:0 "The same atom that made the bomb lights up the inside of a living body. We see the tumour before it shows itself."
 tech_adastra_satellites:0 "The Artificial Satellite"
 tech_adastra_satellites_desc:0 "An object falling fast enough to miss the planet on every pass. The first thing we put up there that stayed."
 tech_adastra_microprocessor:0 "The Microprocessor"
 tech_adastra_microprocessor_desc:0 "A whole calculating machine on a chip of silicon. It slips into everything, including things that had no reason to compute."
 tech_adastra_networks:0 "Global Networks"
 tech_adastra_networks_desc:0 "Wire the machines together until distance stops counting. A whole planet becomes a single conversation, often a tiresome one."
 tech_adastra_ecology:0 "Planetary Ecology"
 tech_adastra_ecology_desc:0 "The first photograph of our world seen from outside did more for this science than thirty years of reports. It shows a marble, and nothing around it."
