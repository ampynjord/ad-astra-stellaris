l_english:
 # Ad Astra 1.2 - Les Ages. GENERE par tools/gen_age_techs.py.
 # --- stone ---
 tech_adastra_fire:0 "Mastery of Fire"
 tech_adastra_fire_desc:0 "We did not invent it; we learned not to let it die. The hearth becomes the first place where the night stops winning."
 tech_adastra_stone_tools:0 "Knapped Stone Tools"
 tech_adastra_stone_tools_desc:0 "Strike one stone against another at the right angle. Everything after - the wheel, the foundry, the rocket - descends from that gesture."
 tech_adastra_hunting:0 "Coordinated Hunting"
 tech_adastra_hunting_desc:0 "A beast larger than us does not fall to an individual. It falls to a plan."
 tech_adastra_cave_art:0 "Cave Paintings"
 tech_adastra_cave_art_desc:0 "The first hands pressed to the rock say something simple and vertiginous: we were here, and we wanted it known.\n\n§YUnlocks the building: Ancestral Monument.§!"
 tech_adastra_language:0 "Articulate Language"
 tech_adastra_language_desc:0 "Knowledge stops dying with the one who carries it. It is the single invention that makes every other one possible.\n\n§YAllows the seat of power to be upgraded to a Common House.§!"
 tech_adastra_seasons:0 "Reading the Seasons"
 tech_adastra_seasons_desc:0 "The sky always comes back to the same place. Whoever notices that knows when the herds pass, and becomes indispensable."
 tech_adastra_pigments:0 "Earths and Pigments"
 tech_adastra_pigments_desc:0 "Grind the ochre, mix it with fat, obtain a colour that holds. This is chemistry, even if nobody has a word for it yet."
 tech_adastra_cordage:0 "Cordage and Basketry"
 tech_adastra_cordage_desc:0 "Twist fibres until they hold better together than apart. The knot is the first machine."
 tech_adastra_shelter:0 "Built Shelter"
 tech_adastra_shelter_desc:0 "We stop looking for a cave and start making one. The difference sounds small. It is not."
 tech_adastra_burial:0 "Burial"
 tech_adastra_burial_desc:0 "To lay a body down with flowers and tools is to claim that something continues. No animal makes that wager."
 tech_adastra_cooking:0 "Cooking"
 tech_adastra_cooking_desc:0 "Fire does part of the digesting for us. The same carcass yields more, and the body spends the saved energy elsewhere."
 tech_adastra_clan:0 "Clan and Kinship"
 tech_adastra_clan_desc:0 "Knowing whose cousin is whose decides who helps whom. It is the first institution, and it needs no building."
 tech_adastra_hafting:0 "Hafted Point"
 tech_adastra_hafting_desc:0 "Binding stone to wood multiplies the arm. Joining two materials beats the better of the two."
 tech_adastra_lunar_count:0 "Lunar Tally"
 tech_adastra_lunar_count_desc:0 "Twenty-eight notches on a bone. Someone understood that time can be cut up, and that a count fits in the hand."
 tech_adastra_storytelling:0 "Story and Telling"
 tech_adastra_storytelling_desc:0 "What is told at night outlives the one who lived it. Memory stops being individual and becomes common property."
 tech_adastra_grinding:0 "Quern and Grinding"
 tech_adastra_grinding_desc:0 "Crushing the grain makes edible what was not. A hollow stone and a round one feed more than a good hunt."
 tech_adastra_weaving:0 "Weaving"
 tech_adastra_weaving_desc:0 "Crossing threads in a repeating order. It is the first time we manufacture a material that did not exist."
 tech_adastra_bow:0 "Atlatl and Bow"
 tech_adastra_bow_desc:0 "Killing at a distance changes everything: the hunter no longer shares his prey's risk. War will inherit this."
 tech_adastra_exchange:0 "Long-Distance Exchange"
 tech_adastra_exchange_desc:0 "Obsidian three hundred kilometres from its source. Nobody travelled that far; it passed from hand to hand."
 tech_adastra_canoe:0 "Dugout and Coasting"
 tech_adastra_canoe_desc:0 "A hollowed trunk, and the river becomes a road. The first time we travel on an element that does not carry us."
 tech_adastra_salt:0 "Salt and Keeping"
 tech_adastra_salt_desc:0 "What is salted does not rot. At last we eat in winter what we took in summer: time itself becomes a store."
 tech_adastra_village:0 "Village and Granary"
 tech_adastra_village_desc:0 "We no longer follow the herd; we wait for it. That calls for somewhere to put what we keep, and someone to watch it."
 tech_adastra_agriculture:0 "Agriculture"
 tech_adastra_agriculture_desc:0 "Stop following the food and make it come to you. The price: we will never move again.\n\n§YUnlocks the building: Granary.§!"
 tech_adastra_pottery:0 "Pottery"
 tech_adastra_pottery_desc:0 "A vessel is time held in reserve. This year's harvest can now feed the next."
 tech_adastra_domestication:0 "Animal Domestication"
 tech_adastra_domestication_desc:0 "The animal stops being prey and becomes an associate. It carries, it pulls, it gives milk, and it eats our leftovers."
 # --- bronze ---
 tech_adastra_bronze:0 "Bronze Metallurgy"
 tech_adastra_bronze_desc:0 "Two mediocre ores, melted together, yield a metal neither knew how to be. Metallurgy begins with that surprise.\n\n§YUnlocks the building: Foundry. Unlocks the Alloys resource: without metallurgy, an empire produces none.§!"
 tech_adastra_writing:0 "Writing"
 tech_adastra_writing_desc:0 "Born to count sacks of grain, it will end up carrying our laws, our poems and our equations. No tool has ever so outgrown its purpose.\n\n§YUnlocks the building: House of Tablets.§!"
 tech_adastra_first_city:0 "The First City"
 tech_adastra_first_city_desc:0 "Enough people in one place that some can stop growing their own food. This is where the artisan, the priest and the tax collector are born.\n\n§YAllows the seat of power to be upgraded to a Palace.§!"
 tech_adastra_calendar:0 "Lunar Calendar"
 tech_adastra_calendar_desc:0 "Count the moons until the count comes out right. The year stops being an annual surprise."
 tech_adastra_measures:0 "Weights and Measures"
 tech_adastra_measures_desc:0 "Two people trading must first agree on what « this much » means. All commerce fits inside that sentence."
 tech_adastra_irrigation:0 "Irrigation"
 tech_adastra_irrigation_desc:0 "Digging a canal is deciding where the water goes. The first power a society holds over a landscape."
 tech_adastra_priesthood:0 "Priesthood"
 tech_adastra_priesthood_desc:0 "A handful of people stop farming. The others feed them, in exchange for an explanation of the world."
 tech_adastra_wheel:0 "The Wheel and the Road"
 tech_adastra_wheel_desc:0 "The wheel alone is useless; it needed a surface worthy of it. Without each other, we stay home."
 tech_adastra_sail:0 "River Sail"
 tech_adastra_sail_desc:0 "The wind goes upriver, the current comes back down: at last a boat makes the round trip loaded. The first engine costs nothing to feed."
 tech_adastra_plough:0 "The Ard"
 tech_adastra_plough_desc:0 "A share dragged by an animal opens in a morning what a hoe turns in three days. The soil gives way faster than arms tire."
 tech_adastra_brewing:0 "Brewing"
 tech_adastra_brewing_desc:0 "Soaked barley ferments and turns drinkable where the water is not. Work gangs are paid in bread and beer, and nobody finds that odd."
 tech_adastra_kingship:0 "Kingship"
 tech_adastra_kingship_desc:0 "One man stops being first among equals and becomes the one others answer to. He has his name stamped into the bricks of the wall he orders built."
 tech_adastra_fired_brick:0 "Fired Brick"
 tech_adastra_fired_brick_desc:0 "Sun-dried brick melts in the rain; kiln-fired brick lasts centuries. Firewood costs so much that it goes first to drains and quays."
 tech_adastra_lever:0 "Lever and Ramp"
 tech_adastra_lever_desc:0 "Nothing makes the stone lighter; we trade its weight for distance. Thirty men and a beam shift what would crush a hundred."
 tech_adastra_lost_wax:0 "Lost-Wax Casting"
 tech_adastra_lost_wax_desc:0 "Model in wax, coat in clay, heat it: the wax runs out and the bronze takes its exact place. The mould serves once, and must be broken to see what you made."
 tech_adastra_sexagesimal:0 "Sexagesimal Numbers"
 tech_adastra_sexagesimal_desc:0 "Counting by sixty, because sixty splits into two, three, four, five and six with nothing left over. The scribe who settles this will never know we keep it forever."
 tech_adastra_faience:0 "Faience and Glaze"
 tech_adastra_faience_desc:0 "Ground sand, a little ash, and the surface comes out of the kiln blue and glassy. Nobody understands why; the recipe is written down and kept."
 tech_adastra_shield_wall:0 "Shield Wall"
 tech_adastra_shield_wall_desc:0 "Six ranks stepping together, shields locked, spears passed over the top. One man's courage matters less than not breaking the line."
 tech_adastra_empire:0 "The First Empire"
 tech_adastra_empire_desc:0 "A king subdues the neighbouring cities, leaves their gods standing, and appoints his own governors. Commanding beyond three days' march is an entirely new problem."
 tech_adastra_trade_colony:0 "Merchant Outpost"
 tech_adastra_trade_colony_desc:0 "Families settle a month's caravan from home, in a quarter set aside for them, to sell tin and buy silver. They write home more often than kings write their annals."
 tech_adastra_chariot:0 "War Chariot"
 tech_adastra_chariot_desc:0 "A light box on two spoked wheels, two horses, a driver and an archer. It costs a village's yearly income, and it decides battles."
 tech_adastra_surveying:0 "Surveying"
 tech_adastra_surveying_desc:0 "The flood wipes out the field boundaries every year, and a knotted rope has to put them back. Measuring the world begins as a quarrel over property lines."
 tech_adastra_medicine:0 "Medicine and Prescriptions"
 tech_adastra_medicine_desc:0 "A scroll describes forty-eight injuries, skull to chest, and says for each whether to treat, to attempt, or to leave alone. Knowing what you cannot cure is already knowledge."
 tech_adastra_dyes:0 "Dye and Purple"
 tech_adastra_dyes_desc:0 "Ten thousand shellfish for a single cloak, and the workshop stinks a mile off. Colour becomes a rank you wear on your back."
 tech_adastra_diplomacy:0 "Treaty and Embassy"
 tech_adastra_diplomacy_desc:0 "Two empires that failed to crush each other carve the same peace, each in its own tongue, and swap the copies. It also promises to hand back each other's runaways."
 # --- iron ---
 tech_adastra_iron:0 "Ironworking"
 tech_adastra_iron_desc:0 "The ore is everywhere, no longer reserved to the trade routes of kings. Iron democratises the tool as much as the weapon."
 tech_adastra_law:0 "Code of Laws"
 tech_adastra_law_desc:0 "Carving the rule in stone removes it from the mood of whoever governs. The advance is not severity: it is predictability.\n\n§YUnlocks the building: Courthouse. Allows the seat of power to be upgraded to a Court and Chancery.§!"
 tech_adastra_coinage:0 "Minted Coinage"
 tech_adastra_coinage_desc:0 "A disc of metal guaranteed by an authority. It is worth nothing, and that is precisely why it is worth everything."
 tech_adastra_astronomy:0 "Naked-Eye Astronomy"
 tech_adastra_astronomy_desc:0 "With no instrument, only generations of patience, we chart the sky. It will take a very long time to understand that those are places."
 tech_adastra_geometry:0 "Geometry"
 tech_adastra_geometry_desc:0 "Measuring a field again after the flood without an argument. Rigour is born from a boundary dispute."
 tech_adastra_glass:0 "Glassmaking"
 tech_adastra_glass_desc:0 "Sand heated until it turns transparent. We do not yet understand why; we already know what to do with it."
 tech_adastra_aqueduct:0 "Aqueduct"
 tech_adastra_aqueduct_desc:0 "Bring the clean water to the city instead of the city to the water. The slope is calculated to a finger's width over dozens of leagues."
 tech_adastra_alphabet:0 "The Alphabet"
 tech_adastra_alphabet_desc:0 "Thirty signs instead of a thousand. Writing stops being a profession and becomes a skill."
 tech_adastra_standing_army:0 "Standing Army"
 tech_adastra_standing_army_desc:0 "Soldiers who do not go back to the fields when the season ends. It is expensive, and it is what makes the difference."
 tech_adastra_star_catalogue:0 "The Star Catalogue"
 tech_adastra_star_catalogue_desc:0 "Eight hundred and fifty stars, each with its position and its brightness, written down one by one. Comparing them with records a hundred and fifty years old, the author notices the whole sky has shifted."
 tech_adastra_atomism:0 "Atomism"
 tech_adastra_atomism_desc:0 "A philosopher argues that cutting matter often enough ends against something uncuttable. He has no proof, and he is right for two thousand years."
 tech_adastra_water_clock:0 "Water Clock"
 tech_adastra_water_clock_desc:0 "In court each speaker is given his measure of water; when the vessel empties, he stops. Duration becomes a quantity that can be shared out."
 tech_adastra_pulley:0 "Lever and Pulley"
 tech_adastra_pulley_desc:0 "One man hauls a loaded ship up the beach while a crowd refuses to believe it. Force is not created; it is spread out."
 tech_adastra_lodestone:0 "Lodestone"
 tech_adastra_lodestone_desc:0 "A spoon of ore set on a polished plate always halts facing the same way. At first we use it to align houses, not ships."
 tech_adastra_cavalry:0 "Mounted Cavalry"
 tech_adastra_cavalry_desc:0 "Ride the horse instead of harnessing it. A rider covers in a day what a foot soldier needs three to walk, and arrives still able to fight."
 tech_adastra_tax_register:0 "Census"
 tech_adastra_tax_register_desc:0 "A scribe goes door to door and writes down the fields, the oxen and the sons old enough to carry a spear. What is counted can be taxed, fed, called up."
 tech_adastra_clinical_medicine:0 "Observational Medicine"
 tech_adastra_clinical_medicine_desc:0 "The physician writes down what he sees day after day instead of asking which god he offended. The fever is unchanged; the way of watching it is not."
 tech_adastra_philosophy:0 "School of Philosophy"
 tech_adastra_philosophy_desc:0 "A teacher answers questions with questions and keeps the ones that hold up. What is taught is less a body of knowledge than a way of doubting it."
 tech_adastra_silk_road:0 "Caravan Roads"
 tech_adastra_silk_road_desc:0 "A bale of silk changes hands six times between the east and the sea. None of those traders has seen both ends of the road, and the road exists."
 tech_adastra_trireme:0 "Oared Warship"
 tech_adastra_trireme_desc:0 "A hundred and sixty rowers who must breathe as one man. The hull is worth nothing without the months of drill it demands."
 tech_adastra_crucible_steel:0 "Crucible Steel"
 tech_adastra_crucible_steel_desc:0 "Iron sealed in a clay pot with charcoal comes out changed: hard enough to cut, springy enough not to snap. The smith does not know why, he knows how long."
 tech_adastra_roman_road:0 "Paved Road"
 tech_adastra_roman_road_desc:0 "A bed of stones, gravel, slabs, and just enough camber for the water to leave. The courier takes eight days where he used to take twenty."
 tech_adastra_lighthouse:0 "Lighthouse"
 tech_adastra_lighthouse_desc:0 "A fire kept burning all night at the top of a tower, visible thirty miles out. Captains stop waiting for daylight to enter the harbour."
 tech_adastra_bellows:0 "Bellows and Furnace"
 tech_adastra_bellows_desc:0 "A steady blast drives the hearth hotter than fire climbs on its own, and the metal runs instead of softening. We stop hammering what can be poured."
 tech_adastra_concrete:0 "Lime Concrete"
 tech_adastra_concrete_desc:0 "Lime, sand and volcanic ash set solid, even under water. From now on stone is poured rather than cut, and the spans grow wider."
 # --- medieval ---
 tech_adastra_crop_rotation:0 "Three-Field Rotation"
 tech_adastra_crop_rotation_desc:0 "Letting part of the land rest yields more than forcing all of it. A lesson every civilisation relearns the hard way."
 tech_adastra_mills:0 "Water and Wind Mills"
 tech_adastra_mills_desc:0 "For the first time, work is done without muscle - neither ours nor an animal's. The river asks for no wages.\n\n§YUnlocks the building: Mill.§!"
 tech_adastra_stone_architecture:0 "Stone Architecture"
 tech_adastra_stone_architecture_desc:0 "The arch, the vault, the buttress: three ways of persuading stone to stand in mid-air. Our cities stop burning down every twenty years.\n\n§YUnlocks the building: Citadel. Allows the seat of power to be upgraded to a Town Hall.§!"
 tech_adastra_scholasticism:0 "Scholasticism"
 tech_adastra_scholasticism_desc:0 "A method for arguing cleanly: thesis, objection, reply. It will look rigid later, but it teaches a people how to reason aloud.\n\n§YUnlocks the building: University.§!"
 tech_adastra_guilds:0 "Guilds"
 tech_adastra_guilds_desc:0 "The craft is passed on, protected and priced. Quality becomes a collective standard rather than an isolated talent."
 tech_adastra_algebra:0 "Algebra and the Zero"
 tech_adastra_algebra_desc:0 "A sign for what is not there. The idea is so hard that it took centuries to accept, and every calculation depends on it."
 tech_adastra_optics:0 "Optics and Lenses"
 tech_adastra_optics_desc:0 "A curved glass corrects a failing eye. A scholar of sixty can keep reading: knowledge gains twenty years."
 tech_adastra_heavy_plough:0 "Heavy Plough"
 tech_adastra_heavy_plough_desc:0 "A blade that turns the heavy northern soil instead of scratching it. Whole regions become farmland."
 tech_adastra_hospices:0 "Hospices"
 tech_adastra_hospices_desc:0 "A place where the sick are kept instead of pushed away. We cannot cure yet; we can already watch over."
 tech_adastra_cartography:0 "Cartography"
 tech_adastra_cartography_desc:0 "Draw a coast you have sailed, and find it again ten years later. A map is a memory that can be handed on."
 tech_adastra_stirrup:0 "The Stirrup"
 tech_adastra_stirrup_desc:0 "Two iron loops under the feet, and a rider can strike without leaving the saddle. The horse becomes a weapon, and whoever can afford to keep one becomes a lord."
 tech_adastra_paper_mill:0 "The Paper Mill"
 tech_adastra_paper_mill_desc:0 "Worn rags come back as sheets. Writing stops being a luxury of animal skin: a scribe no longer counts his drafts."
 tech_adastra_distillation:0 "The Alembic"
 tech_adastra_distillation_desc:0 "Heat it, catch the vapour, and what comes back is purer than what went in. The device serves perfume and medicine first, and teaches us to separate things along the way."
 tech_adastra_translation_movement:0 "The Translation Movement"
 tech_adastra_translation_movement_desc:0 "Patrons pay a book's weight in gold to have a Greek treatise turned into Arabic. A library in Baghdad keeps what Athens had stopped reading."
 tech_adastra_astrolabe:0 "The Astrolabe"
 tech_adastra_astrolabe_desc:0 "A brass disc that answers two simple questions: where am I, and what time is it. Hold it by the ring, sight a star, and read."
 tech_adastra_gunpowder:0 "Black Powder"
 tech_adastra_gunpowder_desc:0 "Saltpetre, sulphur, charcoal. Alchemists were looking for the elixir of long life; what they found shortens sieges and men."
 tech_adastra_horse_collar:0 "The Horse Collar"
 tech_adastra_horse_collar_desc:0 "The collar presses on the shoulder instead of the throat: the horse can finally pull without choking. One team does the work of four oxen, and walks twice as fast."
 tech_adastra_trigonometry:0 "Trigonometry"
 tech_adastra_trigonometry_desc:0 "A table of sines fits on two pages and replaces a lifetime of measuring. Given one angle and one length, you get the height of a minaret without climbing it."
 tech_adastra_crop_diffusion:0 "The Travelling Crops"
 tech_adastra_crop_diffusion_desc:0 "Rice, cotton and sugar cane follow the caravans and take root three thousand leagues from home. A farmer sows a plant his grandfather had no name for."
 tech_adastra_paper_money:0 "Paper Money"
 tech_adastra_paper_money_desc:0 "The state promises, and the paper is worth something. A fortune now travels in a sleeve, which delights merchants and worries anyone who can count."
 tech_adastra_blast_furnace:0 "The Blast Furnace"
 tech_adastra_blast_furnace_desc:0 "A furnace hot enough to make iron run instead of soften. Pour it into a mould and the part comes out already shaped, a hundred times over."
 tech_adastra_compass:0 "The Compass"
 tech_adastra_compass_desc:0 "A needle rubbed on lodestone, floating on a straw, always points south. An overcast sky stops being a reason to stay in harbour."
 tech_adastra_caravanserai:0 "The Caravanserai"
 tech_adastra_caravanserai_desc:0 "One day's march, then a wall, a well, a stable and a roof. The long road becomes a series of short ones, and trade stops being an adventure."
 tech_adastra_stern_rudder:0 "The Sternpost Rudder"
 tech_adastra_stern_rudder_desc:0 "A rudder hung at the stern and worked by a tiller: one man steers a ship that ten steering oars could no longer hold. Hulls are free to grow."
 tech_adastra_impetus:0 "Impetus Theory"
 tech_adastra_impetus_desc:0 "A thrown stone keeps going because it carries something with it, not because the air shoves it from behind. The idea is wrong in the detail and right in spirit: motion needs no keeping alive."
 # --- renaissance ---
 tech_adastra_printing:0 "The Printing Press"
 tech_adastra_printing_desc:0 "Copying an idea now costs almost nothing. Those who lived off the monopoly of knowledge do not yet grasp what has happened to them.\n\n§YAllows the seat of power to be upgraded to a Government House.§!"
 tech_adastra_experimental_method:0 "The Experimental Method"
 tech_adastra_experimental_method_desc:0 "No longer asking what ought to be true, but what survives the test. Our civilisation has just agreed that it can be wrong."
 tech_adastra_anatomy:0 "Anatomy"
 tech_adastra_anatomy_desc:0 "Looking inside the body without turning away. Medicine stops being a consolation and becomes a discipline."
 tech_adastra_mechanics:0 "Perspective and Mechanics"
 tech_adastra_mechanics_desc:0 "The same geometry paints a nave and computes a gear train. Art and machine briefly share a workshop."
 tech_adastra_banking:0 "Banking and Credit"
 tech_adastra_banking_desc:0 "Lending money you do not yet have against a share of what it will make. Any undertaking too large for one lifetime becomes possible."
 tech_adastra_chemistry:0 "Chemistry of Substances"
 tech_adastra_chemistry_desc:0 "Alchemy went looking for gold and found method instead. Weigh before, weigh after, and write down what changed."
 tech_adastra_metallurgy_casting:0 "Casting and Artillery"
 tech_adastra_metallurgy_casting_desc:0 "Cast metal in a single piece strong enough to hold an explosion. Walls stop being an answer."
 tech_adastra_clockwork:0 "Clockwork"
 tech_adastra_clockwork_desc:0 "A mechanism that cuts the day into equal parts without consulting the sun. The first object that imposes its rhythm on people."
 tech_adastra_double_entry:0 "Double-Entry Bookkeeping"
 tech_adastra_double_entry_desc:0 "Every sum is written twice, in two places. If the columns do not balance, someone lied or made a mistake."
 tech_adastra_navigation:0 "Deep-Sea Navigation"
 tech_adastra_navigation_desc:0 "Lose sight of the coast and still know where you are. The first time we leave without a landmark — the second time will be upward."
 tech_adastra_telescope:0 "The Telescope"
 tech_adastra_telescope_desc:0 "Three glasses lined up in a tube, and Jupiter has moons that do not turn around us. For the first time, an instrument sees before the eye does."
 tech_adastra_heliocentrism:0 "The Heliocentric System"
 tech_adastra_heliocentrism_desc:0 "A canon puts off publishing until his deathbed, and he is right to hesitate: he is moving the ground under everyone's feet."
 tech_adastra_magnetism:0 "Terrestrial Magnetism"
 tech_adastra_magnetism_desc:0 "The needle does not quite point north, and it lies differently from place to place. The Earth itself is a magnet, and the pilot learns to correct for it."
 tech_adastra_vacuum_pump:0 "The Vacuum Pump"
 tech_adastra_vacuum_pump_desc:0 "Two copper hemispheres emptied of air, and sixteen horses cannot pull them apart. What has been pressing on us all along has just been measured."
 tech_adastra_universal_gravitation:0 "Universal Gravitation"
 tech_adastra_universal_gravitation_desc:0 "The apple and the Moon fall the same way, by the same equation. The sky stops being another world: it obeys the rules of the farmyard."
 tech_adastra_microscope:0 "The Microscope"
 tech_adastra_microscope_desc:0 "A drop of rainwater is full of swimming creatures. Nobody had imagined the world keeps going below what the eye can see."
 tech_adastra_new_crops:0 "New World Crops"
 tech_adastra_new_crops_desc:0 "The potato feeds three times as many mouths from the same field, and nobody wants it until the first famine. After that, nobody gives it up."
 tech_adastra_pike_and_shot:0 "Pike and Shot"
 tech_adastra_pike_and_shot_desc:0 "A square of pikes shields the shooters while they reload. A peasant trained in six weeks brings down a horseman trained since childhood."
 tech_adastra_joint_stock:0 "The Joint-Stock Company"
 tech_adastra_joint_stock_desc:0 "The risk of a voyage is cut into shares that can be sold to a stranger. A shipwreck ruins a hundred people by a hundredth each."
 tech_adastra_permanent_embassy:0 "The Resident Embassy"
 tech_adastra_permanent_embassy_desc:0 "Instead of sending a messenger once things go wrong, a man is left in place who writes home every week. He is bored, he listens, and he costs less than a war."
 tech_adastra_caravel:0 "The Caravel"
 tech_adastra_caravel_desc:0 "A hull small enough to enter a river and strong enough for the ocean, rigged to sail against the wind. Coming back stops being the problem."
 tech_adastra_canal_lock:0 "The Canal Lock"
 tech_adastra_canal_lock_desc:0 "Two gates and a basin: a barge climbs a hill in half an hour. Grain now travels by water to cities that have no harbour."
 tech_adastra_bastion_fort:0 "The Bastion Fort"
 tech_adastra_bastion_fort_desc:0 "Walls come down, thicken and take the shape of a star so that nothing stays out of sight. A siege is now counted in months and in men with shovels."
 tech_adastra_deep_mining:0 "Deep Mines and Drainage"
 tech_adastra_deep_mining_desc:0 "Below a certain depth the gallery fills with water faster than it can be dug. Chains of buckets turn day and night so that ten men can work dry."
 tech_adastra_clear_glass:0 "Crystal Glass"
 tech_adastra_clear_glass_desc:0 "Glass with no bubbles and no green tint, pure enough that you forget it is there. It becomes windows, mirrors, and soon lenses."
 # --- steam ---
 tech_adastra_steam_engine:0 "The Steam Engine"
 tech_adastra_steam_engine_desc:0 "A force that does not sleep, eat or revolt. What a people can produce stops being limited by how many arms it has.\n\n§YUnlocks the building: Manufactory. Unlocks the Consumer Goods resource: the first production in series.§!"
 tech_adastra_coal:0 "Coal and Coke"
 tech_adastra_coal_desc:0 "We are burning forests millions of years old. Nobody is yet asking what happens when they run out."
 tech_adastra_railways:0 "Railways"
 tech_adastra_railways_desc:0 "Two cities three weeks apart end up a day apart. The whole country changes size without moving an inch."
 tech_adastra_telegraph:0 "The Telegraph"
 tech_adastra_telegraph_desc:0 "For the first time, a message outruns the messenger. Distance has just lost its first battle."
 tech_adastra_sanitation:0 "Public Sanitation"
 tech_adastra_sanitation_desc:0 "Sewers and clean water will save more lives than all our physicians combined. The most decisive advance is also the least glamorous."
 tech_adastra_gas_lighting:0 "Gas Lighting"
 tech_adastra_gas_lighting_desc:0 "Night retreats from the streets and the workshops. The working day stops being limited by the sun — for better and for worse."
 tech_adastra_electromagnetism:0 "Electromagnetism"
 tech_adastra_electromagnetism_desc:0 "A needle moves when a current passes nearby. Twenty years later, that same fact explains light."
 tech_adastra_machine_tools:0 "Machine Tools"
 tech_adastra_machine_tools_desc:0 "A machine that makes the parts of another machine, to a hundredth. This is where industry stops depending on the knack of a hand."
 tech_adastra_census:0 "The Census"
 tech_adastra_census_desc:0 "Count your inhabitants one by one, with their age and trade. A state that knows how many hands it has stops governing by guesswork."
 tech_adastra_anesthesia:0 "Anaesthesia"
 tech_adastra_anesthesia_desc:0 "Surgery stops being a race against pain. The surgeon can finally take his time, and it is that time that saves."
 tech_adastra_photography:0 "Photography"
 tech_adastra_photography_desc:0 "Fix an image without drawing it. For the first time a face crosses time without passing through a painter's hand."
 tech_adastra_selective_breeding:0 "Selective Breeding"
 tech_adastra_selective_breeding_desc:0 "By choosing which animals breed, a sheep doubles its weight in three generations. The farm becomes a workshop like any other."
 tech_adastra_canals:0 "Navigation Canals"
 tech_adastra_canals_desc:0 "One horse pulling a barge moves thirty times what a cart carries on the road. Coal reaches the city at half the price."
 tech_adastra_spinning_jenny:0 "Mechanical Spinning"
 tech_adastra_spinning_jenny_desc:0 "One worker turns eight spindles, then eighty. Cloth becomes cheap enough to own a second shirt, and cheap enough to leave the spinners without work."
 tech_adastra_political_economy:0 "Political Economy"
 tech_adastra_political_economy_desc:0 "Someone writes that a nation's wealth is not the gold in its vaults but the labour of its people. Ministers will take fifty years to believe it."
 tech_adastra_iron_bridge:0 "Cast-Iron Construction"
 tech_adastra_iron_bridge_desc:0 "A bridge cast entirely in iron, without a single stone. Carters go out of their way to look at it, certain it will end up in the river."
 tech_adastra_balloon:0 "The Hot-Air Balloon"
 tech_adastra_balloon_desc:0 "Two men rise above the rooftops in a bag of cloth and smoke. It is the first time anyone leaves the ground without falling straight back."
 tech_adastra_mass_conscription:0 "Mass Conscription"
 tech_adastra_mass_conscription_desc:0 "The army stops being a trade and becomes an age group. Soldiers are no longer counted in regiments but in generations."
 tech_adastra_vaccine_cowpox:0 "Cowpox Vaccination"
 tech_adastra_vaccine_cowpox_desc:0 "A child is given the mild disease of cattle so the killing one passes him by. Smallpox retreats for the first time in living memory."
 tech_adastra_scientific_expeditions:0 "Scientific Expeditions"
 tech_adastra_scientific_expeditions_desc:0 "Ships sail loaded with barometers, plant presses and draughtsmen instead of soldiers. They return with crates of plants nobody here can name."
 tech_adastra_atomic_theory:0 "Atomic Theory"
 tech_adastra_atomic_theory_desc:0 "Substances always combine in the same proportions and never in others. The only explanation fits in one line: matter is made of grains that cannot be halved."
 tech_adastra_steamship:0 "The Steamship"
 tech_adastra_steamship_desc:0 "A boat that climbs the river with no wind and no oarsmen. Arrival times stop being estimates."
 tech_adastra_fraunhofer_lines:0 "Spectral Lines"
 tech_adastra_fraunhofer_lines_desc:0 "Spread out the light of the sun and you find dark lines, always in the same places. One day they will tell us what the stars are made of."
 tech_adastra_difference_engine:0 "The Difference Engine"
 tech_adastra_difference_engine_desc:0 "An assembly of toothed wheels that computes tables without tiring and without erring. Mistakes in the old tables had already cost ships."
 tech_adastra_abolition:0 "Abolition of Slavery"
 tech_adastra_abolition_desc:0 "It is finally written into law that a person cannot be property. Those who opposed it ask to be compensated for their loss."
 # --- industrial ---
 tech_adastra_bessemer:0 "Bessemer Steel"
 tech_adastra_bessemer_desc:0 "Blowing air through molten iron to burn out its impurities. Steel goes from luxury to staple, and our buildings start to climb."
 tech_adastra_thermodynamics:0 "Thermodynamics"
 tech_adastra_thermodynamics_desc:0 "Our engines worked before we understood why. Understanding heat means discovering that even energy keeps books."
 tech_adastra_fertilizers:0 "Chemical Fertilizers"
 tech_adastra_fertilizers_desc:0 "Manufacturing fertility instead of waiting for it. Our population breaks through a ceiling we believed nature itself had set."
 tech_adastra_labour_law:0 "Labour Law"
 tech_adastra_labour_law_desc:0 "After a century of smoke, it becomes obvious that a machine which never tires is no model for those who do."
 tech_adastra_periodic_table:0 "The Periodic Table"
 tech_adastra_periodic_table_desc:0 "Arrange the elements in a table that leaves empty squares — and claim that what is missing exists. They were found."
 tech_adastra_refrigeration:0 "Refrigeration"
 tech_adastra_refrigeration_desc:0 "Cold made on demand. Meat travels, and the city eats something other than whatever grows a cart-day away."
 tech_adastra_germ_theory:0 "Germ Theory"
 tech_adastra_germ_theory_desc:0 "Disease has a cause, it is alive, and it is too small to see. Washing your hands becomes a medical act."
 tech_adastra_universal_suffrage:0 "Widened Suffrage"
 tech_adastra_universal_suffrage_desc:0 "The vote stops being tied to wealth. The people who keep the factories running finally weigh on what is done with them."
 tech_adastra_electricity:0 "The Electrical Grid"
 tech_adastra_electricity_desc:0 "Energy stops being produced where it is consumed. The factory can finally stand somewhere other than beside a waterfall.\n\n§YUnlocks the Energy Credits resource and generator districts. District upkeep, paid in minerals until now, goes back to energy.§!"
 tech_adastra_social_insurance:0 "Social Insurance"
 tech_adastra_social_insurance_desc:0 "Pay in while you are well so you are covered when you are not. Risk stops being individual: this is a political invention, not a medical one."
 tech_adastra_synthetic_dye:0 "Synthetic Dyes"
 tech_adastra_synthetic_dye_desc:0 "A student botches an attempt at quinine and gets a purple nobody has ever worn. Colour stops being wrung out of plants and shellfish."
 tech_adastra_spectroscopy:0 "Spectroscopy"
 tech_adastra_spectroscopy_desc:0 "Every element burns with its own lines, always the same ones. Point the instrument at the sun and you learn what it is made of, without going there."
 tech_adastra_antiseptic_surgery:0 "Antiseptic Surgery"
 tech_adastra_antiseptic_surgery_desc:0 "Hands and instruments are washed in carbolic acid, and wounds stop rotting. The old surgeons, proud of aprons stiffened with blood, will take ten years to give in."
 tech_adastra_dynamite:0 "Dynamite"
 tech_adastra_dynamite_desc:0 "Nitroglycerine soaked into earth stops exploding at the slightest knock. Mountains are opened; the inventor will one day read his own obituary and dislike what it says."
 tech_adastra_general_staff:0 "The General Staff"
 tech_adastra_general_staff_desc:0 "A room of officers planning wars that have not started, railway timetables included. A campaign is now won before the first shot."
 tech_adastra_dynamo:0 "The Dynamo"
 tech_adastra_dynamo_desc:0 "A machine that makes current abundant and steady instead of scarce and capricious. Electricity leaves the laboratory bench for the workshop floor."
 tech_adastra_telephone:0 "The Telephone"
 tech_adastra_telephone_desc:0 "Speaking to someone you could not hear shout. The first subscribers bellow into the mouthpiece by reflex, as if the distance had to be heard in the voice."
 tech_adastra_ocean_liner:0 "The Ocean Liner"
 tech_adastra_ocean_liner_desc:0 "Steel hull, compound engine, sailings posted a year ahead. The crossing stops being an adventure and becomes a ticket, and millions buy one with no intention of returning."
 tech_adastra_machine_gun:0 "The Automatic Gun"
 tech_adastra_machine_gun_desc:0 "One man, one crank, six hundred rounds a minute. The staffs file it among colonial curiosities and will only understand a generation later, in the mud."
 tech_adastra_steel_frame:0 "The Steel Frame"
 tech_adastra_steel_frame_desc:0 "The building no longer rests on its walls but on a cage of steel, and the lift makes the top floor desirable. The city, out of land, starts growing upward."
 tech_adastra_colonial_partition:0 "The Colonial Partition"
 tech_adastra_colonial_partition_desc:0 "Men in frock coats rule straight borders across the map of continents they have never seen. Rivers and peoples will not follow those lines."
 tech_adastra_radio_waves:0 "Hertzian Waves"
 tech_adastra_radio_waves_desc:0 "A spark on one side of the room, another answering in a loop of wire, and nothing in between. Asked what use it could be, he answers: none whatsoever."
 tech_adastra_punch_cards:0 "Punched Cards"
 tech_adastra_punch_cards_desc:0 "The previous census took eight years to tally. Holed cards and electric counters do it in one: we have just taught a machine to count."
 tech_adastra_x_rays:0 "X-Rays"
 tech_adastra_x_rays_desc:0 "A hand held before the screen, and its bones appear. His wife looks at the plate and says she has just seen her own death."
 tech_adastra_steam_turbine:0 "The Steam Turbine"
 tech_adastra_steam_turbine_desc:0 "Instead of shoving a piston back and forth, the steam simply turns. A small uninvited boat crosses the naval review faster than anything that could have caught it."
 # --- machine ---
 tech_adastra_radio:0 "Radio"
 tech_adastra_radio_desc:0 "One voice entering every home at once. A people can finally think of itself as a single body - for better and for worse.\n\n§YUnlocks the building: Broadcasting Station.§!"
 tech_adastra_aviation:0 "Internal Combustion and Aviation"
 tech_adastra_aviation_desc:0 "An engine light enough to leave the ground. One generation separates the first flight from the first bombing run."
 tech_adastra_antibiotics:0 "Antibiotics"
 tech_adastra_antibiotics_desc:0 "A mould forgotten on a bench ends millennia of dying from a scratch. Chance - but prepared chance."
 tech_adastra_mass_education:0 "Mass Education"
 tech_adastra_mass_education_desc:0 "Teaching everyone, not only those who can afford it. The pool of people able to discover something has just multiplied a hundredfold.\n\n§YUnlocks the building: Public School.§!"
 tech_adastra_quantum_theory:0 "Quantum Theory"
 tech_adastra_quantum_theory_desc:0 "Energy does not flow, it jumps. The world at the scale of the atom refuses common sense, and it is right."
 tech_adastra_haber:0 "Ammonia Synthesis"
 tech_adastra_haber_desc:0 "Make fertilizer out of the air. Half the people alive today eat because of this process — and half its output went into explosives."
 tech_adastra_plastics:0 "Plastics"
 tech_adastra_plastics_desc:0 "A material that imitates nothing that exists. It can be given any shape you like, and it never goes away."
 tech_adastra_epidemiology:0 "Epidemiology"
 tech_adastra_epidemiology_desc:0 "Take the handle off a pump and watch the epidemic stop. Statistics become a public health weapon."
 tech_adastra_assembly_line:0 "The Assembly Line"
 tech_adastra_assembly_line_desc:0 "Splitting work into gestures so simple anyone can perform them. Output explodes; the worker never sees the finished object again."
 tech_adastra_petrochemistry:0 "Petrochemistry"
 tech_adastra_petrochemistry_desc:0 "Materials found nowhere in nature, produced by the tonne. Daily life turns synthetic almost without our noticing."
 tech_adastra_jet_engine:0 "The Jet Engine"
 tech_adastra_jet_engine_desc:0 "No more propeller: swallow the air in front and throw it out behind, faster. The principle is the rocket's, still breathing."
 tech_adastra_television:0 "Television"
 tech_adastra_television_desc:0 "Watching a distant event as it happens. Our world becomes, for the first time, a place you can take in at a glance."
 tech_adastra_relativity:0 "Relativity"
 tech_adastra_relativity_desc:0 "Two identical clocks stop keeping the same time as soon as one of them travels. The universe no longer has a shared present, and nobody feels the difference."
 tech_adastra_atomic_nucleus:0 "The Atomic Nucleus"
 tech_adastra_atomic_nucleus_desc:0 "Tiny projectiles are fired at a sheet of gold foil, and a few come straight back. Matter is almost entirely empty, with something hard at the centre."
 tech_adastra_cosmic_rays:0 "Cosmic Rays"
 tech_adastra_cosmic_rays_desc:0 "A physicist rides a balloon five kilometres up, half frozen, to check that the radiation rises instead of fading. Something is bombarding us from outside the world."
 tech_adastra_expanding_universe:0 "The Expanding Universe"
 tech_adastra_expanding_universe_desc:0 "Every galaxy is receding, and the farthest ones fastest. So the universe has an age, a question we did not yet know how to ask."
 tech_adastra_radar:0 "Radar"
 tech_adastra_radar_desc:0 "Send a wave out and listen for what comes back: aircraft appear half an hour before anyone can see them. Operators push counters across a map while someone decides who takes off."
 tech_adastra_cryptanalysis:0 "Mechanical Cryptanalysis"
 tech_adastra_cryptanalysis_desc:0 "Machines built of relays hunt day and night for the keys of other machines, in wooden huts. Those who work there will say nothing for thirty years."
 tech_adastra_polar_exploration:0 "Polar Exploration"
 tech_adastra_polar_exploration_desc:0 "The last blanks on the map close over men who do not all come back. What reaches port is weather data, rocks, and notebooks kept to the final page."
 tech_adastra_vitamins:0 "Vitamins"
 tech_adastra_vitamins_desc:0 "Some illnesses come not from a germ but from an absence. Polished rice and winter rations were short a few milligrams of almost nothing."
 tech_adastra_blood_transfusion:0 "Transfusion and Blood Banks"
 tech_adastra_blood_transfusion_desc:0 "Sort blood into groups, stop it clotting, keep it cold. Behind the lines, bottles wait for a wounded man who will never learn the donor's name."
 tech_adastra_propaganda:0 "Mass Propaganda"
 tech_adastra_propaganda_desc:0 "The techniques that sell soap also make a war popular. It is called informing the public, and a poster costs less than a regiment."
 tech_adastra_total_war:0 "Total War"
 tech_adastra_total_war_desc:0 "There is no rear any more: factory, field and city count as much as the front. States learn to mobilise a whole country, and will not forget how."
 tech_adastra_reinforced_concrete:0 "Reinforced Concrete"
 tech_adastra_reinforced_concrete_desc:0 "Steel drowned in poured stone: housing finally stacks instead of sprawling. A building rises in a few months, and it holds."
 tech_adastra_tractor:0 "The Farm Tractor"
 tech_adastra_tractor_desc:0 "One machine ploughs in a day what a team of horses did in a week. The horses leave the fields, and with them half the village's hands."
 # --- atomic ---
 tech_adastra_fission:0 "Controlled Fission"
 tech_adastra_fission_desc:0 "We learned to split the atom before we learned to trust ourselves. Everything that follows depends on the order of those two lessons."
 tech_adastra_electronics:0 "Electronics"
 tech_adastra_electronics_desc:0 "Making a current carry an argument. Thought becomes something you can manufacture in bulk."
 tech_adastra_vaccination:0 "Universal Vaccination"
 tech_adastra_vaccination_desc:0 "Deliberately erasing a disease from the world. It is the first time our species acts at its own full scale and succeeds."
 tech_adastra_radio_astronomy:0 "Radio Astronomy"
 tech_adastra_radio_astronomy_desc:0 "The sky broadcasts on wavelengths no eye can see. We discover we had been watching the universe through a keyhole."
 tech_adastra_containers:0 "The Standard Container"
 tech_adastra_containers_desc:0 "A box of the same size everywhere in the world. The most boring invention of the century, and the one that changed trade the most."
 tech_adastra_human_rights:0 "Declaration of Rights"
 tech_adastra_human_rights_desc:0 "Write down what is owed to someone by the sole fact of existing. The text binds no one, and yet everyone invokes it."
 tech_adastra_computing:0 "Computing"
 tech_adastra_computing_desc:0 "Handing calculation to a machine, and immediately discovering problems we would never have dared to pose otherwise."
 tech_adastra_cooperation:0 "International Cooperation"
 tech_adastra_cooperation_desc:0 "No nation reaches space alone. The last technology before the stars is not a machine: it is an agreement."
 tech_adastra_nuclear_medicine:0 "Nuclear Medicine"
 tech_adastra_nuclear_medicine_desc:0 "The same atom that made the bomb lights up the inside of a living body. We see the tumour before it shows itself."
 tech_adastra_sounding_rocket:0 "Sounding Rocket"
 tech_adastra_sounding_rocket_desc:0 "A salvaged war rocket, a thirty-five millimetre camera strapped to it, and the film recovered from the desert sand. At last someone looks at a photograph of their own world seen from outside."
 tech_adastra_transistor:0 "The Transistor"
 tech_adastra_transistor_desc:0 "A crystal of germanium, two gold contacts, and a signal that comes out stronger than it went in. The thing sits in the palm of a hand and will replace whole rooms."
 tech_adastra_decolonization:0 "Decolonization"
 tech_adastra_decolonization_desc:0 "At midnight one flag comes down and another goes up. In the weeks that follow, millions walk in both directions along the same road: independence and partition arrived on the same day."
 tech_adastra_welfare_state:0 "The Welfare State"
 tech_adastra_welfare_state_desc:0 "Being treated without taking out money at the moment it hurts. On the first day the surgeries fill with people who have been waiting twenty years."
 tech_adastra_information_theory:0 "Information Theory"
 tech_adastra_information_theory_desc:0 "A message stops having a meaning and becomes a quantity. Information can be counted like coal, and sent across without losing a grain of it."
 tech_adastra_deterrence:0 "Deterrence"
 tech_adastra_deterrence_desc:0 "A second bomb now exists, facing the first. Peace no longer rests on trust but on the cold arithmetic that no one would survive going first."
 tech_adastra_suburbs:0 "The Suburb"
 tech_adastra_suburbs_desc:0 "Identical houses laid out in rows over old potato fields, thirty a day. You move in with a car and a thirty-year loan."
 tech_adastra_civil_aviation:0 "The Jet Airliner"
 tech_adastra_civil_aviation_desc:0 "Four hours saved and quiet in the cabin. Two years later, two of them tear apart in mid-air and we learn that a square window tires metal."
 tech_adastra_dna_structure:0 "The Structure of Heredity"
 tech_adastra_dna_structure_desc:0 "Two ribbons wound around each other: the shape says by itself how it copies itself. The photograph that revealed it had been taken by someone else."
 tech_adastra_maser:0 "Stimulated Emission"
 tech_adastra_maser_desc:0 "Forcing molecules to release their energy all together, in step. The beam that comes out is so regular it will serve as a clock, then as a ruler for measuring the sky."
 tech_adastra_nuclear_submarine:0 "The Nuclear Submarine"
 tech_adastra_nuclear_submarine_desc:0 "A vessel that needs neither air nor the surface, and can stay under for months. The crew stops counting days and starts living by the clock."
 tech_adastra_solar_cell:0 "The Photovoltaic Cell"
 tech_adastra_solar_cell_desc:0 "A wafer of silicon that makes current out of light, with no moving part and no noise. Its first serious job is a rural telephone line."
 tech_adastra_desegregation:0 "The End of Segregation"
 tech_adastra_desegregation_desc:0 "A tired woman refuses to change seats on a bus, and a whole city walks to work for a year. The law gives way before the habits do."
 tech_adastra_motorways:0 "The Motorway Network"
 tech_adastra_motorways_desc:0 "Roads with no crossing and no red light, drawn in one stroke across the country. They bring everyone closer, except the villages they bypass."
 tech_adastra_magnetic_storage:0 "Magnetic Storage"
 tech_adastra_magnetic_storage_desc:0 "Fifty discs spinning inside a one-tonne cabinet, and a head that fetches any line without unwinding all the rest. A machine can finally remember out of order."
 tech_adastra_ballistic_missile:0 "The Ballistic Missile"
 tech_adastra_ballistic_missile_desc:0 "A rocket powerful enough to carry a warhead from one continent to another, and therefore powerful enough never to come down. The people building it know that before anyone else."
 # --- space ---
 tech_adastra_rocketry:0 "Multistage Rocketry"
 tech_adastra_rocketry_desc:0 "Discarding what has become dead weight in order to keep climbing. The lesson far outlives the engineering."
 tech_adastra_remote_sensing:0 "Remote Sensing"
 tech_adastra_remote_sensing_desc:0 "Seeing our world from outside it. The resources we groped for appear all at once, mapped."
 tech_adastra_genetics:0 "Applied Genetics"
 tech_adastra_genetics_desc:0 "Reading, then editing, the text we are made of. We become the first species to proofread its own instructions."
 tech_adastra_satellites:0 "The Artificial Satellite"
 tech_adastra_satellites_desc:0 "An object falling fast enough to miss the planet on every pass. The first thing we put up there that stayed."
 tech_adastra_microprocessor:0 "The Microprocessor"
 tech_adastra_microprocessor_desc:0 "A whole calculating machine on a chip of silicon. It slips into everything, including things that had no reason to compute."
 tech_adastra_networks:0 "Global Networks"
 tech_adastra_networks_desc:0 "Wire the machines together until distance stops counting. A whole planet becomes a single conversation, often a tiresome one."
 tech_adastra_ecology:0 "Planetary Ecology"
 tech_adastra_ecology_desc:0 "The first photograph of our world seen from outside did more for this science than thirty years of reports. It shows a marble, and nothing around it."
 tech_adastra_green_revolution:0 "The Green Revolution"
 tech_adastra_green_revolution_desc:0 "Selected varieties, fertilizer, irrigation. The announced famines did not happen — and the soil paid the bill."
 tech_adastra_superconductivity:0 "Superconductivity"
 tech_adastra_superconductivity_desc:0 "Cool a metal until resistance vanishes entirely — not nearly, entirely. A current started in the ring at night is still going in the morning."
 tech_adastra_laser:0 "The Laser"
 tech_adastra_laser_desc:0 "A light whose every wave marches in step. Its inventors themselves present it as a solution still looking for a problem."
 tech_adastra_chaos_theory:0 "Chaos Theory"
 tech_adastra_chaos_theory_desc:0 "A weather modeller restarts his run with three fewer decimals to save time, and gets a different climate. Some things are predictable in theory and not in practice."
 tech_adastra_quarks:0 "The Quark Model"
 tech_adastra_quarks_desc:0 "The proton is not indivisible: three things sit inside it, and none will ever come out alone. Matter has one more floor than we thought."
 tech_adastra_plate_tectonics:0 "Plate Tectonics"
 tech_adastra_plate_tectonics_desc:0 "The ocean floor carries symmetrical magnetic stripes on either side of the ridge: the ground makes ground, and the continents drift. The map of the world stops being scenery."
 tech_adastra_cosmic_background:0 "The Cosmic Background"
 tech_adastra_cosmic_background_desc:0 "Two engineers scrub pigeon droppings out of their antenna to silence a hiss coming from every direction. The noise stays: it is the cooled glow of the beginning."
 tech_adastra_fiber_optics:0 "Optical Fibre"
 tech_adastra_fiber_optics_desc:0 "A thread of glass pure enough to see through for kilometres. Conversation now travels as light, and copper begins its retirement."
 tech_adastra_birth_control:0 "Birth Control"
 tech_adastra_birth_control_desc:0 "A pill decides the timing, and the decision changes hands. Families shrink, careers lengthen, and nobody had foreseen how political this would be."
 tech_adastra_transplant:0 "Transplantation"
 tech_adastra_transplant_desc:0 "A dead person's heart beats for eighteen days in a living chest. The exact moment at which someone stops being someone has to be redefined at once."
 tech_adastra_hotline:0 "Deterrence"
 tech_adastra_hotline_desc:0 "Thirteen days in which both sides work out that striking first saves no one. Afterwards they install a direct telephone line, because silence had cost too much."
 tech_adastra_deep_sea:0 "The Deep Sea"
 tech_adastra_deep_sea_desc:0 "Two men in a steel sphere touch the bottom of the deepest trench and find a flatfish looking back at them. We reach the lowest place in the world in the very decade we start leaving it."
 tech_adastra_civil_rights:0 "Civil Rights"
 tech_adastra_civil_rights_desc:0 "A signature at the bottom of a law does not change people, but it changes what a service counter is allowed to refuse. The rest is won one counter at a time."
 tech_adastra_manned_flight:0 "Manned Spaceflight"
 tech_adastra_manned_flight_desc:0 "One hour and forty-eight minutes to go around the world, sealed in a metal ball with not one control to touch. He comes back down, and the whole planet knows his first name."
 tech_adastra_lunar_landing:0 "The Lunar Landing"
 tech_adastra_lunar_landing_desc:0 "The onboard computer overloads a few hundred metres above the ground and the crew lands by hand with twenty seconds of fuel left. A boot print stays in the dust, there being no wind to wipe it away."
 tech_adastra_ion_drive:0 "Ion Propulsion"
 tech_adastra_ion_drive_desc:0 "A thrust so weak that a sheet of paper resists it, but which never stops. Over several months, patience beats power."
 tech_adastra_heat_shield:0 "Ablative Heat Shield"
 tech_adastra_heat_shield_desc:0 "Going up is a matter of engines; coming back down is a matter of chemistry. We build a shield that protects by burning away, wearing out exactly as much as it must."
 tech_adastra_industrial_robot:0 "The Industrial Arm"
 tech_adastra_industrial_robot_desc:0 "A hydraulic arm grips a red-hot part and sets it down in the right place, all night long, with no hazard pay. The shop floor gains in consistency what the neighbourhood loses in hiring."
