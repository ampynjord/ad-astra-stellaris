 # Situation: The Long Ascent
 situation_adastra_ascension:0 "Beyond the Stars"
 situation_adastra_ascension_type:0 "Beyond the Stars"
 situation_adastra_ascension_desc:0 "Our civilization climbs, one by one, the steps that separate its cradle from the stars. Each age brings its knowledge, its tools - and its trials. At the top of this ascent: the equations of faster-than-light travel.\n\n§YMoving from one age to the next takes two things§!: the progress above must reach the end of the stage, §Yand all twenty-five technologies of the age must be researched§!. The bar halts by itself while anything is left to invent.\n\n§HThe ascent has three acts.§!\n§YThe ground§! (Stone to Iron): survive, settle, build.\n§YThe world§! (Late Medieval to Industrial): a world that grows, and production that costs.\n§YThe sky§! (Machine to Early Space): look, launch, reach."
 situation_adastra_ascension_monthly_change_tooltip:0 "Progress increases every month. A determined approach, a strong £unity£ unity output and active £physics£ research all accelerate it.\n\nIt §Rfreezes§! at the end of each stage until §Yall twenty-five technologies of the age§! have been researched."
