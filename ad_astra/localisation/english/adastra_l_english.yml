 adastra_stage_program_explore:0 "Space Exploration Program"
 adastra_stage_program_explore_desc:0 "Enact the §YSpace Exploration Program§! on your capital — it requires the §YSpace Exploration§! technology. The ship it delivers §Ysurveys on its own§!: park it in a system and it reveals one body per month, §Yeven if an empire has claimed it§!. The star is already known."
 adastra_stage_program_orbital:0 "Starbase Program"
 adastra_stage_program_orbital_desc:0 "Enact the §YStarbase Program§!, then exploit the system: at least §Y1 mining or research station§!. The orbital yard opens research on §Ystarbase§! technologies. Optional: the §YOrbital Fleet Program§!, which delivers corvettes without a yard and opens §Yship§! technologies."
 adastra_stage_program_hyperdrive:0 "Hyperspace Program"
 adastra_stage_program_hyperdrive_desc:0 "Enact the §YHyperspace Program§! — it requires all §Ysixteen founding technologies§! of the base game to be researched. Then research the £physics£ §YHyperdrive§! to complete the Ascent."
 decision_adastra_explore:0 "Space Exploration Program"
 decision_adastra_explore_desc:0 "Assemble our first true spaceship: a sublight science vessel, unable to leave the system, but able to unlock all of its secrets."
 decision_adastra_explore_tooltip:0 "Delivers a §Yscience ship§! (sublight - it cannot leave the system).\n§HNext step:§! survey §Yevery body in the system§!: in §Ysystem view§!, right-click a planet, moon or asteroid → §YSurvey§!. (The galaxy-map survey order does not work for a sublight ship; your astronomers already know the star.)\n\n§YRepeatable§!: if you lose your science ship, take this decision again to fit out another."
 adastra.89.name:0 "The Sky Is Already Taken"
 adastra.89.desc:0 "Our engineers went up with their blueprints, their girders and their air bottles. They came back down without having set anything in place.\n\nA station that is not ours already occupies our orbit. It was there before our first section left the ground, and nobody down here remembers watching it arrive.\n\nWe will not take it apart. We have neither the means nor the right — and supposing we had both, it would be the opening move of a war we cannot fight.\n\n§YThe shipyard blueprints are ours to keep§!, and the §YStarbase Program§! remains available. The day that orbit clears, our girders will be ready."
 adastra.89.a:0 "Then we will wait for them to leave."
 adastra.89.a.tooltip:0 "The §YStarbase Program§! stays available for as long as the orbit is occupied."
 decision_adastra_starbase:0 "Starbase Program"
 decision_adastra_colony:0 "Colonization Program"
 decision_adastra_colony_desc:0 "There is, somewhere above our heads, a place where people could live. A moon, a second planet, or merely a hull we will have built ourselves. All that remains is to send people who will not be coming back."
 decision_adastra_colony_tooltip:0 "Delivers an §Y'Ark' colony ship§! crewed by our main species, and its blueprint if you did not already hold it.\n§HNext step:§! select the Ark, then §YColonize§! a target §Ywithin the system§! — a second habitable world, or an §Yorbital habitat complex§! you have built.\n\n§YRepeatable§!: one Ark per target."
 decision_adastra_starbase_desc:0 "Assemble in orbit the first shipyard of our history, and the construction ship that will build our outposts across the system."
 decision_adastra_starbase_fail:0 "Another empire controls the orbit of your homeworld."
 decision_adastra_starbase_tooltip:0 "Builds a §Ystarbase§! (shipyard, solar panels, crew quarters) and delivers a §Yconstruction ship§!.\n§HNext step:§! build at least §Y1 mining or research station§! in the system.\n\nIt also hands over the §Yblueprints§! for the whole sublight fleet — science, constructor, colonizer, corvettes. From here on, a lost ship can be replaced.\n§HUnlocks:§! the §YOrbital Fleet Program§! and the §YColonization Program§!, both repeatable."
 decision_adastra_hyperdrive:0 "Hyperspace Program"
 decision_adastra_hyperdrive_desc:0 "Mobilize all our scientific and industrial resources toward a single goal: unlocking the secret of faster-than-light travel."
 decision_adastra_hyperdrive_tooltip:0 "Makes the £physics£ §YHyperspace Drive§! technology available for research.\n§HFinal step:§! its discovery will complete the Ascent - you will then be a spacefaring empire in full."
 adastra.80.name:0 "The Space Exploration Program"
 adastra.80.desc:0 "The ages of our world are behind us. Ahead: the void, and everything it hides.\n\nOur engineers stand ready to assemble our first true spaceship - no hyperdrive, a prisoner of the system, but free to unlock all of its secrets. The government awaits only the launch order."
 adastra.80.a:0 "Let the exploration begin."
 adastra.80.a.tooltip:0 "The §YSpace Exploration Program§! decision is available on your capital (£energy£ 500 energy, £minerals£ 300 minerals, £alloys£ 150 alloys - 6 months).\nThen survey the system with the delivered ship: in §Ysystem view§!, §Yright-click§! each body → §YSurvey§! (the galaxy-map order does not work for a sublight ship)."
 adastra.81.name:0 "The Starbase Program"
 adastra.81.desc:0 "Every planet, every moon, every asteroid of our system now has a name and a study file. Our science ship has completed the great survey.\n\nThe next step waits in orbit: a permanent shipyard, and the construction ships that will turn those rocks into wealth."
 adastra.81.a:0 "Let us build our first port to the stars."
 adastra.81.a.tooltip:0 "The §YStarbase Program§! decision is available on your capital (£energy£ 1000 energy, £minerals£ 800 minerals, £alloys£ 500 alloys - 1 year).\nThen build at least §Y1 mining or research station§! in the system."
 adastra.82.name:0 "The Hyperspace Program"
 adastra.82.desc:0 "Stations hum around our worlds; ore and data stream down to the surface. Our system works for us.\n\nOnly one threshold remains - the last and greatest. Our theorists swear hyperspace is no fable. It is time to give them the means to prove it."
 adastra.82.a:0 "To infinity."
 adastra.82.a.tooltip:0 "The §YHyperspace Program§! decision is available on your capital (£energy£ 1500 energy, £alloys£ 300 alloys, £unity£ 500 unity - 1 year).\nThen research the §YHyperspace Drive§!: its discovery will complete the Ascent."
 adastra_focus_130.name:0 "First Flight"
 adastra_focus_130.desc:0 "Launch our first science ship."
 adastra_focus_130.hint:0 "Enact the §YSpace Exploration Program§! decision on your capital."
 adastra_focus_130.lore:0 "It will never leave the system. It does not need to: it is a beginning."
 adastra_focus_130.fail:0 "Launch the science ship"
 adastra_focus_130.success:0 "Our first ship flies"
