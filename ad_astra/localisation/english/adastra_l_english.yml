 adastra_fleet_science:0 "Inaugural Science Expedition"
 adastra_fleet_constructor:0 "Builders' Corps"
 adastra_fleet_navy:0 "First Flotilla"

 # Age transitions (titles reuse vanilla age names)
 adastra.age.ok:0 "A new page of our history."
 adastra.50.desc:0 "Around the fires, among flint points and tanned hides, something unique awakens: stories, rites, questions. The first age of our species has begun."
 adastra.51.desc:0 "Molten metal flows into clay molds. Tools, weapons, ornaments: bronze changes the hands that hold it, and the first cities raise their walls toward the sky."
 adastra.52.desc:0 "Iron, harder and more abundant, arms fields and armies alike. Kingdoms rise and fall, and writing now preserves what memory once lost."
 adastra.53.desc:0 "Castles, guilds and charters: power becomes codified. Along the trade routes, ideas travel faster than the caravans that carry them."
 adastra.54.desc:0 "The arts are reborn, ships venture beyond the maps, and daring minds presume to measure the sky. Our world suddenly seems smaller - and the universe larger."
 adastra.55.desc:0 "Steam hisses in the boilers. Distances melt before the rail, and factories redraw the cities. Nature no longer sets the pace: we do."
 adastra.56.desc:0 "Production lines run day and night and agriculture feeds entire metropolises. An industrial civilization now looks at the sky with different eyes."
 adastra.57.desc:0 "Electricity lights up the nights and the first calculating engines hum in ministry basements. Science becomes an institution - and a promise."
 adastra.58.desc:0 "A flash brighter than the sun tore the dawn above a testing desert. We have released the fire at the heart of matter - and discovered we could destroy everything. Meanwhile, our radio telescopes have begun listening to the sky."
 adastra.59.desc:0 "Our scientists have given us the tools to reach the edge of space. The countdown has not yet begun: the first rocket still waits on its launch pad.\n\nSelect [Root.Capital.GetName] and complete §YFirst Suborbital Launch§!, §YFirst Satellite§!, §YCrewed Flight§!, §YFirst Lunar Landing§!, then §YDeep Probe§!. The last milestone opens the §YSpace Exploration Program§!."

 # Reverse observation
 adastra.60.name:0 "Lights in the Night"
 adastra.60.desc:0 "The reports pile up on the general staff's desks: lights turning at right angles above populated areas, radar echoes with no transponder, a pilot swearing he saw 'a metallic structure the size of a city' between the clouds.\n\nSomething is watching us. The question is no longer whether it is true - but what we tell the population."
 adastra.60.a:0 "Classify. Deny. Monitor."
 adastra.60.a.tooltip:0 "The affair is buried. The power of the state grows (£influence£ +25 influence)."
 adastra.60.b:0 "The truth: we are not alone."
 adastra.60.b.tooltip:0 "The people will know. Fervor (£unity£ §Yunity +10%§! for 5 years) but also panic (§Rhappiness -10%§! for 3 years)."
 adastra.61.name:0 "Unexplained Disappearances"
 adastra.61.desc:0 "Isolated shepherds, an entire night shift, a ship found empty under full sail. Those who return speak of white light, of figures too tall, of memories crumbling away.\n\nIn the highest circles, one word keeps coming back: 'sampling'."
 adastra.61.a:0 "Open a commission of inquiry."
 adastra.61.b:0 "Nothing happened. Nothing at all."
 adastra.61.b.tooltip:0 "Official denial feeds the fear (§Rhappiness -10%§! for 3 years) but strengthens the state apparatus (£influence£ +40 influence)."
 adastra.62.name:0 "A Signal from the Void"
 adastra.62.desc:0 "Amid the radio hiss of the stars, our instruments have isolated a structure: ordered, repeated, mathematical pulses. This is no natural phenomenon. Someone, somewhere above our heads, is speaking.\n\nWe do not yet understand what they are saying. But we now know one thing: the sky is inhabited."
 adastra.62.a:0 "Every antenna on that signal."
 adastra.62.b:0 "Cut the recordings. Silence is safer."
 adastra.63.name:0 "Debris Fallen from the Sky"
 adastra.63.desc:0 "The object crossed the atmosphere in a spray of plasma before crashing in a remote region. What the recovery teams found in the crater resembles nothing known: alloys that weld themselves back together, materials our scholars cannot even name.\n\nThose who watch us are not infallible. And their crumbs are worth decades of research."
 adastra.63.a:0 "Reverse-engineer it. Unlimited means, absolute secrecy."
 adastra.63.a.tooltip:0 "£research£ §YResearch +10%§! for 5 years."
 adastra.63.b:0 "Destroy these unholy things."
 # 1.2 : bold Legacy (living galaxy)
 adastra_heritage_1_bold:0 "Legacy of the Ascent — the Trial"
 adastra_heritage_1_bold_desc:0 "Our civilization climbed the last steps to the stars alone, never asking the galaxy to wait. That memory is worth twice as much."
 mod_adastra_heritage_1_bold:0 "Legacy of the Ascent — the Trial"
 mod_adastra_heritage_1_bold_desc:0 "Our civilization climbed the last steps to the stars alone, never asking the galaxy to wait. That memory is worth twice as much."
 adastra_heritage_2_bold:0 "Legacy of the Ascent — the Trial"
 adastra_heritage_2_bold_desc:0 "From the smoke of industry to the fires of orbit, watched by empires already armed. Nobody gave us time: we took it."
 mod_adastra_heritage_2_bold:0 "Legacy of the Ascent — the Trial"
 mod_adastra_heritage_2_bold_desc:0 "From the smoke of industry to the fires of orbit, watched by empires already armed. Nobody gave us time: we took it."
 adastra_heritage_3_bold:0 "Legacy of the Ascent — the Trial"
 adastra_heritage_3_bold_desc:0 "From parchments to rockets, in a galaxy that never slept. Every century we gained was gained against someone."
 mod_adastra_heritage_3_bold:0 "Legacy of the Ascent — the Trial"
 mod_adastra_heritage_3_bold_desc:0 "From parchments to rockets, in a galaxy that never slept. Every century we gained was gained against someone."
 adastra_heritage_4_bold:0 "Legacy of the Ascent — the Trial"
 adastra_heritage_4_bold_desc:0 "From flint to hyperspace, while others were already settling the stars. We should have been wiped off the map a hundred times. We are here."
 mod_adastra_heritage_4_bold:0 "Legacy of the Ascent — the Trial"
 mod_adastra_heritage_4_bold_desc:0 "From flint to hyperspace, while others were already settling the stars. We should have been wiped off the map a hundred times. We are here."

 # --- 1.2: AI personalities for confined empires ----------------------------
 personality_adastra_grounded_open:0 "Sky-Facing Civilization"
 personality_adastra_grounded_open_desc:0 "This civilization has not yet left its world, but it knows it is not alone. It reaches out to whatever passes overhead, and negotiates for what it cannot yet take."
 personality_adastra_grounded_closed:0 "Inward-Turned Civilization"
 personality_adastra_grounded_closed_desc:0 "Confined to its homeworld and aware of its own weakness, this civilization chose walls over treaties. It arms what it can and waits for its moment."
 personality_adastra_grounded_default:0 "Confined Civilization"
 personality_adastra_grounded_default_desc:0 "A civilization still bound to its world of origin, busy surviving itself before it can think of the stars."
 personality_adastra_dormant_sleeper:0 "Dormant Empire"
 personality_adastra_dormant_sleeper_desc:0 "This empire exists, but it does not move. The galaxy waits for someone else to write the first page."

 # --- 1.2 : modificateurs de ressources non inventees ---
 adastra_pre_electric:0 "A World Without Current"
 adastra_pre_electric_desc:0 "Our mills turn on the wind, our forges burn charcoal, and the night watchman lights an oil lamp. None of it is paid for in electricity: we do not yet know what that is. Our works are maintained with material and labour."
 mod_adastra_pre_electric:0 "A World Without Current"
 adastra_pre_manufacture:0 "Everyone Makes Their Own"
 adastra_pre_manufacture_desc:0 "Nobody buys their tools, their clothes or their crockery: they make them, or a neighbour does. No workshop can yet produce them for everyone, so nobody asks for any."
 mod_adastra_pre_manufacture:0 "Everyone Makes Their Own"
 adastra_council_of_elders:0 "The Council of Elders"
 adastra_council_of_elders_desc:0 "Our leaders are not kept: they live among us, work their own share, and settle disputes around the fire. Governing costs nothing here but the time it takes."
 mod_adastra_council_of_elders:0 "The Council of Elders"
 adastra_court_and_retinue:0 "The Court and Its Retinue"
 adastra_court_and_retinue_desc:0 "Power has given itself a roof, and the roof has filled up. Officers, scribes, household staff: they must be housed and fed now. Governing begins to cost."
 mod_adastra_court_and_retinue:0 "The Court and Its Retinue"
 adastra_young_administration:0 "A Young Administration"
 adastra_young_administration_desc:0 "Offices, registers, salaries paid on a fixed date. The state finally knows what it contains — and that knowledge has a price, settled every month."
 mod_adastra_young_administration:0 "A Young Administration"
 # 1.4 - First Steps: these decisions were playable, but their narrative
 # feedback was missing. Every key is also present in French.
 decision_core_suborbital_tooltip:0 "Launches a sounding rocket beyond the atmosphere. §RThe attempt can fail.§!\n\n§HCe que ce jalon apporte :§!\n£ship_size_science£ opens the §YFirst Satellite§! milestone\n£ship_size_science£ every attempt, successful or not, improves the next\n\nRisk falls with the §YAblative Shield§!, §YInformation Theory§! and §YElectronics§!."
 decision_core_satellite_tooltip:0 "Places our civilisation's first satellite in orbit.\n\n§HCe que ce jalon apporte :§!\n£ship_size_science£ opens the §YFirst Crewed Flight§! milestone\n£ship_size_science£ our civilisation stops being wholly blind to its own sky\n\nSomething of ours stays up there, for the first time."
 decision_core_vol_habite_tooltip:0 "Sends a crew beyond the atmosphere, and brings it home.\n\n§HCe que ce jalon apporte :§!\n£ship_size_science£ opens the §YFirst Lunar Landing§! milestone\n£ship_size_science£ with no moon in our system, opens the §YDeep Probe§! directly\n\nNo machine replaces a witness."
 decision_core_premier_corps_tooltip:0 "Attempts the first landing on a moon of our home system.\n\n§HCe que ce jalon apporte :§!\n£ship_size_science£ that moon becomes §Yknown§!, without its deposits being surveyed\n£ship_size_science£ opens the §YDeep Probe§! milestone\n\n§RUnavailable if our home system has no moon.§!"
 decision_core_sonde_tooltip:0 "Sends a probe to reconnoitre §Yone still-unknown body§! of our home system, drawn at random.\n\n§HWhat the mission brings back:§!\n£ship_size_science£ the body becomes §Yknown§! and its §Ydeposits are charted§!\n£ship_size_science£ it opens the §YSpace Exploration Programme§!\n\n§REvery probe already launched makes the next 35 % dearer.§! The decision stays available while a body remains to be reconnoitred."
 adastra.101.name:0 "The Silence After Fire"
 adastra.101.desc:0 "The rocket left the ground, then its signal went dark. We lost machines, resources, and a measure of confidence — not the will to try again."
 adastra.101.a:0 "We will try again."
 adastra.102.name:0 "An Artificial Star"
 adastra.102.desc:0 "Our satellite returns with every pass. It carries voices, measurements, and proof that the sky can become infrastructure."
 adastra.102.a:0 "The sky answers us."
 adastra.103.name:0 "Above the Atmosphere"
 adastra.103.desc:0 "The rocket came back. We now know how to reach the sky and bring knowledge home from it."
 adastra.103.a:0 "This is only the beginning."
 adastra.104.name:0 "Someone Is Up There"
 adastra.104.desc:0 "A living being saw our world from the dark, then returned to tell what our instruments could not."
 adastra.104.a:0 "The world is smaller from above."
 adastra.107.name:0 "Orbit Without Landing"
 adastra.107.desc:0 "Our system offers no other ground. We still learned to remain in the sky, and this first station will become our foothold."
 adastra.107.a:0 "We will make a place of orbit."
 adastra.108.name:0 "A First Other World"
 adastra.108.desc:0 "Our craft landed on [event_target:core_cible.GetName], the first moon our civilisation has touched. That tiny mark changes the horizon of an entire civilisation."
 adastra.108.a:0 "The sky has a shore."
 adastra.111.name:0 "A World in the Dark"
 adastra.111.desc:0 "After years of silence, our probe reached [event_target:core_sonde_cible.GetName]. The instruments held: we now know its surface, its mass, and §Ywhat it holds§!.\n\nThe home system has one less body in the dark."
 adastra.111.a:0 "The home system is no longer entirely dark."
 adastra.112.name:0 "No Uncharted Body"
 adastra.112.desc:0 "Every reachable body in our home system was already known. The mission still proves that we can send instruments farther than ourselves."
 adastra.112.a:0 "The next probe will go farther."

 # --- 1.2 : colonisateur sous-luminique (retour Sithiya) ---
 NAME_Adastra_Corvette:0 "'Sentinel' Corvette"
 NAME_Adastra_Corvette_FTL:0 "Corvette"
 NAME_Adastra_Colonizer:0 "Colony Ship \"Ark\""
 NAME_Adastra_Colonizer_FTL:0 "Colony Ship"
 adastra_fleet_colony:0 "Ark Expedition"
 adastra_tech_marque_fondatrice:0 "§HFounding technology§!"
 adastra_tech_marque_fondatrice_desc:0 "The space program depends on it. The Hyperdrive waits for all sixteen."
 adastra_zone_city_01_prereq:0 "Requires: §HFirst City§!"
 adastra_zone_city_02_prereq:0 "Requires: §HCode of Laws§!"
 # 1.4 - First steps: names and descriptions (tooltips already existed)
 decision_core_suborbital:0 "First Suborbital Launch"
 decision_core_suborbital_desc:0 "A sounding rocket climbs, grazes the void, and falls back. A few minutes above the atmosphere — enough to measure, photograph, and want to stay."
 decision_core_satellite:0 "First Satellite"
 decision_core_satellite_desc:0 "A point of light crosses the evening sky, and it is ours. What goes up can now remain."
 decision_core_vol_habite:0 "First Crewed Flight"
 decision_core_vol_habite_desc:0 "Someone is up there. The whole planet holds its breath with them."
 decision_core_premier_corps:0 "First Lunar Landing"
 decision_core_premier_corps_desc:0 "To land on a moon, walk elsewhere, and come home. The first step on another world belongs to everyone."
 decision_core_sonde_profonde:0 "Deep Probe"
 decision_core_sonde_profonde_desc:0 "It will not come back. It carries our questions toward one uncharted body in our home system - and perhaps, one day, an answer will make the return trip."
 adastra_home_system_protected:0 "§RThis system is the cradle of a civilisation that has not yet left its world. One does not settle here.§!"
 adastra.162.name:0 "The Commission"
 adastra.162.desc:0 "Three hundred accounts in ten years, and no way left to blame them all on weather balloons. A deputy read the list of unexplained cases aloud in session. The silence that followed was an admission.\n\nSomething must be done with this file."
 adastra.162.a:0 "Open a commission of inquiry. Truth first."
 adastra.162.b:0 "Bury the file. The public is not ready."
 adastra.163.name:0 "The Schism of the Sky"
 adastra.163.desc:0 "Doubt has become a matter of society. Some see a presence beyond us and kneel; others demand instruments, figures, protocols.\n\nBoth camps are right about one thing: something is watching us."
 adastra.163.a:0 "The sky is a sign. Let fervour carry us."
 adastra.163.b:0 "The sky is a phenomenon. Let us measure it."
 adastra.164.name:0 "Should We Answer?"
 adastra.164.desc:0 "Our antennae can now broadcast farther than we shall ever travel. The question is no longer technical.\n\nA civilisation that shouts into the dark learns quickly whether anyone is listening - and what that someone is worth."
 adastra.164.a:0 "Broadcast. Let them know we are here."
 adastra.164.b:0 "Stay silent and listen. One does not call what one does not know."
 adastra.165.name:0 "We Know"
 adastra.165.desc:0 "There is no debate left, no commission, no credible sceptic. Our species knows, very nearly as one, that it shares the universe.\n\nWhat changes is not the sky: it is us. Every fragment studied, every trajectory recomputed teaches us something we would not have invented alone."
 adastra.165.a:0 "Then let us learn from them."
 adastra.101.recap:0 "£ship_size_science£ §R-3 stability§! and §R-5% unity§! for ten years: the country mourns the launch.\n£ship_size_science£ The next attempt will be §Ysafer§!: experience counts."
 adastra.102.recap:0 "£ship_size_science£ §G+4% unity§!, §G+3% research speed§! and §G+1 sensor range§! for ten years.\n£ship_size_science£ Opens the §YFirst Crewed Flight§! milestone."
 adastra.103.recap:0 "£ship_size_science£ §G+3% research speed§! and §G+3% ship speed§! for ten years.\n£ship_size_science£ Opens the §YFirst Satellite§! milestone."
 adastra.104.recap:0 "£ship_size_science£ §G+6% unity§! and §G+2 stability§! for ten years.\n£ship_size_science£ Opens the §YFirst Lunar Landing§! (or the §YDeep Probe§! with no moon)."
 adastra.106.recap:0 "£ship_size_science£ The moon we reached becomes §Yknown§!.\n£ship_size_science£ §G+8% unity§!, §G+3 stability§!, §G+3% research speed§! for ten years.\n£ship_size_science£ Opens the §YDeep Probe§! milestone."
 adastra.111.recap:0 "£ship_size_science£ [event_target:core_sonde_cible.GetName] becomes §Yknown§!, deposits included.\n£ship_size_science£ The probe can be launched again while a body remains unknown, §Reach launch costlier than the last§!."
 adastra.112.recap:0 "£ship_size_science£ No unknown body remained in reach: the mission confirms our charts.\n£ship_size_science£ What the space programme retains is that §Ywe know how to send far§!."
 adastra_ciel_lointain:0 "A Distant Sky"
 desc_adastra_ciel_lointain:0 "A world with no fleet and no beacons remains a mystery to everyone's telescopes: until we take flight, first contact chains advance at a quarter speed - and the ones we conduct conclude without communications: what we perceive up there remains nameless."
 adastra.166.name:0 "The Age of Astronomy"
 adastra.166.desc:0 "Our science has entered the space age, and from now on it will scale with our instruments.\n\n§HThe rhythm of this age:§!\n§Ythe first discoveries§! are within reach of our current laboratories;\n§Ya radio telescope§! will open the next wave;\n§Ythe space telescope§! will open the last.\n\nTo see farther is to understand more. Our observatories are no longer an ornament: they are the engine."
 adastra.166.a:0 "The sky is our laboratory."
 adastra.167.name:0 "Science Hits a Ceiling"
 adastra.167.desc:0 "Our researchers are going in circles: the open questions demand data our ground instruments cannot capture.\n\nWe need a §Yradio telescope§!. Until it exists, part of this age's science will stay out of reach."
 adastra.167.a:0 "Build it."
 adastra.168.name:0 "Beyond the Atmosphere"
 adastra.168.desc:0 "The radio telescope kept its promises, and it is showing its limits: the atmosphere blurs what we now seek.\n\n§YRemote Sensing§! is ours: upgrading our radio telescope into a §Yspace telescope§! will open this age's final discoveries."
 adastra.168.a:0 "Send it up there."
 adastra.169.name:0 "One Does Not Spy on Oneself"
 adastra.169.desc:0 "The orbital yard did produce... an observation post aimed at our own world. The engineers, somewhat embarrassed, dismantled it and recycled the materials.\n\nAn observation post exists to study a civilisation unaware of being watched. We know."
 adastra.169.a:0 "Return the alloys to the yard."
 adastra.170.name:0 "Something Crosses the Sky"
 adastra.170.desc.ancien:0 "An immense shape slid between the stars, too slow for a falling star, too steady for a cloud. The elders remember the tales: when the sky moves, the gods are walking.\n\nFires burned all night in the villages."
 adastra.170.desc.medieval:0 "Trustworthy witnesses - monks, barge pilots, an abbess - describe the same thing: a living shape, immense, between the clouds and the stars. The Church calls it a sign. The schools call it a phenomenon.\n\nThe whole realm is debating it."
 adastra.170.desc.victorien:0 "The observatories recorded the transit: colossal estimated mass, irregular trajectory, no stellar parallax. The papers fight over the engravings. The academies fight over the data.\n\nWhatever it is, it LIVES up there."
 adastra.170.desc.machine:0 "Radar tracked it for four hours: an organic mass the size of a fleet, in high orbit, then nothing. The general staff demands answers science does not have.\n\nThe defense budget just passed without debate."
 adastra.170.a:0 "The gods are walking. Let us honour them."
 adastra.170.b:0 "The gods are walking. Let us hide."
 adastra.170.c:0 "It is a sign: let faith gather us."
 adastra.170.d:0 "It is a phenomenon: let the schools study it."
 adastra.170.e:0 "Fund the observatories. We want to understand."
 adastra.170.f:0 "Study its structure. Whatever flies can be imitated."
 adastra.170.g:0 "Classify the file. The public is not ready."
 adastra.181.name:0 "They Cede the Sky"
 adastra.181.desc:0 "Against every expectation, the answer came without condition: the station is ours. Perhaps out of respect. Perhaps because a world seething under a base costs more than it yields.\n\nOur crews board a structure they did not build."
 adastra.181.a:0 "This sky is ours."
 adastra.181.recap:0 "£ship_size_science£ The §Yhome system starbase§! passes under our flag; the occupant §Ydismantles its mining and research stations§! and §Ywipes its survey data§! - our sky is ours to survey again."
 adastra.182.name:0 "Everything Has a Price"
 adastra.182.desc:0 "The answer is an invoice. They will leave - equipment included - for a payment. It is humiliating, it is orbital racketeering, and it is probably the best offer we will get."
 adastra.182.a:0 "Pay 1500 energy and 500 alloys. The sky is worth it."
 adastra.182.recap:0 "£ship_size_science£ For §R1500 energy + 500 alloys§!, the §Ystarbase§! passes under our flag, the §Yoccupant's stations are dismantled§! and its §Ysurvey data wiped§! - our sky is ours to survey again."
 adastra.184.name:0 "A Builder Without a Yard"
 adastra.184.desc:0 "The construction ship left the slipways - and its crew beholds a sky already taken. One does not raise a starbase in an orbit another flag claims.\n\nOur options come down to one word: negotiate."
 adastra.184.a:0 "The yard will wait. We will not."
 adastra.184.recap:0 "£ship_size_science£ The Builder remains available. The §YReclaim Our Sky§! decision, on our capital, opens the negotiation with the occupant."
 adastra.171.name:0 "Living Under Their Star"
 adastra.171.desc.ancien:0 "The fixed star does not move with the seasons. The priests have ruled at last: it is a dwelling, and someone lives there. A temple rises, aligned with that point of sky that never blinks."
 adastra.171.desc.medieval:0 "The king's astronomers confirm it under oath: the fixed star is a THING, not a heavenly fire. The pulpit calls it a heresy to smother, the university a truth to teach. The realm picks its side."
 adastra.171.desc.victorien:0 "The papers finally ask the forbidden question: who owns our sky? The structure in orbit is not ours, does not answer, does not leave. Does sovereignty truly end at the clouds?"
 adastra.171.desc.machine:0 "Every night it passes. Every night, millions of eyes follow it. The silent occupation of our orbit has become the central political fact of our era - and our engineers' best recruiting argument."
 adastra.171.a:0 "A temple for the celestial dwelling."
 adastra.171.b:0 "Teach it: let everyone know what looms above."
 adastra.171.c:0 "Smother it: unrest will not come through us."
 adastra.171.d:0 "Our sky, our cause. The press will see to it."
 adastra.171.e:0 "Let them loom: we will learn from them."
 adastra.171.f:0 "The occupation binds us. Let it serve us."
 adastra_illumination:0 "Enlightened"
 desc_adastra_illumination:0 "A stellar empire is teaching us. Its science flows into our schools - and its way of thinking with it."
 adastra.172.name:0 "The Masters of the Sky"
 adastra.172.desc:0 "They no longer hide: they teach. Equations fall from the sky like rain - propulsion, medicine, materials - each a decade ahead of our finest laboratories.\n\nOur scholars devour. Our elders worry: whoever learns from a master also learns to obey."
 adastra.172.a:0 "Let us learn. We shall see who we become."
 adastra.172.recap:0 "£ship_size_science£ While the pact lasts: §G+25% research speed§!, §R-10% unity§!."
 adastra_elan_societe:0 "Sociological Momentum"
 adastra_elan_physique:0 "Physics Momentum"
 adastra_elan_ingenierie:0 "Engineering Momentum"
 adastra_elan_unite:0 "Unity Momentum"
 decision_adastra_national_programme_tooltip:0 "Sets the civilian orientation for the §Ynext five years§!.\n\n§HWhat this choice implies:§!\n£ship_size_science£ only one programme active at a time\n£ship_size_science£ the available orientations follow the age reached\n£ship_size_science£ the cost follows the age: §Y25§! unity before Medieval, §Y60§!, then §Y140§! at Industrial and §Y280§! in the Space Age\n\n§RRepeatable on expiry: an orientation can be renewed or changed.§!"
 adastra_action_negociation_recente:0 "Talks have just taken place: return to the table in §Ytwo years§!."
 adastra.173.name:0 "Something Lives in the Sky"
 adastra.173.desc.ancien:0 "The lights do not behave like stars. They stop, resume, return at the same hours. The priests say the gods are on patrol; no one dares say aloud that the gods look busy."
 adastra.173.desc.savant:0 "The observations agree from one city to the next: bright points on regulated paths, too slow for meteors, too steady for stars. The academies fight over the explanation - none of them holds."
 adastra.173.desc.moderne:0 "The radar returns are unambiguous: objects are manoeuvring above us. Impossible speeds, radio silence, no registration. The general staffs file the dossier away; the operators do not forget what they saw."
 adastra.173.desc.spatial:0 "This time our instruments caught everything: artificial structures, directed propulsion, coordinated activity. A foreign civilization operates in our neighbourhood. We know neither its name, nor its face, nor its borders - only that it exists, and that it does not introduce itself."
 adastra.173.a:0 "Keep watching."
 adastra.173.recap:0 "£ship_size_science£ A foreign presence is perceived, but §Yno communications§! are established: its name, capital and borders remain unknown. That information will come from §Ysomeone§! - or from our emergence."
 adastra.174.name:0 "They Declare Themselves"
 adastra.174.desc:0 "The signal crosses all our frequencies at once, in a language that learns ours within a few sentences. Those who hold our sky have finally seen fit to introduce themselves. They have a name, borders, intentions - and the message ends on a phrase that sounds like a courtesy, or a warning."
 adastra.174.a:0 "We have much to tell them."
 adastra.174.recap:0 "£ship_size_science£ §YCommunications§! are established with the empire holding our sky - and the §YReclaim Our Sky§! decision opens on our capital."
 adastra.186.name:0 "The Price of Their Protection"
 adastra.186.desc:0 "They accept - in their own way. The sky will be returned, the stations dismantled, the survey data wiped. In exchange, our world will pay the tribute and acknowledge their authority. They call it protection. Our historians know other names for it."
 adastra.186.a:0 "Accept. The sky first, freedom later."
 adastra.186.b:0 "Refuse. We will serve no one."
 adastra.186.recap:0 "£ship_size_science£ The §Ystarbase§! passes under our flag, their stations are dismantled, their survey data wiped - and our empire becomes their §Rtributary§!."
 adastra.187.name:0 "Flat Refusal"
 adastra.187.desc:0 "The answer is one line: the installation is essential to their operations, and the matter is closed. Our jurists, however, have just opened another file: the one establishing, piece by piece, that this system is ours. If words are not enough, deeds will remain."
 adastra.187.a:0 "This sky is ours. We will go and take it."
 adastra.187.recap:0 "£ship_size_science£ We gain a §Yclaim§! on our home system: §Rdeclaring war§! on the occupant becomes the way to take our sky back by force."
 adastra.182.b:0 "Refuse to pay. We will return stronger."
 decision_adastra_reclamer_ciel:0 "Reclaim Our Sky"
 decision_adastra_reclamer_ciel_desc:0 "A foreign flag flies above our world - and this time, we know whom to address. Our diplomats will carry a simple demand: that orbit is ours."
 decision_adastra_reclamer_ciel_tooltip:0 "Carries our claim to the empire holding the home system starbase.\n\n§HIts ethics decide, no dice:§!\n£ship_size_science£ §Gpacifist or xenophile§!: free cession\n£ship_size_science£ §Yauthoritarian§!: cession in exchange for §Ytributary status§!\n£ship_size_science£ §Ymegacorporation, materialist or egalitarian§!: cession for §R1500 energy + 500 alloys§!\n£ship_size_science£ §Rxenophobe or militarist§!: refusal - and a §Yclaim§! on our system, opening the path of §Rwar§!\n\nAny cession transfers the starbase, dismantles their stations and wipes their survey data.\n\n§RAvailable from the Orbital Yard Programme stage. Two years between attempts.§!"
 adastra_decision_reclamer_comms:0 "The occupant has not declared itself yet: no communications are established with it."
 fcsum_adastra_veille_summary:0 "Our instruments keep the object under study. As long as we remain groundbound, it will not answer - and we will not learn what it is."
