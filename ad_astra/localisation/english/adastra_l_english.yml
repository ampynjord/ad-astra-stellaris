 # Approaches
 approach_adastra_tradition:0 "Careful Continuity"
 approach_adastra_tradition_desc:0 "Let society evolve at its own pace, preserving the established order. Progress is slower, but the people are happy and stable."
 approach_adastra_forced_march:0 "Forced March"
 approach_adastra_forced_march_desc:0 "Push the civilization forward, whatever the cost to the people. Progress is much faster, at the price of happiness and stability."
 approach_adastra_skywatchers:0 "Eyes on the Sky"
 approach_adastra_skywatchers_desc:0 "Devote our best minds to unraveling the mysteries of the world - and the sky. Research and progress accelerate, but the elites neglect national cohesion."
 adastra_progress_forced_march:0 "Forced March"
 adastra_progress_skywatchers:0 "Eyes on the Sky"
 adastra_progress_unity:0 "United Society"
 adastra_progress_research:0 "Flourishing Research"

 # adastra.1: age choice
 adastra.1.name:0 "Ad Astra"
 adastra.1.desc:0 "Our story begins here, on [Root.Capital.GetName], the only world our species has ever known. The stars shine overhead, indifferent, and none of us has ever touched them.\n\nAt which age of our long march toward the sky does this chronicle begin?"
 adastra.1.a:0 "$stone_age$"
 adastra.1.a.tooltip:0 "The ultimate challenge. §RMaximum penalties§! (£research£ research -90%, £pops£ production -70%, £unity£ unity -80%) and population reduced by 75%.\nThe entire history of the civilization remains to be written."
 adastra.1.b:0 "$bronze_age$"
 adastra.1.b.tooltip:0 "§RExtreme penalties§! (£research£ research -85%, £pops£ production -65%, £unity£ unity -75%) and population reduced by 75%."
 adastra.1.c:0 "$iron_age$"
 adastra.1.c.tooltip:0 "§RExtreme penalties§! (£research£ research -80%, £pops£ production -60%, £unity£ unity -70%) and population reduced by 75%."
 adastra.1.d:0 "$late_medieval_age$"
 adastra.1.d.tooltip:0 "§RVery heavy penalties§! (£research£ research -75%, £pops£ production -55%, £unity£ unity -65%) and population reduced by 65%."
 adastra.1.e:0 "$renaissance_age$"
 adastra.1.e.tooltip:0 "§RVery heavy penalties§! (£research£ research -70%, £pops£ production -50%, £unity£ unity -55%) and population reduced by 65%.\nUnlocks: organized science (laboratories)."
 adastra.1.f:0 "$steam_age$"
 adastra.1.f.tooltip:0 "§RHeavy penalties§! (£research£ research -60%, £pops£ production -45%, £unity£ unity -45%) and population reduced by 50%.\nUnlocks: basic industry."
 adastra.1.g:0 "$industrial_age$"
 adastra.1.g.tooltip:0 "§RStrong penalties§! (£research£ research -50%, £pops£ production -40%, £unity£ unity -40%) and population reduced by 40%.\nUnlocks: mechanized mining, industrial farming, mass armies."
 adastra.1.h:0 "$machine_age$"
 adastra.1.h.tooltip:0 "§RModerate penalties§! (£research£ research -40%, £pops£ production -30%, £unity£ unity -30%) and population reduced by 25%.\nUnlocks: power plants, planetary government, modern medicine."
 adastra.1.i:0 "$atomic_age$"
 adastra.1.i.tooltip:0 "§RLimited penalties§! (£research£ research -25%, £pops£ production -20%, £unity£ unity -20%) and population reduced by 15%.\nUnlocks: nuclear fission, missiles, radar, lasers, mass media, planetary defenses."
 adastra.1.j:0 "$early_space_age$"
 adastra.1.j.tooltip:0 "§RLight penalties§! (£research£ research -10%, £pops£ production -10%, £unity£ unity -10%) and population reduced by 5%.\nUnlocks: every starting technology except the §HHyperspace Drive§!."

 # adastra.4: welcome
 adastra.4.name:0 "Beyond the Stars"
 adastra.4.desc:0 "The sky of [Root.Capital.GetName] has only ever been crossed by birds and clouds. Up there, the void stretches, vast and silent - even our own orbit is foreign to us.\n\nThe situation §YBeyond the Stars§! now tracks our progress in the situation log. Each age we cross will lighten our burdens and bring the knowledge of its time, until the day the equations of faster-than-light travel are within our reach.\n\nNote: the tutorial has been disabled, as its advice assumes an established spacefaring empire."
 adastra.4.a:0 "The road will be long. Let us walk it."
 adastra.4.a.tooltip:0 "Track your progress in the §Ysituation log§! (§YBeyond the Stars§!). Choose your §Yapproach§! there: continuity, forced march, or eyes on the sky."

 # adastra.6: situation complete

 # Emergence
 adastra.20.name:0 "The Stars Are Ours"
 adastra.20.desc:0 "The prototype vanished from our radar screens - then reappeared, intact, beyond the orbit of our moon. Faster-than-light travel is no longer a dream: it is an engineering fact.\n\nOur orbital shipyard is already refitting our vessels with the new hyperdrives. Beyond the heliopause, the galaxy awaits. The long childhood of our species ends today."
 adastra.20.a:0 "The cradle finally opens."
 adastra.20.a.tooltip:0 "Your science and construction ships are §Yrefitted with the Hyperspace Drive§! (a starbase is provided if you lack one).\nTemporary bonus: §YStellar Dawn§!. You are now a §Yclassic spacefaring empire§!."
 adastra.22.name:0 "A Civilization Reaches the Stars"
 adastra.22.desc:0 "Sensors confirm an unprecedented hyperspace signature: the pre-FTL civilization of [From.GetName], until now confined to its homeworld, has completed its first faster-than-light translation.\n\nA new voice rises in the galaxy."
 adastra.22.a:0 "Interesting."
 adastra.25.name:0 "They Have Reached the Stars"
 adastra.25.desc:0 "Priority report from our sensors: the pre-FTL civilization of [adastra_country.GetName], whose homeworld lies §Ywithin space we control§!, has completed its first hyperspace translation.\n\nThey claim the orbit of their own planet - and the starbase we maintain there. Our answer will define their place in the galaxy... and the image of us they will keep for centuries to come."
 adastra.25.a:0 "Their system is theirs by right. Cede it."
 adastra.25.a.tooltip:0 "The home system's starbase is §Ytransferred§! to [adastra_country.GetName], which becomes an §Yindependent§! empire."
 adastra.25.b:0 "They will emerge under our guidance - for their own good."
 adastra.25.b.tooltip:0 "The home system's starbase is §Ytransferred§! to [adastra_country.GetName], which becomes your §Yprotectorate§!."
 adastra.26.name:0 "Free Among the Stars"
 adastra.26.desc:0 "We are not the first. For years, perhaps decades, an empire from elsewhere has controlled the void above our heads.\n\nAnd yet, the moment our ships crossed the hyperspace threshold, their emissaries sent us a message: the orbit of our world is ours. Their stations are withdrawing. We enter the galaxy free - and forewarned: we will never be alone in it."
 adastra.26.a:0 "We will not forget this gesture."
 adastra.26.a.tooltip:0 "You recover the §Ystarbase§! of your home system and your civilian ships are §Yrefitted with the Hyperspace Drive§!. Temporary bonus: §YStellar Dawn§!."
 adastra.27.name:0 "Under a Giant's Wing"
 adastra.27.desc:0 "The sky was not empty. It never was. At the very moment our first hyperspace vessel returned in triumph, their ambassadors were already in orbit.\n\nTheir message was courteous but final: our emergence will happen under their protection. Their flag flies beside ours on the starbase they hand over. Here we are in the galaxy - vassals before we are even voyagers. That, too, may one day change."
 adastra.27.a:0 "One day, we will fly on our own wings."
 adastra.27.a.tooltip:0 "You become the occupying empire's §Yprotectorate§!, but recover your home system's §Ystarbase§! and your ships refitted with the §YHyperspace Drive§!. Temporary bonus: §YStellar Dawn§!."

 # Fleet names
 adastra_fleet_science:0 "Inaugural Science Expedition"
 adastra_fleet_constructor:0 "Builders' Corps"
 adastra_fleet_navy:0 "First Flotilla"

 # Age transitions (titles reuse vanilla age names)
 adastra.age.ok:0 "A new page of our history."
 adastra.50.desc:0 "Around the fires, among flint points and tanned hides, something unique awakens: stories, rites, questions. The first age of our species has begun."
 adastra.51.desc:0 "Molten metal flows into clay molds. Tools, weapons, ornaments: bronze changes the hands that hold it, and the first cities raise their walls toward the sky."
 adastra.52.desc:0 "Iron, harder and more abundant, arms fields and armies alike. Kingdoms rise and fall, and writing now preserves what memory once lost."
 adastra.53.desc:0 "Castles, guilds and charters: power becomes codified. Along the trade routes, ideas travel faster than the caravans that carry them."
 adastra.54.desc:0 "The arts are reborn, ships venture beyond the maps, and daring minds presume to measure the sky. Our world suddenly seems smaller - and the universe larger."
 adastra.55.desc:0 "Steam hisses in the boilers. Distances melt before the rail, and factories redraw the cities. Nature no longer sets the pace: we do."
 adastra.56.desc:0 "Production lines run day and night and agriculture feeds entire metropolises. An industrial civilization now looks at the sky with different eyes."
 adastra.57.desc:0 "Electricity lights up the nights and the first calculating engines hum in ministry basements. Science becomes an institution - and a promise."
 adastra.58.desc:0 "A flash brighter than the sun tore the dawn above a testing desert. We have released the fire at the heart of matter - and discovered we could destroy everything. Meanwhile, our radio telescopes have begun listening to the sky."
 adastra.59.desc:0 "The countdown ended in a roar of thunder. Up there, a tiny capsule circles [Root.Capital.GetName] every ninety minutes. Nothing seems out of reach anymore - not even the stars."

 # Reverse observation
 adastra.60.name:0 "Lights in the Night"
 adastra.60.desc:0 "The reports pile up on the general staff's desks: lights turning at right angles above populated areas, radar echoes with no transponder, a pilot swearing he saw 'a metallic structure the size of a city' between the clouds.\n\nSomething is watching us. The question is no longer whether it is true - but what we tell the population."
 adastra.60.a:0 "Classify. Deny. Monitor."
 adastra.60.a.tooltip:0 "The affair is buried. The power of the state grows (£influence£ +25 influence)."
 adastra.60.b:0 "The truth: we are not alone."
 adastra.60.b.tooltip:0 "The people will know. Fervor (£unity£ §Yunity +10%§! for 5 years) but also panic (§Rhappiness -10%§! for 3 years)."
 adastra.61.name:0 "Unexplained Disappearances"
 adastra.61.desc:0 "Isolated shepherds, an entire night shift, a ship found empty under full sail. Those who return speak of white light, of figures too tall, of memories crumbling away.\n\nIn the highest circles, one word keeps coming back: 'sampling'."
 adastra.61.a:0 "Open a commission of inquiry."
 adastra.61.b:0 "Nothing happened. Nothing at all."
 adastra.61.b.tooltip:0 "Official denial feeds the fear (§Rhappiness -10%§! for 3 years) but strengthens the state apparatus (£influence£ +40 influence)."
 adastra.62.name:0 "A Signal from the Void"
 adastra.62.desc:0 "Amid the radio hiss of the stars, our instruments have isolated a structure: ordered, repeated, mathematical pulses. This is no natural phenomenon. Someone, somewhere above our heads, is speaking.\n\nWe do not yet understand what they are saying. But we now know one thing: the sky is inhabited."
 adastra.62.a:0 "Every antenna on that signal."
 adastra.62.b:0 "Cut the recordings. Silence is safer."
 adastra.63.name:0 "Debris Fallen from the Sky"
 adastra.63.desc:0 "The object crossed the atmosphere in a spray of plasma before crashing in a remote region. What the recovery teams found in the crater resembles nothing known: alloys that weld themselves back together, materials our scholars cannot even name.\n\nThose who watch us are not infallible. And their crumbs are worth decades of research."
 adastra.63.a:0 "Reverse-engineer it. Unlimited means, absolute secrecy."
 adastra.63.a.tooltip:0 "£research£ §YResearch +10%§! for 5 years."
 adastra.63.b:0 "Destroy these unholy things."
