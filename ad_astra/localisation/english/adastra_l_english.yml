 adastra_stage_program_explore:0 "Space Exploration Program"
 adastra_stage_program_explore_desc:0 "Research §YSpace Construction§! and §YColonization§!, then enact the §YSpace Exploration Program§!. The delivered science ship can survey the home system independently."
 adastra_stage_program_constructor:0 "Orbital Construction Program"
 adastra_stage_program_constructor_desc:0 "Research the foundations of construction and enact the program to receive the first construction ship."
 adastra_stage_program_outpost:0 "First Outpost"
 adastra_stage_program_outpost_desc:0 "Research the first starbase technology, then build your own §Youtpost§! in the home system."
 adastra_stage_program_orbital:0 "Orbital Infrastructure"
 adastra_stage_program_orbital_desc:0 "Add modules to the outpost and build at least one mining or research station."
 adastra_stage_program_hyperdrive:0 "Hyperspace Program"
 adastra_stage_program_hyperdrive_desc:0 "Enact the §YHyperspace Program§! — it requires all §Ysixteen founding technologies§! of the base game to be researched. Then research the £physics£ §YHyperdrive§! to complete the Ascent."
 decision_adastra_explore:0 "Space Exploration Program"
 decision_adastra_explore_desc:0 "Assemble our first true spaceship: a sublight science vessel, unable to leave the system, but able to unlock all of its secrets."
 decision_adastra_explore_tooltip:0 "Launches the Space Exploration Programme.\n\n§HWhat this programme brings:§!\n£ship_size_science£ delivers a sublight §Yscience ship§!\n£ship_size_science£ it surveys the bodies of the home system, one by one\n\n§RRepeatable: every relaunch costs more than the last.§!"
 adastra.89.name:0 "The Sky Is Already Taken"
 adastra.89.desc:0 "Our engineers went up with their blueprints, their girders and their air bottles. They came back down without having set anything in place.\n\nA station that is not ours already occupies our orbit. It was there before our first section left the ground, and nobody down here remembers watching it arrive.\n\nWe will not take it apart. We have neither the means nor the right — and supposing we had both, it would be the opening move of a war we cannot fight.\n\n§YThe shipyard blueprints are ours to keep§!, and the §YStarbase Program§! remains available. The day that orbit clears, our girders will be ready."
 adastra.89.a:0 "Then we will wait for them to leave."
 adastra.89.a.tooltip:0 "The §YStarbase Program§! stays available for as long as the orbit is occupied."
 decision_adastra_constructor:0 "Orbital Construction Program"
 decision_adastra_colony:0 "Colonization Program"
 decision_adastra_colony_desc:0 "There is, somewhere above our heads, a place where people could live. A moon, a second planet, or merely a hull we will have built ourselves. All that remains is to send people who will not be coming back."
 decision_adastra_colony_tooltip:0 "Launches the Colonisation Programme.\n\n§HWhat this programme brings:§!\n£ship_size_science£ delivers a §Ycolony ship§!\n£ship_size_science£ opens settlement beyond the homeworld\n\n§RRepeatable.§!"
 decision_adastra_constructor_desc:0 "Build the first vessel able to turn our world's orbit into real infrastructure."
 decision_adastra_constructor_tooltip:0 "Launches the Orbital Construction Programme.\n\n§HWhat this programme brings:§!\n£ship_size_science£ delivers a §Yconstruction ship§!\n£ship_size_science£ it lets us build our first §Ystarbase§! ourselves\n\n§ROnce only.§! The starbase is never given: it is built."
 building_core_observatory:0 "Astronomical Observatory"
 building_core_observatory_desc:0 "A permanent place devoted to the methodical study of the sky. It can later be upgraded with radio, then orbital instruments.\n\n§YEnables the Astronomical Observation decision (range 35). Upgrades to the Radio Array with Radio Astronomy.§!"
 building_core_radio_telescope:0 "Astronomical Observatory: Radio Array"
 building_core_radio_telescope_desc:0 "An upgrade of the observatory. Radio instruments extend its range and sharpen its view of neighbouring systems.\n\n§YRaises Astronomical Observation to range 75 and can chart bodies of the discovered system. Upgrades to the Orbital Array with Remote Sensing.§!"
 building_core_space_telescope:0 "Astronomical Observatory: Orbital Array"
 building_core_space_telescope_desc:0 "The orbital upgrade of the observatory. Above the atmosphere it reaches farther and resolves the nearby sky more finely.\n\n§YRaises Astronomical Observation to 140, its maximum range, with the best odds of charting the discovered system's bodies.§!"
 decision_core_astronomical_observation:0 "Astronomical Observation"
 decision_core_astronomical_observation_desc:0 "Commit our astronomers and observatory to a long, funded campaign studying the nearby sky."
 decision_core_astronomical_observation_tooltip:0 "Dedicates an observation campaign to one region of the sky.\n\n§HWhat this programme delivers:§!\n£ship_size_science£ reveals §Ya single§! neighbouring system, drawn at random\n£ship_size_science£ only the star is charted: no planets, no moons, no resources\n£ship_size_science£ range depends on the telescope built: §Y35§! (observatory), §Y75§! (radio array), §Y140§! (orbital array)\n\n§RRepeatable: each campaign makes the next one 30% dearer.§!"
 core_mod_suborbital:0 "Suborbital Flight"
 mod_core_mod_suborbital:0 "Suborbital Flight"
 core_mod_suborbital_desc:0 "The first launches proved that space can be reached. This momentum lasts ten years."
 core_mod_echec_lancement:0 "Launch Program Delayed"
 mod_core_mod_echec_lancement:0 "Launch Program Delayed"
 core_mod_echec_lancement_desc:0 "An accident demands a careful review of procedures."
 core_mod_satellites:0 "First Satellites"
 mod_core_mod_satellites:0 "First Satellites"
 core_mod_satellites_desc:0 "Orbital instruments extend our knowledge of the sky for ten years."
 core_mod_vol_habite:0 "Crewed Flight"
 mod_core_mod_vol_habite:0 "Crewed Flight"
 core_mod_vol_habite_desc:0 "Our species has crossed the boundary of the atmosphere. Public momentum lasts ten years."
 core_mod_premier_corps:0 "First Visited World"
 mod_core_mod_premier_corps:0 "First Visited World"
 core_mod_premier_corps_desc:0 "A mission has reached another celestial body. Its lasting public momentum fades after ten years."
 core_mod_station_permanente:0 "Permanent Orbital Presence"
 mod_core_mod_station_permanente:0 "Permanent Orbital Presence"
 core_mod_station_permanente_desc:0 "Humanity lives and works above its homeworld. Its first-decade momentum fades after ten years."
 decision_adastra_hyperdrive:0 "Hyperspace Program"
 decision_adastra_hyperdrive_desc:0 "Mobilize all our scientific and industrial resources toward a single goal: unlocking the secret of faster-than-light travel."
 decision_adastra_hyperdrive_tooltip:0 "Launches the Hyperspace Programme. This is the last act of the ascent.\n\n§HWhat this programme brings:§!\n£ship_size_science£ unlocks research of the §YHyperdrive§!\n£ship_size_science£ its discovery ends the confinement and opens normal Stellaris\n\n§ROnce only. Requires every founding technology.§!"
 adastra.80.name:0 "The Space Exploration Program"
 adastra.80.desc:0 "The ages of our world are behind us. Ahead: the void, and everything it hides.\n\nOur engineers stand ready to assemble our first true spaceship - no hyperdrive, a prisoner of the system, but free to unlock all of its secrets. The government awaits only the launch order."
 adastra.80.a:0 "Let the exploration begin."
 adastra.80.a.tooltip:0 "The §YSpace Exploration Program§! decision is available on your capital (£energy£ 500 energy, £minerals£ 300 minerals, £alloys£ 150 alloys - 6 months). Research §YSpace Construction§! and §YColonization§! to complete this stage. The delivered ship can survey the system independently."
 adastra.81.name:0 "The Orbital Construction Program"
 adastra.81.desc:0 "The system survey is complete. We can now build the tool that will give our civilization a lasting foothold in the void."
 adastra.81.a:0 "Build the first Builder."
 adastra.81.a.tooltip:0 "The §YOrbital Construction Program§! decision becomes available on the capital. It delivers a construction ship, not a starbase."
 adastra.82.name:0 "The First Outpost"
 adastra.82.desc:0 "Our Builder is ready. The outpost anchoring our presence must be built by us, around the home system's star."
 adastra.82.a:0 "Lay our first stone in the void."
 adastra.82.a.tooltip:0 "Research §YStarbase§!, then select the Builder and construct the outpost from system view."
 adastra.83.name:0 "Orbital Infrastructure"
 adastra.83.desc:0 "Our outpost holds the orbit. It must now become useful: stations, modules and a support network."
 adastra.83.a:0 "Put the system to work."
 adastra.83.a.tooltip:0 "Research the starbase technologies, then build at least one mining or research station."
 adastra.84.name:0 "The Hyperspace Program"
 adastra.84.desc:0 "Our stations work around the cradle. Hyperspace is the final threshold."
 adastra.84.a:0 "To infinity."
 adastra.84.a.tooltip:0 "Enact the §YHyperspace Program§!, then research the §YHyperspace Drive§!."
 adastra_focus_130.name:0 "First Flight"
 adastra_focus_130.desc:0 "Launch our first science ship."
 adastra_focus_130.hint:0 "Enact the §YSpace Exploration Program§! decision on your capital."
 adastra_focus_130.lore:0 "It will never leave the system. It does not need to: it is a beginning."
 adastra_focus_130.fail:0 "Launch the science ship"
 adastra_focus_130.success:0 "Our first ship flies"
 adastra_focus_135.name:0 "The Great Survey"
 adastra_focus_135.desc:0 "Survey the entire home system."
 adastra_focus_135.hint:0 "In system view, right-click each body → §YSurvey§! with your science ship (the star is already known)."
 adastra_focus_135.lore:0 "Every rock in the sky now has a name."
 adastra_focus_135.fail:0 "Survey the entire home system"
 adastra_focus_135.success:0 "The home system is charted"
 adastra_focus_140.name:0 "The Industrious Orbit"
 adastra_focus_140.desc:0 "Build the starbase and exploit the system."
 adastra_focus_140.hint:0 "Enact the §YStarbase Program§! decision, then build at least 1 mining or research station."
 adastra_focus_140.lore:0 "The void is not empty: it is full of riches, waiting."
 adastra_focus_140.fail:0 "Build the base and exploit the system"
 adastra_focus_140.success:0 "Our system works for us"
 adastra_focus_100.name:0 "The Century of Steam"
 adastra_focus_100.desc:0 "Bring our civilization into the $steam_age$."
 adastra_focus_100.hint:0 "Progress through the §YBeyond the Stars§! situation up to the $steam_age$."
 adastra_focus_100.lore:0 "Nature will no longer set the pace: we will."
 adastra_focus_100.fail:0 "Reach the $steam_age$"
 adastra_focus_100.success:0 "The $steam_age$ has been reached"
 adastra_focus_105.name:0 "Electricity and Steel"
 adastra_focus_105.desc:0 "Bring our civilization into the $machine_age$."
 adastra_focus_105.hint:0 "Progress through the §YBeyond the Stars§! situation up to the $machine_age$."
 adastra_focus_105.lore:0 "In ministry basements, the first calculating engines are already humming."
 adastra_focus_105.fail:0 "Reach the $machine_age$"
 adastra_focus_105.success:0 "The $machine_age$ has been reached"
 adastra_focus_110.name:0 "The Fire at the Heart of Matter"
 adastra_focus_110.desc:0 "Bring our civilization into the $atomic_age$."
 adastra_focus_110.hint:0 "Progress through the §YBeyond the Stars§! situation up to the $atomic_age$."
 adastra_focus_110.lore:0 "A flash brighter than the sun, and the world will never be the same."
 adastra_focus_110.fail:0 "Reach the $atomic_age$"
 adastra_focus_110.success:0 "The $atomic_age$ has been reached"
 adastra_focus_115.name:0 "Leaving the Cradle"
 adastra_focus_115.desc:0 "Bring our civilization into the $early_space_age$."
 adastra_focus_115.hint:0 "Progress through the §YBeyond the Stars§! situation up to the $early_space_age$."
 adastra_focus_115.lore:0 "A tiny capsule, ninety minutes, and the whole world in a porthole."
 adastra_focus_115.fail:0 "Reach the $early_space_age$"
 adastra_focus_115.success:0 "The $early_space_age$ has been reached"
 adastra_focus_120.name:0 "The Hyperspace Equations"
 adastra_focus_120.desc:0 "Research the §YHyperspace Drive§! technology."
 adastra_focus_120.hint:0 "Complete the §YBeyond the Stars§! situation, then research the §YHyperspace Drive§! in physics."
 adastra_focus_120.lore:0 "On a chalk-covered blackboard, a handful of symbols tips history over."
 adastra_focus_120.fail:0 "Research the §YHyperspace Drive§!"
 adastra_focus_120.success:0 "The §YHyperspace Drive§! is mastered"
 adastra_focus_125.name:0 "Ad Astra"
 adastra_focus_125.desc:0 "Launch the space program and emerge into the galaxy."
 adastra_focus_125.hint:0 "Enact the §YLaunch the Space Program§! decision on your capital."
 adastra_focus_125.lore:0 "Per aspera ad astra. The long childhood of our species comes to an end."
 adastra_focus_125.fail:0 "Emerge into the galaxy"
 adastra_focus_125.success:0 "Our civilization has joined the stars"
 adastra.16.name:0 "The Equations Are Ours"
 adastra.16.desc:0 "Years of calculation, fortunes spent, entire careers consumed - and this morning, on a chalk-covered blackboard, the last unknown fell.\n\nHyperspace is no longer a conjecture. Our laboratories can now turn theory into machine."
 adastra.16.a:0 "The last step."
 adastra.16.a.tooltip:0 "The £physics£ §YHyperspace Drive§! technology is available in physics research. Its discovery §Ycompletes the Ascent§!: you will become a classic spacefaring empire, with your ships, your starbase and your system."
 adastra_approach_tradition_extra:0 "Taking our time: research slows, society breathes.\n"
 adastra_approach_forced_march_extra:0 "Forcing the pace: research speeds up, society pays.\n"
 adastra_approach_skywatchers_extra:0 "Eyes on the sky: research speeds up, unity frays.\n"
 adastra_progress_tradition:0 "Careful Continuity"
 adastra_heritage_1:0 "Legacy of the Ascent"
 adastra_heritage_1_desc:0 "Our civilization climbed the last steps to the stars on its own. That memory will stay with it forever."
 mod_adastra_heritage_1:0 "Legacy of the Ascent"
 mod_adastra_heritage_1_desc:0 "Our civilization climbed the last steps to the stars on its own."
 adastra_heritage_2:0 "Legacy of the Ascent"
 adastra_heritage_2_desc:0 "From the smoke of industry to the fires of orbit: our people forged their own road. That memory makes them unshakeable."
 mod_adastra_heritage_2:0 "Legacy of the Ascent"
 mod_adastra_heritage_2_desc:0 "From the smoke of industry to the fires of orbit: our people forged their own road."
 adastra_heritage_3:0 "Legacy of the Ascent"
 adastra_heritage_3_desc:0 "From parchments to rockets, our people crossed half a millennium of trials. Their patience has become a strength."
 mod_adastra_heritage_3:0 "Legacy of the Ascent"
 mod_adastra_heritage_3_desc:0 "From parchments to rockets, our people crossed half a millennium of trials."
 adastra_heritage_4:0 "Legacy of the Ascent"
 adastra_heritage_4_desc:0 "From flint to hyperspace: no civilization in the galaxy has come so far by its own strength. Nothing can ever stop us again."
 mod_adastra_heritage_4:0 "Legacy of the Ascent"
 mod_adastra_heritage_4_desc:0 "From flint to hyperspace: no civilization has come so far alone."
 adastra_dormant_galaxy:0 "Slumbering Galaxy"
 adastra_dormant_galaxy_desc:0 "Galactic time seems suspended: the great stellar powers barely advance, as if history were waiting for someone."
 mod_adastra_dormant_galaxy:0 "Slumbering Galaxy"
 mod_adastra_dormant_galaxy_desc:0 "Galactic time seems suspended, as if history were waiting for someone."
 adastra.7.name:0 "The Pace of the Galaxy"
 adastra.7.desc:0 "One last question remains before our chronicle begins: while our civilization climbs through its ages, what does the rest of the galaxy do?\n\nThe other stellar empires can live their history at their normal pace - exploring, expanding, warring - or the galaxy can hold its breath until our emergence, so the race starts on equal footing."
 adastra.7.a:0 "The galaxy lives its life. We will arrive late - so what?"
 adastra.7.a.tooltip:0 "No change: AI empires play normally during your ascent. §RThey will have a considerable head start.§!"
 adastra.7.b:0 "Let the galaxy hold its breath until our emergence."
 adastra.7.b.tooltip:0 "All AI empires are §Ydisabled§!: no more expansion, research, diplomacy or wars. They will awaken at your §YFTL breakthrough§!."
 # 1.1 - Ascension speed (adastra.5)
 adastra.5.name:0 "The Pace of the Ascent"
 adastra.5.desc:0 "Will the ages of our world follow one another like a torrent, or like a quiet river?\n\nThis choice sets how fast our civilization climbs through its ages. Nothing else changes: penalties, rewards and the space program remain identical."
 adastra.5.a:0 "A balanced pace. (recommended)"
 adastra.5.a.tooltip:0 "§YNormal§! ascension speed - the mod's original pace."
 adastra.5.b:0 "History accelerates."
 adastra.5.b.tooltip:0 "§YFast§! ascent: about §G+50%§! monthly progress."
 adastra.5.c:0 "Let us take the time to live each age."
 adastra.5.c.tooltip:0 "§YSlow§! ascent: about §R-50%§! monthly progress."
 adastra.5.d:0 "Let every age be an era of its own."
 adastra.5.d.tooltip:0 "§YVery slow§! ascent: about §R-80%§! monthly progress. For the longest campaigns."
 adastra_progress_speed_fast:0 "Pace: accelerated history"
 adastra_progress_speed_slow:0 "Pace: slow ascent"
 adastra_progress_speed_veryslow:0 "Pace: very slow ascent"
 # 1.1 - Exploitation campaigns
 decision_adastra_campaign_harvest:0 "Great Harvests"
 decision_adastra_campaign_harvest_desc:0 "Mobilise the countryside to take everything the land can give. The granaries will fill - but nobody can be in the fields and down the mine on the same day. §YOne campaign at a time.§!"
 decision_adastra_campaign_mining_desc:0 "Open galleries and quarries at forced pace. Stone and metal will pour in - and the fields will be left half worked. §YOne campaign at a time.§!"
 decision_adastra_campaign_mining:0 "Great Mining Levy"
 decision_adastra_campaign_fuel:0 "Wood, Coal and Peat"
 decision_adastra_campaign_fuel_desc:0 "Burn whatever the land offers to feed machines and hearths. £energy£ Energy will flow - at the cost of the forests, the lungs, and the hands taken from everything else. §YOne campaign at a time.§!"
 decision_adastra_campaign_industry:0 "Forced Cadences"
 decision_adastra_campaign_industry_desc:0 "Longer days, faster lines. £consumer_goods£ Goods will leave the workshops - while the grain runs short and the anger rises. §YOne campaign at a time.§!"
 adastra_campaign_harvest:0 "Great Harvests"
 adastra_campaign_harvest_desc:0 "£food£ Food +40%; £minerals£ minerals -25%, £consumer_goods£ goods -25%, growth -10%. Hands in the fields are hands missing everywhere else."
 adastra_campaign_mining:0 "Great Mining Levy"
 adastra_campaign_mining_desc:0 "£minerals£ Minerals +40%; £food£ food -25%, £energy£ energy -15%, happiness -10%, stability -5."
 adastra_campaign_fuel:0 "Wood, Coal and Peat"
 adastra_campaign_fuel_desc:0 "£energy£ Energy +40%; £minerals£ minerals -25%, £food£ food -15%, happiness -10%."
 adastra_campaign_industry:0 "Forced Cadences"
 adastra_campaign_industry_desc:0 "£consumer_goods£ Consumer goods +40%; £food£ food -25%, £energy£ energy -15%, happiness -10%, stability -5."
 # 1.4 - National programme
 decision_adastra_national_programme:0 "National Programme"
 decision_adastra_national_programme_desc:0 "Choose the civil direction of our society for the next five years. The choices follow the current age; only one programme can be active at a time."
 adastra.140.name:0 "The National Programme"
 adastra.140.desc:0 "A civilisation does not advance through an undifferentiated accumulation of resources. It chooses what it organises, funds, and protects. This civil direction lasts §Yfive years§! and never replaces space programmes."
 adastra.140.stone_stores:0 "Build seasonal stores"
 adastra.140.stone_craft:0 "Support stone workshops"
 adastra.140.stone_clans:0 "Strengthen clan ties"
 adastra.140.bronze_granaries:0 "Fund public granaries"
 adastra.140.bronze_foundries:0 "Equip the foundries"
 adastra.140.bronze_trade:0 "Protect exchange routes"
 adastra.140.iron_cadastre:0 "Survey the lands"
 adastra.140.iron_civic_works:0 "Launch civic works"
 adastra.140.iron_markets:0 "Open the markets"
 adastra.140.medieval_guilds:0 "Grant guild charters"
 adastra.140.medieval_estates:0 "Reorganise the estates"
 adastra.140.medieval_royal_works:0 "Fund great works"
 adastra.140.renaissance_trade:0 "Back trading companies"
 adastra.140.renaissance_workshops:0 "Expand manufactories"
 adastra.140.renaissance_patronage:0 "Patronise scholars"
 adastra.140.steam_rail:0 "Bind the country by rail"
 adastra.140.steam_mechanisation:0 "Mechanise the countryside"
 adastra.140.steam_reform:0 "Reform the workshop"
 adastra.140.industrial_mass_production:0 "Adopt mass production"
 adastra.140.industrial_public_education:0 "Generalise public education"
 adastra.140.industrial_extraction:0 "Accelerate extraction"
 adastra.140.machine_electrification:0 "Electrify the country"
 adastra.140.machine_consumption:0 "Support consumption"
