 # Situation: The Long Ascent
 situation_adastra_ascension:0 "Beyond the Stars"
 situation_adastra_ascension_type:0 "Beyond the Stars"
 situation_adastra_ascension_desc:0 "Our civilization climbs, one by one, the steps that separate its cradle from the stars. Each age brings its knowledge, its tools - and its trials. At the top of this ascent: the equations of faster-than-light travel.\n\n§YHistorical ages§! advance through research: each of their twenty-five period technologies fills one point. §YThe space program§! advances through both its listed foundation technologies and one concrete action.\n\n§HSpace sequence§!\n§Y225-250§!: the space age advances with its §Yinstruments§!: the first discoveries come from the laboratories, the next wave requires a §Yradio telescope§!, the last ones a §Yspace telescope§!.\n§Y250§!: complete First Suborbital Launch, First Satellite, Crewed Flight, First Lunar Landing §Y(only if our system has a moon)§!, then Deep Probe.\n§Y275§!: research Construction and Colonization, launch Exploration, then survey the home system.\n§Y300§!: research the construction foundations and commission a Constructor.\n§Y325§!: research Starbase Construction and build the home outpost.\n§Y350§!: research the orbital foundations, build a mining or research station, upgrade the base into a §Ystarport§! (two modules, one building) and raise a first §Ydefense platform§!.\n§Y375§!: launch the Hyperspace Program and research Hyperdrive.\n\n§HThe ascent has three acts.§!\n§YThe ground§! (Stone to Iron): survive, settle, build.\n§YThe world§! (Late Medieval to Industrial): a world that grows, and production that costs.\n§YThe sky§! (Machine to emergence): look, launch, reach."
 situation_adastra_ascension_monthly_change_tooltip:0 "Progress has no monthly gain. Historical period technologies add one point each. In the space program, foundation technologies and the stated player action share each twenty-five-point stage; the final action never becomes optional."
 adastra_stage_stone_age:0 "$stone_age$"
