l_english:
 decision_adastra_navy:0 "Orbital Fleet Program"
 decision_adastra_navy_desc:0 "The void above our heads may not be as empty as it seems. A flotilla of corvettes, even confined to the system, would guarantee that no one takes our orbit without paying for it."
 decision_adastra_navy_tooltip:0 "Launches the Military Fleet Programme.\n\n§HWhat this programme brings:§!\n£ship_size_science£ delivers §Ycorvettes§! without an orbital shipyard\n£ship_size_science£ lets us defend ourselves before we even have a starbase\n\n§ROptional and repeatable. Disappears at Hyperdrive.§!"
 adastra_focus_145.name:0 "The Cradle's Shield"
 adastra_focus_145.desc:0 "Raise our first military flotilla before the breakthrough."
 adastra_focus_145.hint:0 "Enact the optional §YOrbital Fleet Program§! decision (after the starbase, before the Hyperspace Drive)."
 adastra_focus_145.lore:0 "No one will take our orbit without paying for it."
 adastra_focus_145.fail:0 "Raise a military flotilla"
 adastra_focus_145.success:0 "The cradle has its shield"
 adastra_finisher_title:0 "Upon completion: emergence"
 adastra_finisher_desc:0 "Discovering the §YHyperspace Drive§! completes the Ascent: your civilization emerges into the galaxy as a classic spacefaring empire - ships refitted with the Hyperspace Drive and one permanent §YLegacy of the Ascent§!."
