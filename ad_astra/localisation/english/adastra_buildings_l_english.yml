l_english:
 # Ad Astra 1.2 - batiments d'epoque. GENERE par tools/gen_age_buildings.py.
 building_adastra_cave:0 "Ancestral Monument"
 building_adastra_cave_desc:0 "A stone raised apart from the camp, covered in painted hands. Four generations have come here, and each one adds its own beside the others."
 building_adastra_granary:0 "Granary"
 building_adastra_granary_desc:0 "The first building we ever raised for a moment that has not yet come. A civilisation begins when it learns to distrust the winter."
 building_adastra_foundry:0 "Foundry"
 building_adastra_foundry_desc:0 "The fire is kept alive day and night. The smelter is the one craftsman nobody thinks to argue with."
 building_adastra_tablet_house:0 "House of Tablets"
 building_adastra_tablet_house_desc:0 "Here one learns to draw the signs, and above all to read them back. The first place where knowledge outlives the one who wrote it."
 building_adastra_courthouse:0 "Courthouse"
 building_adastra_courthouse_desc:0 "The law is posted at the entrance, legible to anyone who can read. The rest of the building exists only to keep that promise."
 building_adastra_mill:0 "Mill"
 building_adastra_mill_desc:0 "It turns as long as the wind blows or the water falls, asking nothing. The first worker who never complains - and it grinds enough grain to feed a whole village."
 building_adastra_citadel:0 "Citadel"
 building_adastra_citadel_desc:0 "Walls thick enough to hold the whole population through a siege. One hopes never to have to check."
 building_adastra_university:0 "University"
 building_adastra_university_desc:0 "A corporation of masters and students, with its own rules and its own feuds. It will outlast the kingdoms that founded it."
 building_adastra_manufactory:0 "Manufactory"
 building_adastra_manufactory_desc:0 "The noise carries across the town and never quite stops. A month here makes what a workshop made in a year."
 building_adastra_radio:0 "Broadcasting Station"
 building_adastra_radio_desc:0 "A mast, a studio, and suddenly the same voice in every kitchen in the country. Nobody has yet measured what that will change."
 building_adastra_school:0 "Public School"
 building_adastra_school_desc:0 "Free, compulsory and fiercely contested. In two generations nobody will remember that it had to be imposed."
 # Chaine des capitales d'epoque
 building_adastra_seat:0 "Ring of Stones"
 building_adastra_seat_desc:0 "Not a building: a place. People sit in a ring because nobody accepts standing behind anyone else."
 building_adastra_seat_bronze:0 "Common House"
 building_adastra_seat_bronze_desc:0 "A roof big enough to hold everyone in a storm, and central enough that people know where to go when things go wrong."
 building_adastra_seat_iron:0 "Palace"
 building_adastra_seat_iron_desc:0 "Power stops travelling and starts living somewhere. That is more convenient, and far more dangerous."
 building_adastra_seat_medieval:0 "Court and Chancery"
 building_adastra_seat_medieval_desc:0 "A hall for ruling, a room next door for writing down what was ruled. The second will end up mattering more than the first."
 building_adastra_seat_renaissance:0 "Town Hall"
 building_adastra_seat_renaissance_desc:0 "The city buys itself a building, with a clock on top. It announces that everyone's time is worth displaying."
 building_adastra_seat_steam:0 "Government House"
 building_adastra_seat_steam_desc:0 "Here the inhabitants are counted, the taxes levied, the railway lines drawn. The state begins to know what it contains."
 building_adastra_seat_industrial:0 "The Ministries"
 building_adastra_seat_industrial_desc:0 "Government no longer fits in one hall: it needs corridors, departments, archives. The last seat before planetary administration."
